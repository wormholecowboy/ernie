<!DOCTYPE html>
<!--
  VARIATION 04 · Terminal Sidecar
  For: someone who keeps the ernie page in a thin browser column (360–480px) docked beside the terminal all day,
       and drives it from the keyboard.
  Key idea: a dense, monospace, terminal-flavored sidecar. Everything is one line until you open it; one item at a
       time (Q2/4, I1/5); a live "now" ticker shows Claude's latest tool run. Over 1000px it splits into
       content + a persistent log tail.
  MUST items:
    1. Selector: compact repo/branch button at the top ([ and ] cycle). Menu grouped by repo with on/off, session
       state (● working · ◆ waiting on you · ○ idle · × off), needs-you count, unread dot badges and pin toggles.
    2. Tool log: "Log" tab = full-height terminal tail (oldest → newest) with tool filter chips, events / hide
       subagents / files-only toggles and an auto-scroll lock ("▼ N new" pill). Over 1000px it is a persistent right
       column. A new tool run is appended every ~4 s with a highlight, and the "now" ticker follows it.
    3. Tabs: meaning (a), pinned worktrees as a thin second strip of chips (state glyph, needs-you count, unread dot).
       Meaning (b) where natural: the Issues tab opens issues as id chips (ours | theirs), one card at a time.
    4. Home: "needs you" list (with an all-worktrees line), the current plan step and the last 5 tool runs.
  Keys: [ ] worktree · 1–6 tab · j/k next/prev item · a approve issue · n note · f follow log · t theme · ? keys
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ernie Sidecar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Fragment+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    img, svg, pre { max-width: 100%; }
    :root {
      --sans: 'Bricolage Grotesque', system-ui, sans-serif;
      --mono: 'Fragment Mono', ui-monospace, SFMono-Regular, monospace;
      --bg: #0a1520; --bg-card: #0f1e2c; --bg-recessed: #0c1925; --bg-raised: #132638;
      --text: #d8e6f2; --text-dim: #8299ae; --text-accent: #7dd3fc;
      --accent: #38bdf8; --accent-soft: #0c2f48;
      --border: #1c3246; --border-accent: #1f5a82;
      --success: #34d399; --warning: #fbbf24; --error: #f87171;
      --pass-bg: #064e3b; --pass-fg: #a7f3d0;
      --warn-bg: #78350f; --warn-fg: #fde68a;
      --info-bg: #1e3a8a; --info-fg: #dbeafe;
      --shadow: rgba(0,0,0,.5);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f3f7fb; --bg-card: #ffffff; --bg-recessed: #eef3f8; --bg-raised: #ffffff;
        --text: #0d1f2e; --text-dim: #557087; --text-accent: #0369a1;
        --accent: #0284c7; --accent-soft: #e0f2fe;
        --border: #d3dfea; --border-accent: #7cc4ee;
        --success: #059669; --warning: #b45309; --error: #dc2626;
        --pass-bg: #d1fae5; --pass-fg: #065f46;
        --warn-bg: #fef3c7; --warn-fg: #92400e;
        --info-bg: #dbeafe; --info-fg: #1e40af;
        --shadow: rgba(13,31,46,.16);
        color-scheme: light;
      }
    }
    :root[data-theme="light"] {
      --bg: #f3f7fb; --bg-card: #ffffff; --bg-recessed: #eef3f8; --bg-raised: #ffffff;
      --text: #0d1f2e; --text-dim: #557087; --text-accent: #0369a1;
      --accent: #0284c7; --accent-soft: #e0f2fe;
      --border: #d3dfea; --border-accent: #7cc4ee;
      --success: #059669; --warning: #b45309; --error: #dc2626;
      --pass-bg: #d1fae5; --pass-fg: #065f46;
      --warn-bg: #fef3c7; --warn-fg: #92400e;
      --info-bg: #dbeafe; --info-fg: #1e40af;
      --shadow: rgba(13,31,46,.16);
      color-scheme: light;
    }
    html, body { overflow-x: hidden; }
    body { margin: 0; font: 12.5px/1.5 var(--mono); color: var(--text); background-color: var(--bg); }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .dim { color: var(--text-dim); }
    .acc { color: var(--text-accent); }
    .mock-banner { font: 10.5px var(--mono); text-align: center; padding: 4px 16px;
      background: var(--warn-bg); color: var(--warn-fg); letter-spacing: .05em; }

    /* Header: selector, now ticker, pins, tabs */
    .hdr { position: sticky; top: 0; z-index: 50; background: var(--bg-raised);
      border-bottom: 1px solid var(--border); }
    .row { display: flex; align-items: center; gap: 6px; padding: 6px 16px; min-width: 0; }
    .brand { font: 800 15px var(--sans); letter-spacing: -.02em; }
    .brand span { color: var(--accent); }
    .sel { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; text-align: left;
      background: var(--bg-recessed); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; }
    .sel:hover, .sel[aria-expanded="true"] { border-color: var(--accent); }
    .sel .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sel .name b { font-weight: 400; color: var(--text-dim); }
    .kbd { font: 11px var(--mono); min-width: 24px; padding: 3px 6px; border-radius: 4px;
      border: 1px solid var(--border); background: var(--bg-recessed); }
    .kbd:hover { border-color: var(--accent); }
    .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warning); display: inline-block; flex: none; }
    .st { flex: none; width: 1.2em; text-align: center; }
    .st-working { color: var(--success); animation: pulse 1.6s ease-in-out infinite; }
    .st-waiting { color: var(--warning); } .st-idle { color: var(--text-dim); } .st-off { color: var(--error); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .now { padding: 3px 16px 5px; font-size: 11.5px; display: flex; gap: 6px; min-width: 0; white-space: nowrap;
      border-top: 1px dashed var(--border); }
    .now .tx { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .now .cursor { animation: pulse 1s steps(1) infinite; color: var(--accent); }
    .now.fresh { animation: flash 1.4s ease-out; }
    .pins { display: flex; gap: 4px; padding: 4px 16px; overflow-x: auto; scrollbar-width: none;
      border-top: 1px solid var(--border); background: var(--bg-recessed); }
    .pin { flex: none; display: inline-flex; align-items: center; gap: 4px; max-width: 190px; font-size: 11px;
      padding: 1px 4px 1px 6px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg-card); }
    .pin.cur { border-color: var(--accent); color: var(--text-accent); }
    .pin.ghost { border-style: dashed; }
    .pin .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pin .x { border: 0; background: none; padding: 0 2px; color: var(--text-dim); }
    .pin .x:hover { color: var(--error); }
    .cnt { font-size: 10px; padding: 0 4px; border-radius: 3px; background: var(--warn-bg); color: var(--warn-fg); }
    .tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--border); }
    .tab { border: 0; border-bottom: 2px solid transparent; background: none; padding: 6px 2px; font-size: 11.5px;
      color: var(--text-dim); display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
    .tab .ic { font-size: 13px; }
    .tab.on { color: var(--text); border-bottom-color: var(--accent); }
    .tab .lb { display: none; }
    @media (min-width: 440px) { .tab .lb { display: inline; } }

    /* Selector menu */
    .menu { position: fixed; z-index: 70; left: 8px; right: 8px; max-width: 460px; max-height: 70dvh; overflow-y: auto;
      background: var(--bg-raised); border: 1px solid var(--border-accent); border-radius: 6px;
      box-shadow: 0 18px 40px -12px var(--shadow); padding: 4px 0; }
    .menu h4 { margin: 6px 12px 2px; font: 10.5px var(--mono); color: var(--text-dim); text-transform: uppercase; letter-spacing: .1em; }
    .mrow { display: grid; grid-template-columns: 1.2em minmax(0, 1fr) auto auto; gap: 6px; align-items: center;
      padding: 5px 12px; cursor: pointer; }
    .mrow:hover, .mrow.cur { background: var(--accent-soft); }
    .mrow.off { opacity: .55; }
    .mrow .br { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mrow .meta { grid-column: 2 / 4; font-size: 10.5px; color: var(--text-dim); }
    .mrow .star { border: 0; background: none; color: var(--text-dim); grid-row: 1 / 3; grid-column: 4; }
    .mrow .star.on { color: var(--warning); }

    /* Layout: one column; over 1000px, content + persistent log */
    .shell { display: grid; grid-template-columns: minmax(0, 1fr); }
    main { padding: 10px 16px 90px; min-width: 0; }
    .side { display: none; }
    @media (min-width: 1001px) {
      .shell { grid-template-columns: minmax(0, 1fr) minmax(380px, 42%); }
      main { padding: 14px 24px 90px; max-width: 820px; width: 100%; justify-self: center; }
      .side { display: flex; flex-direction: column; position: sticky; top: var(--hdr-h, 150px);
        height: calc(100dvh - var(--hdr-h, 150px) - 44px); border-left: 1px solid var(--border);
        background: var(--bg-recessed); padding: 8px 12px 0; min-width: 0; }
      .tab[data-tab="log"] { display: none; }
      .tabs { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }

    /* Sections */
    .sec { margin: 0 0 14px; scroll-margin-top: calc(var(--hdr-h, 150px) + 8px); }
    .sh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 4px;
      font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .1em; }
    .sh .r { text-transform: none; letter-spacing: 0; }
    .line { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed var(--border); min-width: 0; }
    .line:last-child { border-bottom: 0; }
    .line.go { cursor: pointer; } .line.go:hover { background: var(--accent-soft); }
    .line .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .tag { flex: none; font-size: 10.5px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--border); color: var(--text-dim); }
    .tag.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
    .tag.info { background: var(--info-bg); color: var(--info-fg); border-color: transparent; }
    .tag.pass { background: var(--pass-bg); color: var(--pass-fg); border-color: transparent; }
    .empty { color: var(--text-dim); padding: 6px 0; }
    .btn { font-size: 11.5px; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-card); }
    .btn:hover { border-color: var(--accent); }
    .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn.warn { border-color: var(--warning); color: var(--warning); }
    .lnk { border: 0; background: none; padding: 0; color: var(--text-dim); text-decoration: underline; font-size: 11px; }
    .lnk:hover { color: var(--accent); }
    .off-screen { padding: 24px 0; color: var(--text-dim); }
    .off-screen code { color: var(--text); background: var(--bg-recessed); padding: 1px 5px; border-radius: 3px; }

    /* Item card (question / issue) */
    .card { border: 1px solid var(--border-accent); border-radius: 4px; background: var(--bg-card); padding: 10px 12px; margin-bottom: 10px; }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--accent); }
    .pager { display: flex; gap: 4px; align-items: center; color: var(--text-dim); }
    .card h3 { font: 600 15px/1.35 var(--sans); margin: 6px 0 8px; overflow-wrap: anywhere; }
    .kv { display: grid; grid-template-columns: 6.5ch minmax(0, 1fr); gap: 2px 8px; margin: 4px 0 8px; font-size: 12px; }
    .kv dt { color: var(--text-dim); } .kv dd { margin: 0; overflow-wrap: anywhere; }
    .choices { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .choice { padding: 4px 12px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg-recessed); }
    .choice:hover { border-color: var(--accent); }
    .choice.rec { border-color: var(--success); }
    .choice.rec::after { content: ' ★ rec'; color: var(--success); font-size: 10.5px; }
    .in { width: 100%; padding: 6px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-recessed); }
    .in:focus { outline: none; border-color: var(--accent); }
    .waiting { font-size: 11.5px; color: var(--warning); margin: 2px 0 6px; }
    .gate { display: flex; gap: 4px; align-items: center; font-size: 11px; color: var(--text-dim); margin: 2px 0 8px; flex-wrap: wrap; }
    .gate .on { color: var(--bg); background: var(--accent); padding: 0 5px; border-radius: 3px; }
    .gate .x { color: var(--error); }
    .quote { font-size: 11.5px; color: var(--success); margin: 0 0 6px; overflow-wrap: anywhere; }
    .conf { cursor: help; border: 0; background: none; padding: 0; }
    .conf.v { color: var(--success); } .conf.i { color: var(--warning); } .conf.u { color: var(--error); }
    .method { display: none; font-size: 11px; color: var(--text-dim); background: var(--bg-recessed); padding: 3px 6px;
      border-left: 2px solid var(--border-accent); margin-top: 3px; overflow-wrap: anywhere; }
    .show-method .method { display: block; }
    .ichips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 8px; font-size: 11px; }
    .ichip { padding: 1px 7px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg-card); }
    .ichip.cur { border-color: var(--accent); color: var(--text-accent); }
    .ichip.done { opacity: .5; text-decoration: line-through; }

    /* Example tables */
    .ex { margin: 6px 0 8px; }
    .ex-title { font-size: 11px; color: var(--text-accent); margin-bottom: 3px; }
    .tw { overflow-x: auto; border: 1px solid var(--border); border-radius: 3px; }
    table { border-collapse: collapse; font-size: 11px; width: 100%; }
    th, td { padding: 3px 7px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { white-space: nowrap; } td { overflow-wrap: anywhere; min-width: 7ch; }
    th { color: var(--text-dim); font-weight: 400; background: var(--bg-recessed); }
    tr:last-child td { border-bottom: 0; }
    .cap { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

    /* Plan */
    .bar { height: 3px; background: var(--bg-recessed); margin: 2px 0 6px; }
    .bar i { display: block; height: 100%; background: var(--success); }
    .pbox { flex: none; width: 18px; height: 18px; padding: 0; border-radius: 3px; border: 1px solid var(--text-dim);
      background: none; font-size: 11px; line-height: 16px; text-align: center; }
    .p-done { color: var(--text-dim); } .p-done .grow { text-decoration: line-through; }
    .p-done .pbox { background: var(--success); border-color: var(--success); color: var(--bg); }
    .p-active .pbox { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .p-active .grow { color: var(--text-accent); }

    /* More */
    .subnav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
    .dec { padding: 4px 0 4px 10px; border-left: 2px solid var(--accent); margin: 4px 0 8px; }
    .dec .why { color: var(--text-dim); font-size: 11.5px; }
    .dismiss { flex: none; border: 0; background: none; color: var(--text-dim); padding: 0 4px; }
    .dismiss:hover { color: var(--error); }
    .diagram { overflow: auto; padding: 10px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg-card);
      min-height: 160px; display: flex; justify-content: center; }
    .diagram .nodeLabel { color: var(--text) !important; }
    .diagram .edgeLabel { color: var(--text-dim) !important; background-color: var(--bg-card) !important; }
    .diagram .edgeLabel rect { fill: var(--bg-card) !important; }
    .diagram .edgeLabel p { background-color: var(--bg-card) !important; }

    /* Log tail */
    .logwrap { display: flex; flex-direction: column; min-height: 0; position: relative; }
    main .logwrap { height: calc(100dvh - var(--hdr-h, 150px) - 70px); }
    .side .logwrap { flex: 1; }
    .fchips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; flex: none; }
    .fc { flex: none; font-size: 10.5px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); color: var(--text-dim); }
    .fc.on { border-color: var(--accent); color: var(--text-accent); background: var(--accent-soft); }
    .fc.sep { margin-left: 6px; }
    .tail { flex: 1; overflow-y: auto; margin: 0; padding: 4px 0; list-style: none; font-size: 11.5px;
      background: var(--bg-recessed); border: 1px solid var(--border); border-radius: 3px; min-height: 120px; }
    .side .tail { border: 0; }
    .lr { display: grid; grid-template-columns: 8ch 9ch minmax(0, 1fr) auto; gap: 6px; padding: 1px 8px;
      border-left: 2px solid transparent; white-space: nowrap; }
    .lr .ts { color: var(--text-dim); overflow: hidden; }
    .lr .tl { color: var(--warning); overflow: hidden; text-overflow: ellipsis; }
    .lr .tl.wide { grid-column: 2 / 4; white-space: normal; overflow-wrap: anywhere; }
    .lr .tx { overflow: hidden; text-overflow: ellipsis; }
    .lr .ag { font-size: 10px; color: var(--info-fg); background: var(--info-bg); padding: 0 4px; border-radius: 3px; align-self: center; }
    .lr.by-claude { border-left-color: var(--accent); } .lr.by-claude .tl { color: var(--accent); }
    .lr.by-user { border-left-color: var(--success); } .lr.by-user .tl { color: var(--success); }
    .lr.ev-turn .tl, .lr.ev-turn .tx { color: var(--text-dim); }
    .lr.fresh { animation: flash 1.6s ease-out; }
    @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
    .newpill { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 11px;
      padding: 2px 10px; border-radius: 10px; border: 1px solid var(--accent); background: var(--bg-raised); color: var(--text-accent); }
    .loghead { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .1em; padding-bottom: 4px; flex: none; }

    /* Outbox: one line at the bottom */
    .outbox { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--bg-raised);
      border-top: 1px solid var(--border-accent); box-shadow: 0 -16px 40px -28px var(--shadow); }
    .obar { display: flex; gap: 6px; align-items: center; padding: 6px 16px; }
    .ostate { flex: none; border: 0; background: none; padding: 0; font-size: 11.5px; white-space: nowrap; }
    .ostate b { font-weight: 400; color: var(--warning); }
    .ostate.clear b { color: var(--success); }
    .obar .in { flex: 1; min-width: 0; padding: 4px 8px; }
    .opreview { display: none; padding: 8px 16px 0; max-height: 45dvh; overflow-y: auto; }
    .opreview.open { display: block; }
    .opreview pre { margin: 0 0 6px; padding: 8px 10px; background: var(--bg-recessed); border: 1px solid var(--border);
      border-radius: 3px; font: 11.5px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
    .keys { display: none; font-size: 11px; color: var(--text-dim); padding: 4px 16px 6px; border-top: 1px dashed var(--border); }
    .keys.open { display: block; }
    .keys b { color: var(--text); font-weight: 400; border: 1px solid var(--border); padding: 0 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="mock-banner">MOCK · Terminal Sidecar · sample data, no server</div>

  <header class="hdr" id="hdr">
    <div class="row">
      <span class="brand">e<span>.</span></span>
      <button class="sel" id="sel" type="button" aria-haspopup="listbox" aria-expanded="false" title="pick a log ( [ / ] cycle )"></button>
      <button class="kbd" id="prev" type="button" title="previous worktree ([)">[</button>
      <button class="kbd" id="next" type="button" title="next worktree (])">]</button>
      <button class="kbd" id="theme" type="button" title="theme (t)">◐</button>
    </div>
    <div class="now" id="now"></div>
    <div class="pins" id="pins"></div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <div class="menu" id="menu" hidden></div>

  <div class="shell">
    <main id="main"></main>
    <aside class="side" id="side"></aside>
  </div>

  <footer class="outbox">
    <div class="opreview" id="opreview"></div>
    <div class="obar">
      <button class="ostate" id="ostate" type="button" title="what goes to Claude on your next prompt"></button>
      <input class="in" id="note" type="text" placeholder="note → next prompt (n)" autocomplete="off">
      <button class="kbd" id="keys-btn" type="button" title="keys (?)">?</button>
    </div>
    <div class="keys" id="keys"><b>[</b> <b>]</b> worktree · <b>1</b>–<b>6</b> tab · <b>j</b>/<b>k</b> next/prev item · <b>a</b> approve issue · <b>n</b> note · <b>f</b> follow log · <b>t</b> theme · <b>esc</b> close</div>
  </footer>

  <script>
// Shared sample data for the ernie view variations (ref_ernie_views/*.html).
// Every mock inlines a copy of ERNIE_SAMPLE so all ten show the same data and differ only in layout.
// Shapes follow spec_ernie.md (event types, fold output) plus A114 `tool run` activity rows.
// Fields marked "view-only" are not in the spec yet; mocks that use them should say so.

  <!-- View: renders ERNIE_SAMPLE; actions mutate local state and the pending/inbox preview (the real page POSTs /events) -->
  <script>
    const S = ERNIE_SAMPLE;
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const clock = () => new Date().toTimeString().slice(0, 8);
    const $ = id => document.getElementById(id);

    // View-only state (not in the spec): pins, unread counts, selection per log, log filters
    const ui = {
      key: 'glue/CDIT-2631-ga4-dedupe', tab: 'home', menuOpen: false, preview: false,
      pins: ['glue/CDIT-2631-ga4-dedupe', 'glue/CDIT-2627-gsc-backfill', 'ernie/main'],
      unread: { 'glue/CDIT-2627-gsc-backfill': 2 },
      qSel: {}, iSel: {}, dgm: {}, openEx: {}, method: {},
      log: { tool: 'all', events: true, hideSub: false, files: false }, follow: true, missed: 0, logScroll: 0,
    };
    const TABS = [
      { id: 'home', ic: '⌂', lb: 'home' }, { id: 'q', ic: '?', lb: 'Q' }, { id: 'issues', ic: '!', lb: 'issues' },
      { id: 'plan', ic: '☰', lb: 'plan' }, { id: 'log', ic: '▤', lb: 'log' }, { id: 'more', ic: '⋯', lb: 'more' },
    ];
    const STATE_GLYPH = { working: ['●', 'working'], 'waiting on you': ['◆', 'waiting'], idle: ['○', 'idle'], off: ['×', 'off'] };
    const CONF = { verified: ['✓', 'v'], inferred: ['~', 'i'], unchecked: ['✗', 'u'] };
    const PLAN_GLYPH = { todo: '', active: '▶', done: '✓', dropped: '–' };
    const NEXT_PLAN = { todo: 'active', active: 'done', done: 'todo', dropped: 'todo' };

    const logOf = key => S.logs.find(l => l.key === key);
    const stateOf = key => (logOf(key).on ? S.states[key] : null);
    const cur = () => stateOf(ui.key);
    const glyph = log => { const [g, c] = STATE_GLYPH[log.session.state]; return `<span class="st st-${c}" title="${esc(log.session.state)}">${g}</span>`; };
    const isOpenQ = q => !q.answer && !q.dropped;
    const needsYouQ = q => isOpenQ(q) && !q.more;
    const needsYou = st => st ? st.questions.filter(needsYouQ).length + st.issues.filter(i => i.status === 'explained').length : 0;
    const isTool = a => a.t === 'tool' || a.t === 'file';
    const shortTool = t => (t.startsWith('mcp__') ? `mcp:${t.split('__').pop()}` : t);
    const confTag = (item, scope) => {
      if (!item.confidence) return '';
      const [g, c] = CONF[item.confidence];
      return `<button class="conf ${c}" type="button" data-method="${scope}" title="${esc(item.confidence)}${item.method ? ' · ' + esc(item.method) : ''}">${g}</button>`;
    };
    const methodLine = item => (item.confidence ? `<div class="method">${esc(item.confidence)}: ${esc(item.method || 'no method given')}</div>` : '');

    // Simulates POST /events: local state + pending + inboxText (the server builds inboxText in Go)
    function queue(ev, label) {
      const st = cur();
      st.pending.push({ ...ev, label });
      st.inboxText = `ernie inbox · turn ${st.turn + 1}\n` + st.pending.map(p => `- ${p.label}`).join('\n');
      st.activity.unshift({ ts: clock(), by: 'user', t: ev.t, op: ev.op, text: label, fresh: true });
      render();
    }

    // ---------- header ----------
    function renderHeader() {
      const log = logOf(ui.key);
      const otherUnread = S.logs.some(l => l.key !== ui.key && ui.unread[l.key]);
      $('sel').innerHTML = `${glyph(log)}<span class="name"><b>${esc(log.repo)}/</b>${esc(log.branch)}</span>`
        + `${otherUnread ? '<span class="badge-dot" title="other worktrees have unread items"></span>' : ''}<span class="dim">▾</span>`;
      $('sel').setAttribute('aria-expanded', ui.menuOpen);
      const st = cur();
      const last = st && st.activity.find(isTool);
      const nowEl = $('now');
      if (!st) nowEl.innerHTML = `<span class="st st-off">×</span><span class="dim">ernie is off for this branch</span>`;
      else if (!last) nowEl.innerHTML = `${glyph(log)}<span class="dim">no tool runs yet</span>`;
      else {
        nowEl.innerHTML = `${glyph(log)}<span class="dim">${esc(log.session.state === 'working' ? last.ts : log.session.state + ' · ' + log.session.lastEventAgo)}</span>`
          + `<span class="acc">${esc(shortTool(last.tool))}</span><span class="tx">${esc(last.text)}${last.agent ? ' [' + esc(last.agent) + ']' : ''}</span>`
          + (log.session.state === 'working' ? '<span class="cursor">▌</span>' : '');
        nowEl.classList.remove('fresh');
        if (last.fresh) { void nowEl.offsetWidth; nowEl.classList.add('fresh'); }
      }
      const pinKeys = ui.pins.includes(ui.key) ? ui.pins : [...ui.pins, ui.key];
      $('pins').innerHTML = pinKeys.map(k => {
        const l = logOf(k); const n = needsYou(stateOf(k)); const ghost = !ui.pins.includes(k);
        return `<span class="pin ${k === ui.key ? 'cur' : ''} ${ghost ? 'ghost' : ''}" data-go="${esc(k)}" title="${esc(k)} · ${esc(l.session.state)}">${glyph(l)}`
          + `<span class="nm">${esc(l.branch === 'main' ? l.key : l.branch)}</span>${n ? `<span class="cnt">${n}</span>` : ''}`
          + `${ui.unread[k] ? '<span class="badge-dot"></span>' : ''}`
          + (ghost ? `<button class="x" type="button" data-pin="${esc(k)}" title="pin">+</button>` : `<button class="x" type="button" data-unpin="${esc(k)}" title="unpin">×</button>`)
          + `</span>`;
      }).join('');
      const counts = st ? { q: st.questions.filter(needsYouQ).length, issues: st.issues.filter(i => i.status === 'explained').length } : {};
      const done = st ? st.plan.filter(p => p.status === 'done').length : 0;
      $('tabs').innerHTML = TABS.map((t, i) => {
        const extra = counts[t.id] ? `<span class="cnt">${counts[t.id]}</span>` : (t.id === 'plan' && st && st.plan.length ? `<span class="dim">${done}/${st.plan.length}</span>` : '');
        return `<button class="tab ${ui.tab === t.id ? 'on' : ''}" type="button" data-tab="${t.id}" title="${t.lb} (${i + 1})"><span class="ic">${t.ic}</span><span class="lb">${t.lb}</span>${extra}</button>`;
      }).join('');
      renderMenu();
    }

    function renderMenu() {
      const menu = $('menu');
      menu.hidden = !ui.menuOpen;
      if (!ui.menuOpen) return;
      const r = $('sel').getBoundingClientRect();
      menu.style.top = `${r.bottom + 4}px`;
      const repos = [...new Set(S.logs.map(l => l.repo))];
      menu.innerHTML = repos.map(repo => `<h4>${esc(repo)}</h4>` + S.logs.filter(l => l.repo === repo).map(l => {
        const n = needsYou(stateOf(l.key)); const pinned = ui.pins.includes(l.key);
        return `<div class="mrow ${l.key === ui.key ? 'cur' : ''} ${l.on ? '' : 'off'}" data-go="${esc(l.key)}" role="option">${glyph(l)}`
          + `<span class="br">${esc(l.branch)}</span>`
          + `<span>${n ? `<span class="cnt">${n} need you</span>` : ''}${ui.unread[l.key] ? ' <span class="badge-dot" title="unread"></span>' : ''}</span>`
          + `<button class="star ${pinned ? 'on' : ''}" type="button" data-${pinned ? 'unpin' : 'pin'}="${esc(l.key)}" title="${pinned ? 'unpin' : 'pin as tab'}">${pinned ? '★' : '☆'}</button>`
          + `<span class="meta">${l.on ? 'on' : 'off'} · ${esc(l.session.state)} · ${esc(l.session.lastEventAgo)} ago · ${esc(l.worktree)}</span></div>`;
      }).join('')).join('');
    }

    // ---------- tabs ----------
    function renderHome(st) {
      const log = logOf(ui.key);
      const qs = st.questions; const total = qs.length;
      const needQ = qs.map((q, i) => ({ q, i })).filter(x => needsYouQ(x.q));
      const needI = st.issues.filter(i => i.status === 'explained');
      const waitQ = qs.map((q, i) => ({ q, i })).filter(x => isOpenQ(x.q) && x.q.more);
      const needRows = [
        ...needQ.map(({ q, i }) => `<div class="line go" data-jump="q:${q.id}"><span class="tag warn">Q${i + 1}/${total}</span>`
          + `<span class="grow">${q.kind === 'assume' ? 'I assumed: ' + esc(q.text) + '. True?' : esc(q.text)}</span><span class="dim">›</span></div>`),
        ...needI.map(i => `<div class="line go" data-jump="issues:${i.id}"><span class="tag warn">${i.id} ${i.owner === 'us' ? 'ours' : 'theirs'}</span>`
          + `<span class="grow">approve? ${esc(i.title)}</span><span class="dim">›</span></div>`),
      ];
      const others = S.logs.filter(l => l.key !== ui.key && needsYou(stateOf(l.key)));
      const active = st.plan.find(p => p.status === 'active');
      const done = st.plan.filter(p => p.status === 'done').length;
      const runs = st.activity.filter(isTool).slice(0, 5);
      return `
        <section class="sec"><div class="sh"><span>needs you · ${needRows.length}</span><span class="r">${glyph(log)} ${esc(log.session.state)} · turn ${st.turn}</span></div>
          ${needRows.join('') || '<div class="empty">nothing waiting on you here</div>'}
          ${waitQ.map(({ q, i }) => `<div class="line go" data-jump="q:${q.id}"><span class="tag">Q${i + 1}/${total}</span><span class="grow dim">waiting on Claude: more context on "${esc(q.text)}"</span></div>`).join('')}
          ${others.map(l => `<div class="line go" data-go="${esc(l.key)}">${glyph(l)}<span class="grow dim">${esc(l.key)} · ${needsYou(stateOf(l.key))} need you</span><span class="dim">›</span></div>`).join('')}
        </section>
        <section class="sec"><div class="sh"><span>plan step</span><span class="r">${done}/${st.plan.length}</span></div>
          ${active ? planLine(active) : `<div class="empty">${st.plan.length ? 'no active step' : 'no plan yet'}</div>`}
        </section>
        <section class="sec"><div class="sh"><span>last 5 tool runs</span><button class="lnk r" type="button" data-tab="log">full log ›</button></div>
          <ol class="tail" style="min-height:0;flex:none">${runs.map(logRow).join('') || '<li class="empty" style="padding:4px 8px">none yet</li>'}</ol>
        </section>`;
    }

    function exampleBlock(st, name) {
      const ex = st.examples.find(e => e.name === name);
      if (!ex) return '';
      return `<div class="ex"><div class="ex-title">${esc(ex.name)} · ${esc(ex.title)}</div>
        <div class="tw"><table><tr>${ex.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
        ${ex.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>
        ${ex.caption ? `<div class="cap">${esc(ex.caption)}</div>` : ''}${ex.run ? `<div class="cap">run yourself: <span class="acc">${esc(ex.run)}</span></div>` : ''}</div>`;
    }

    function renderQ(st) {
      const qs = st.questions; const total = qs.length;
      if (!total) return '<div class="empty">no questions</div>';
      const open = qs.filter(isOpenQ);
      let sel = qs.find(q => q.id === ui.qSel[ui.key] && isOpenQ(q)) || open[0];
      let card = '<div class="empty">all answered ✓</div>';
      if (sel) {
        ui.qSel[ui.key] = sel.id;
        const n = qs.indexOf(sel) + 1; const pos = open.indexOf(sel) + 1;
        const exKey = `${ui.key}:${sel.id}`;
        const chips = sel.kind === 'assume'
          ? `<button class="choice" type="button" data-ans="${sel.id}" data-val="yes">Yes</button><button class="choice" type="button" data-ans="${sel.id}" data-val="no">No</button>`
          : sel.choices.map(c => `<button class="choice ${c === sel.recommended ? 'rec' : ''}" type="button" data-ans="${sel.id}" data-val="${esc(c)}">${esc(c)}</button>`).join('');
        card = `<div class="card">
          <div class="card-top"><span>Q${n}/${total} · ${sel.id}${sel.kind === 'assume' ? ' · assumption' : ''}</span>
            <span class="pager"><button class="kbd" type="button" data-qstep="-1">k</button>open ${pos}/${open.length}<button class="kbd" type="button" data-qstep="1">j</button></span></div>
          <h3>${sel.kind === 'assume' ? `I assumed: ${esc(sel.text)}. True?` : esc(sel.text)}</h3>
          ${sel.more ? `<div class="waiting">↻ you asked for more context · Claude answers on your next prompt</div>` : ''}
          ${sel.context || sel.impact ? `<dl class="kv">${sel.context ? `<dt>context</dt><dd>${esc(sel.context)}</dd>` : ''}${sel.impact ? `<dt>impact</dt><dd>${esc(sel.impact)}</dd>` : ''}</dl>` : ''}
          ${sel.example ? (ui.openEx[exKey] ? exampleBlock(st, sel.example) + `<button class="lnk" type="button" data-ex="${exKey}">hide ${esc(sel.example)}</button>`
            : `<button class="lnk" type="button" data-ex="${exKey}">example ${esc(sel.example)} ▸</button>`) : ''}
          <div class="choices">${chips}</div>
          ${sel.kind === 'assume' ? '' : `<input class="in" type="text" data-qin="${sel.id}" placeholder="or type an answer + enter">`}
          <div style="margin-top:6px">${sel.more ? '' : `<button class="lnk" type="button" data-more="${sel.id}">need more context</button>`}</div>
        </div>`;
      }
      const answered = qs.filter(q => q.answer);
      return card + (answered.length ? `<div class="sh"><span>answered · ${answered.length}</span></div>` + answered.map(q =>
        `<div class="line"><span class="dim">Q${qs.indexOf(q) + 1}</span><span class="grow dim">${esc(q.text)} <span style="color:var(--success)">→ ${esc(q.answer)}</span></span><button class="lnk" type="button" data-reopen="${q.id}">change</button></div>`).join('') : '');
    }

    function renderIssues(st) {
      const ordered = [...st.issues.filter(i => i.owner === 'us'), ...st.issues.filter(i => i.owner !== 'us')];
      if (!ordered.length) return '<div class="empty">no issues</div>';
      const sel = ordered.find(i => i.id === ui.iSel[ui.key]) || ordered.find(i => i.status === 'explained') || ordered[0];
      ui.iSel[ui.key] = sel.id;
      const chip = i => `<button class="ichip ${i === sel ? 'cur' : ''} ${['fixed', 'dropped'].includes(i.status) ? 'done' : ''}" type="button" data-isel="${i.id}" title="${esc(i.title)} · ${i.status}">${i.status === 'explained' ? '◆' : i.status === 'approved' ? '✓' : ''}${i.id}</button>`;
      const ours = ordered.filter(i => i.owner === 'us'); const theirs = ordered.filter(i => i.owner !== 'us');
      const steps = ['explained', 'approved', 'fixed'].map(s => `<span class="${sel.status === s ? 'on' : ''}">${s}</span>`).join(' → ');
      let actions = '';
      if (sel.status === 'explained') actions = `<button class="btn pri" type="button" data-iset="approved">approve (a)</button> <button class="btn" type="button" data-iset="dropped">drop</button>`;
      else if (sel.status === 'approved') actions = `${sel.quote ? `<div class="quote">approved in chat: "${esc(sel.quote)}"</div>` : ''}<button class="btn" type="button" data-iset="explained">undo approve</button>`;
      else if (sel.status === 'dropped') actions = `<button class="btn" type="button" data-iset="explained">undo drop</button>`;
      const mKey = `${ui.key}:${sel.id}`;
      return `<div class="ichips"><span class="dim">ours</span>${ours.map(chip).join('')}<span class="dim">│ theirs</span>${theirs.map(chip).join('')}</div>
        <div class="card ${ui.method[mKey] ? 'show-method' : ''}">
          <div class="card-top"><span>I${ordered.indexOf(sel) + 1}/${ordered.length} · ${sel.id} · ${sel.owner === 'us' ? 'ours' : 'theirs (other team)'}</span>
            <span class="pager"><button class="kbd" type="button" data-istep="-1">k</button><button class="kbd" type="button" data-istep="1">j</button></span></div>
          <h3>${confTag(sel, mKey)} ${esc(sel.title)}</h3>
          <div class="gate">${sel.status === 'dropped' ? '<span class="x">dropped</span>' : steps}</div>
          ${sel.example ? exampleBlock(st, sel.example) : ''}
          <dl class="kv"><dt>cause</dt><dd>${esc(sel.cause)}</dd><dt>fix</dt><dd>${esc(sel.fix)}</dd><dt>impact</dt><dd>${esc(sel.impact)}</dd></dl>
          ${methodLine(sel)}
          <div style="margin-top:8px">${actions}</div>
        </div>`;
    }

    const planLine = p => `<div class="line p-${p.status}"><button class="pbox" type="button" data-plan="${p.id}" title="${p.status} · click to change">${PLAN_GLYPH[p.status]}</button>`
      + `<span class="dim">${p.id}</span><span class="grow">${esc(p.text)}</span></div>`;

    function renderPlan(st) {
      if (!st.plan.length) return '<div class="empty">no plan yet</div>';
      const done = st.plan.filter(p => p.status === 'done').length;
      return `<div class="sh"><span>plan</span><span class="r">${done}/${st.plan.length} · click a box to cycle todo → active → done</span></div>
        <div class="bar"><i style="width:${(done / st.plan.length) * 100}%"></i></div>${st.plan.map(planLine).join('')}`;
    }

    function renderMore(st) {
      const facts = st.facts.filter(f => f.kind !== 'term'); const terms = st.facts.filter(f => f.kind === 'term');
      const sections = [['facts', facts.length], ['terms', terms.length], ['decisions', st.decisions.length], ['examples', st.examples.length], ['diagrams', st.diagrams.length], ['notes', st.notes.length]];
      const dSel = st.diagrams.find(d => d.name === ui.dgm[ui.key]) || st.diagrams[0];
      const body = {
        facts: facts.map(f => `<div class="line ${ui.method[`${ui.key}:${f.id}`] ? 'show-method' : ''}">${confTag(f, `${ui.key}:${f.id}`)}<span class="grow">${esc(f.text)}${methodLine(f)}</span><button class="dismiss" type="button" data-dismiss="${f.id}" title="dismiss">×</button></div>`).join(''),
        terms: terms.map(f => `<div class="line"><b class="acc" style="font-weight:400">${esc(f.term)}</b><span class="grow">${esc(f.text)}</span></div>`).join(''),
        decisions: st.decisions.map(d => `<div class="dec"><span class="dim">${d.id}</span> ${esc(d.text)}<div class="why">why: ${esc(d.why)}</div></div>`).join(''),
        examples: st.examples.map(e => exampleBlock(st, e.name)).join(''),
        diagrams: dSel ? `<div class="subnav">${st.diagrams.map(d => `<button class="fc ${d === dSel ? 'on' : ''}" type="button" data-dgm="${esc(d.name)}">${esc(d.name)}</button>`).join('')}</div>
          <div class="diagram" data-mmd="${esc(ui.key + '::' + dSel.name)}"><span class="dim">rendering…</span></div>` : '',
        notes: st.notes.map(n => `<div class="line"><span class="dim">${n.id}</span><span class="grow">${esc(n.text)}</span>${n.ref ? `<span class="tag">${esc(n.ref)}</span>` : ''}</div>`).join(''),
      };
      return `<div class="subnav">${sections.map(([s, n]) => `<a class="fc" href="#m-${s}">${s} ${n}</a>`).join('')}</div>`
        + sections.map(([s, n]) => `<section class="sec" id="m-${s}"><div class="sh"><span>${s}</span><span class="r">${n}</span></div>${body[s] || '<div class="empty">none</div>'}</section>`).join('');
    }

    // ---------- log tail ----------
    function logRow(a) {
      const tool = isTool(a) ? a.tool : a.t;
      const cls = `lr by-${a.by} ${isTool(a) ? '' : 'ev-' + a.t} ${a.fresh ? 'fresh' : ''}`;
      const toolCell = a.text
        ? `<span class="tl" title="${esc(tool)}">${esc(shortTool(tool))}</span><span class="tx" title="${esc(a.text)}">${esc(a.text)}</span>`
        : `<span class="tl wide">${esc(tool)}</span>`;
      return `<li class="${cls}"><span class="ts" title="${esc(a.ts)} · ${esc(a.by)} · ${esc(a.t)}.${esc(a.op)}">${esc(a.ts)}</span>${toolCell}${a.agent ? `<span class="ag">${esc(a.agent)}</span>` : '<span></span>'}</li>`;
    }

    function logRows(st) {
      const f = ui.log;
      return st.activity.filter(a => {
        if (!isTool(a)) return f.events && f.tool === 'all' && !f.files;
        if (f.hideSub && a.agent) return false;
        if (f.files && !(a.t === 'file' || a.tool === 'Read')) return false;
        return f.tool === 'all' || a.tool === f.tool;
      }).slice().reverse();
    }

    function renderLog(container) {
      const st = cur();
      if (!st) { container.innerHTML = '<div class="empty">no log · ernie is off for this branch</div>'; return; }
      const tools = [...new Set(st.activity.filter(isTool).map(a => a.tool))];
      const f = ui.log;
      container.innerHTML = `<div class="logwrap">
        <div class="loghead"><span>tool log · ${esc(ui.key)}</span><button class="fc ${ui.follow ? 'on' : ''}" type="button" data-follow title="auto-scroll (f)">${ui.follow ? '⇣ follow' : '⏸ locked'}</button></div>
        <div class="fchips"><button class="fc ${f.tool === 'all' ? 'on' : ''}" type="button" data-ftool="all">all</button>
          ${tools.map(t => `<button class="fc ${f.tool === t ? 'on' : ''}" type="button" data-ftool="${esc(t)}" title="${esc(t)}">${esc(shortTool(t))}</button>`).join('')}
          <button class="fc sep ${f.events ? 'on' : ''}" type="button" data-ftog="events">events</button>
          <button class="fc ${f.hideSub ? 'on' : ''}" type="button" data-ftog="hideSub">hide subagents</button>
          <button class="fc ${f.files ? 'on' : ''}" type="button" data-ftog="files">files only</button></div>
        <ol class="tail" id="tail-${container.id}">${logRows(st).map(logRow).join('') || '<li class="empty" style="padding:4px 8px">no rows match</li>'}</ol>
        ${!ui.follow && ui.missed ? `<button class="newpill" type="button" data-follow>▼ ${ui.missed} new · follow</button>` : ''}
      </div>`;
      const tail = container.querySelector('.tail');
      tail.scrollTop = ui.follow ? tail.scrollHeight : ui.logScroll;
      tail.addEventListener('scroll', () => {
        const atBottom = tail.scrollHeight - tail.scrollTop - tail.clientHeight < 8;
        ui.logScroll = tail.scrollTop;
        if (atBottom === ui.follow) return;
        ui.follow = atBottom;
        if (atBottom) ui.missed = 0;
        const btn = container.querySelector('[data-follow]');
        if (btn) { btn.classList.toggle('on', atBottom); btn.textContent = atBottom ? '⇣ follow' : '⏸ locked'; }
      });
    }

    // ---------- main ----------
    const wide = window.matchMedia('(min-width: 1001px)');
    function renderMain() {
      const main = $('main');
      // Reason: never clobber an input the user is typing in
      const typing = main.querySelector('input:focus') || [...main.querySelectorAll('input')].some(i => i.value);
      if (typing) return;
      if (wide.matches && ui.tab === 'log') ui.tab = 'home';
      const st = cur();
      if (!st) {
        const log = logOf(ui.key);
        main.innerHTML = `<div class="off-screen">× ernie is off for <span class="acc">${esc(log.key)}</span> (${esc(log.worktree)}).<br><br>Nothing is logged or delivered here. Run <code>ernie init</code> in your own shell to turn it back on.</div>`;
        return;
      }
      if (ui.tab === 'log') return renderLog(main);
      main.innerHTML = { home: renderHome, q: renderQ, issues: renderIssues, plan: renderPlan, more: renderMore }[ui.tab](st);
      if (ui.tab === 'more' && window.drawDiagrams) window.drawDiagrams();
    }

    function renderOutbox() {
      const st = cur();
      const pending = st ? st.pending : [];
      const os = $('ostate');
      os.classList.toggle('clear', !pending.length);
      os.innerHTML = `${ui.preview ? '▾' : '▸'} → next prompt: <b>${pending.length ? pending.length + ' queued' : 'up to date'}</b>`;
      $('note').disabled = !st;
      $('opreview').classList.toggle('open', ui.preview);
      $('opreview').innerHTML = !st ? '<div class="empty">ernie is off; nothing is delivered</div>'
        : `<div class="sh"><span>injected on your next prompt (UserPromptSubmit)</span></div>
          <pre>${esc(st.inboxText || 'nothing queued · Claude is up to date')}</pre>
          ${pending.length ? `<button class="lnk" type="button" data-simulate style="margin-bottom:8px">mock only: simulate your next terminal prompt</button>` : ''}`;
    }

    function render() {
      renderHeader();
      renderMain();
      if (wide.matches) renderLog($('side'));
      renderOutbox();
      document.documentElement.style.setProperty('--hdr-h', `${$('hdr').offsetHeight}px`);
      setTimeout(() => S.logs.forEach(l => (S.states[l.key]?.activity || []).forEach(a => { a.fresh = false; })), 1600);
    }

    function go(key) {
      ui.key = key; ui.menuOpen = false; ui.missed = 0; ui.follow = true;
      delete ui.unread[key];
      render();
    }
    function cycle(dir) {
      const i = S.logs.findIndex(l => l.key === ui.key);
      go(S.logs[(i + dir + S.logs.length) % S.logs.length].key);
    }
    function step(kind, dir) {
      const st = cur(); if (!st) return;
      if (kind === 'q') {
        const open = st.questions.filter(isOpenQ); if (!open.length) return;
        const i = open.findIndex(q => q.id === ui.qSel[ui.key]);
        ui.qSel[ui.key] = open[(i + dir + open.length) % open.length].id;
      } else {
        const ordered = [...st.issues.filter(x => x.owner === 'us'), ...st.issues.filter(x => x.owner !== 'us')];
        const i = ordered.findIndex(x => x.id === ui.iSel[ui.key]);
        ui.iSel[ui.key] = ordered[(i + dir + ordered.length) % ordered.length].id;
      }
      renderMain();
    }
    function answer(id, value) {
      const st = cur(); const q = st.questions.find(x => x.id === id); const val = value.trim();
      if (!q || !val) return;
      q.answer = val; q.more = false;
      $('main').querySelectorAll('input').forEach(i => { i.value = ''; i.blur(); });
      queue({ t: 'question', op: 'answer', id, text: val }, `answer ${id} "${q.kind === 'assume' ? 'I assumed: ' + q.text : q.text}" → ${val}`);
    }
    function setIssue(status) {
      const st = cur(); const issue = st && st.issues.find(i => i.id === ui.iSel[ui.key]);
      if (!issue) return;
      issue.status = status; delete issue.quote;
      queue({ t: 'issue', op: 'set', id: issue.id, status }, `issue ${issue.id} → ${status}${status === 'explained' ? ' (undo)' : ''}`);
    }

    // ---------- events ----------
    document.addEventListener('click', e => {
      const t = e.target.closest('button, [data-go], [data-jump]');
      if (!t) { if (ui.menuOpen && !e.target.closest('#menu')) { ui.menuOpen = false; renderMenu(); } return; }
      const d = t.dataset;
      if (d.pin !== undefined && d.pin) { ui.pins.push(d.pin); e.stopPropagation(); return render(); }
      if (d.unpin) { ui.pins = ui.pins.filter(k => k !== d.unpin); e.stopPropagation(); return render(); }
      if (t.id === 'sel') { ui.menuOpen = !ui.menuOpen; return renderHeader(); }
      if (d.go) return go(d.go);
      if (ui.menuOpen && !t.closest('#menu')) { ui.menuOpen = false; renderMenu(); }
      if (d.tab) { ui.tab = d.tab; return render(); }
      if (d.jump) { const [tab, id] = d.jump.split(':'); ui.tab = tab; (tab === 'q' ? ui.qSel : ui.iSel)[ui.key] = id; return render(); }
      if (d.ans) return answer(d.ans, d.val);
      if (d.more) {
        const q = cur().questions.find(x => x.id === d.more); q.more = true;
        return queue({ t: 'question', op: 'answer', id: q.id, more: true }, `answer ${q.id} "${q.text}" → need more context`);
      }
      if (d.reopen) { cur().questions.find(x => x.id === d.reopen).answer = undefined; ui.qSel[ui.key] = d.reopen; return render(); }
      if (d.qstep) return step('q', Number(d.qstep));
      if (d.istep) return step('i', Number(d.istep));
      if (d.isel) { ui.iSel[ui.key] = d.isel; return renderMain(); }
      if (d.iset) return setIssue(d.iset);
      if (d.ex) { ui.openEx[d.ex] = !ui.openEx[d.ex]; return renderMain(); }
      if (d.method) { ui.method[d.method] = !ui.method[d.method]; return renderMain(); }
      if (d.plan) {
        const p = cur().plan.find(x => x.id === d.plan); p.status = NEXT_PLAN[p.status];
        return queue({ t: 'plan', op: 'set', id: p.id, status: p.status }, `plan ${p.id} → ${p.status}`);
      }
      if (d.dismiss) {
        const st = cur(); const f = st.facts.find(x => x.id === d.dismiss);
        st.facts = st.facts.filter(x => x !== f);
        return queue({ t: 'fact', op: 'dismiss', id: f.id }, `dismiss ${f.id} "${f.text}"`);
      }
      if (d.dgm) { ui.dgm[ui.key] = d.dgm; return renderMain(); }
      if (d.ftool) { ui.log.tool = d.ftool; ui.follow = true; return render(); }
      if (d.ftog) { ui.log[d.ftog] = !ui.log[d.ftog]; ui.follow = true; return render(); }
      if (d.follow !== undefined) { ui.follow = !ui.follow || ui.missed > 0; ui.missed = 0; return render(); }
      if (t.id === 'ostate') { ui.preview = !ui.preview; return renderOutbox(); }
      if (d.simulate !== undefined) return simulatePrompt();
      if (t.id === 'prev') return cycle(-1);
      if (t.id === 'next') return cycle(1);
      if (t.id === 'theme') return toggleTheme();
      if (t.id === 'keys-btn') return $('keys').classList.toggle('open');
    });

    document.addEventListener('keydown', e => {
      const inInput = e.target.matches('input');
      if (e.key === 'Escape') { e.target.blur?.(); ui.menuOpen = false; ui.preview = false; return render(); }
      if (inInput) {
        if (e.key !== 'Enter' || !e.target.value.trim()) return;
        if (e.target.dataset.qin) return answer(e.target.dataset.qin, e.target.value);
        if (e.target.id === 'note' && cur()) {
          const text = e.target.value.trim(); e.target.value = '';
          queue({ t: 'note', op: 'add', text }, `note: ${text}`);
        }
        return;
      }
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key;
      if (k === '[') return cycle(-1);
      if (k === ']') return cycle(1);
      if (/^[1-6]$/.test(k)) { ui.tab = TABS[Number(k) - 1].id; return render(); }
      if (k === 'j' || k === 'k') { if (ui.tab === 'q' || ui.tab === 'issues') step(ui.tab === 'q' ? 'q' : 'i', k === 'j' ? 1 : -1); return; }
      if (k === 'a' && ui.tab === 'issues' && cur()?.issues.find(i => i.id === ui.iSel[ui.key])?.status === 'explained') return setIssue('approved');
      if (k === 'n') { e.preventDefault(); return $('note').focus(); }
      if (k === 'f') { ui.follow = !ui.follow; ui.missed = 0; return render(); }
      if (k === 't') return toggleTheme();
      if (k === '?') return $('keys').classList.toggle('open');
    });

    // Mock only: you send a prompt in the terminal → UserPromptSubmit delivers the inbox → turn mark
    function simulatePrompt() {
      const st = cur(); const n = st.pending.length;
      st.pending = []; st.inboxText = ''; st.turn += 1;
      st.activity.unshift({ ts: clock(), by: 'hook', t: 'turn', op: 'mark', text: `turn ${st.turn} · delivered ${n} event${n === 1 ? '' : 's'}`, fresh: true });
      ui.preview = false;
      render();
    }

    // ---------- simulated liveness: a new `tool run` every ~4 s ----------
    const LIVE = {
      'glue/CDIT-2631-ga4-dedupe': [
        { tool: 'Read', text: 'sql/views/sessions.sql' }, { tool: 'Bash', text: 'Run sessions view on stage for ds-4471' },
        { tool: 'Grep', text: 'page_location', agent: 'Explore' }, { t: 'file', tool: 'Edit', text: 'sql/views/sessions.sql' },
        { tool: 'Bash', text: '' }, { tool: 'Glob', text: 'sql/views/*.sql' },
        { tool: 'Agent', text: 'Check other readers of page_location' }, { tool: 'Read', text: 'loader/hash.py', agent: 'Explore' },
        { tool: 'WebSearch', text: 'GA4 page_location trailing character normalization' }, { tool: 'Bash', text: 'Count sessions per host after normalize' },
      ],
      'glue/CDIT-2627-gsc-backfill': [
        { tool: 'Read', text: 'scripts/g0_probe.py' }, { tool: 'Bash', text: 'Invoke G0 for one property, by day' },
        { tool: 'Grep', text: 'rowLimit' }, { tool: 'WebFetch', text: 'https://developers.google.com/webmaster-tools/v1/searchanalytics/query' },
      ],
      default: [{ tool: 'Read', text: '.mem/artifacts/spec_ernie.md' }, { tool: 'Grep', text: 'tool run' }, { tool: 'Bash', text: 'Run go test ./...' }],
    };
    const liveIdx = {};
    function appendRun(key) {
      const st = S.states[key]; if (!st) return;
      const list = LIVE[key] || LIVE.default; const i = liveIdx[key] = ((liveIdx[key] ?? -1) + 1) % list.length;
      const r = list[i];
      st.activity.unshift({ ts: clock(), by: 'hook', t: r.t || 'tool', op: r.t === 'file' ? 'touch' : 'run', tool: r.tool, text: r.text, agent: r.agent, fresh: true });
      if (st.activity.length > 350) st.activity.length = 350;
      logOf(key).session.lastEventAgo = '0s';
    }
    let tick = 0;
    setInterval(() => {
      tick += 1;
      const activeOn = logOf(ui.key).on;
      if (activeOn) appendRun(ui.key);
      // Reason: the working session keeps running in the background; that's what lights the unread dots
      const bg = 'glue/CDIT-2631-ga4-dedupe';
      if (bg !== ui.key && (tick % 2 === 0 || !activeOn)) { appendRun(bg); ui.unread[bg] = (ui.unread[bg] || 0) + 1; }
      if (!ui.follow && activeOn) ui.missed += 1;
      renderHeader();
      if (ui.tab === 'log' || ui.tab === 'home') renderMain();
      if (wide.matches) renderLog($('side'));
      setTimeout(() => S.logs.forEach(l => (S.states[l.key]?.activity || []).forEach(a => { a.fresh = false; })), 1600);
    }, 4000);

    // ---------- theme ----------
    const root = document.documentElement;
    window.currentTheme = () => root.dataset.theme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    function toggleTheme() {
      root.dataset.theme = window.currentTheme() === 'dark' ? 'light' : 'dark';
      window.dispatchEvent(new Event('themechange'));
    }
    window.mmdSource = id => { const [key, name] = id.split('::'); return S.states[key]?.diagrams.find(d => d.name === name)?.mermaid; };
    wide.addEventListener('change', render);
    window.addEventListener('resize', () => { if (ui.menuOpen) renderMenu(); });
    // Deep link for screenshots and sharing a view: #tab=q&log=glue/main&theme=light
    const hash = new URLSearchParams(location.hash.slice(1));
    if (TABS.some(t => t.id === hash.get('tab'))) ui.tab = hash.get('tab');
    if (logOf(hash.get('log') || '')) { ui.key = hash.get('log'); delete ui.unread[ui.key]; }
    if (['light', 'dark'].includes(hash.get('theme'))) root.dataset.theme = hash.get('theme');
    render();
  </script>

  <!-- Mermaid: renders every [data-mmd] on the page; cached per theme + source so a redraw is cheap -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    const palettes = {
      dark: {
        primaryColor: '#0c2f48', primaryTextColor: '#d8e6f2', primaryBorderColor: '#38bdf8',
        lineColor: '#5f7d96', secondaryColor: '#0f1e2c', tertiaryColor: '#0c1925',
        background: '#0f1e2c', mainBkg: '#0c2f48', edgeLabelBackground: '#0f1e2c',
        actorBkg: '#0c2f48', actorBorder: '#38bdf8', actorTextColor: '#d8e6f2', actorLineColor: '#1f5a82',
        signalColor: '#8299ae', signalTextColor: '#d8e6f2',
      },
      light: {
        primaryColor: '#e0f2fe', primaryTextColor: '#0d1f2e', primaryBorderColor: '#0284c7',
        lineColor: '#7b93a8', secondaryColor: '#ffffff', tertiaryColor: '#f3f7fb',
        background: '#ffffff', mainBkg: '#e0f2fe', edgeLabelBackground: '#ffffff',
        actorBkg: '#e0f2fe', actorBorder: '#0284c7', actorTextColor: '#0d1f2e', actorLineColor: '#7cc4ee',
        signalColor: '#557087', signalTextColor: '#0d1f2e',
      },
    };
    const cache = new Map();
    let pass = 0;
    async function drawDiagrams() {
      const theme = window.currentTheme();
      for (const el of document.querySelectorAll('[data-mmd]')) {
        const src = window.mmdSource(el.dataset.mmd);
        if (!src) continue;
        const cacheKey = `${theme}|${src}`;
        if (cache.has(cacheKey)) { el.innerHTML = cache.get(cacheKey); continue; }
        mermaid.initialize({
          startOnLoad: false, theme: 'base', securityLevel: 'strict',
          fontFamily: "'Fragment Mono', ui-monospace, monospace",
          themeVariables: { ...palettes[theme], fontFamily: "'Fragment Mono', ui-monospace, monospace", fontSize: '12px' },
          flowchart: { curve: 'basis' }, sequence: { mirrorActors: false },
        });
        try {
          const { svg } = await mermaid.render(`mmd-${++pass}`, src);
          cache.set(cacheKey, svg);
          if (el.isConnected) el.innerHTML = svg;
        } catch (err) {
          el.textContent = `diagram failed to render: ${err.message || err}`;
        }
      }
    }
    window.drawDiagrams = drawDiagrams;
    await document.fonts.ready;
    drawDiagrams();
    window.addEventListener('themechange', drawDiagrams);
  </script>
</body>
