    Object.assign(S.states[key].questions.find(x => x.id === id), sent.before);
    view.queued = view.queued.filter(x => x !== sent);
    renderAll();
  }

  function renderAll() {
    pickWorktree();
    renderPicker();
    renderTabs();
    if (view.active === 'planning') renderPlanning();
    else if (view.active === 'issues') renderIssues();
    else if (view.active === 'facts') renderFacts();
    else if (view.active === 'log') renderLogTab();
    else renderHome();
    Object.values(S.states).forEach(st => st.activity.forEach(a => { a.fresh = false; }));
  }

  function openTab(key) {
    view.active = key;
    if (key === 'log') view.logUnseen = 0;
    history.replaceState(null, '', key === 'home' ? location.pathname : `#${key}`);
    renderAll();
  }

  // ---------- Events ----------
  document.addEventListener('click', e => {
    const t = e.target;
    const tab = t.closest('[data-tab]');
    if (tab) return openTab(tab.dataset.tab);

    // Epic and bead chips can sit on other tabs (a decision's ref, a finding's source); they open the Planning tab
    const epicOpen = t.closest('[data-epic-open]');
    if (epicOpen) {
      view.selectedEpic = epicOpen.dataset.epicOpen;
      return view.active === 'planning' ? renderAll() : openTab('planning');
    }
    const beadOpen = t.closest('[data-bead-open]');
    if (beadOpen) {
      const [logKey, epicId] = beadOpen.dataset.beadOpen.split('|');
      view.wt = logKey;
      view.selectedEpic = `${logKey}|${epicId}`;
      view.selectedBead = beadOpen.dataset.beadOpen;
      return view.active === 'planning' ? renderAll() : openTab('planning');
    }
    const issueJump = t.closest('[data-issue-jump]');
    if (issueJump) {
      view.wt = issueJump.dataset.issueJump.split('|')[0];
      view.selectedIssue = issueJump.dataset.issueJump;
      return openTab('issues');
    }
    // P3 Q4: archive writes a `<branch>.archived` marker (implies off); restore removes it. Neither reaches Claude
    const archive = t.closest('[data-archive]');
    if (archive) {
      Object.assign(logOf(archive.dataset.archive), { archived: true, on: false });
      return renderAll();
    }
    const restore = t.closest('[data-restore]');
    if (restore) {
      logOf(restore.dataset.restore).archived = false;
      return renderAll();
    }
    const research = t.closest('[data-research]');
    if (research) return startResearch(research.dataset.research);
    const factKindPill = t.closest('[data-fact-kind]');
    if (factKindPill) {
      const kind = factKindPill.dataset.factKind;
      view.factsKind = view.factsKind === kind ? 'all' : kind;
      return renderAll();
    }
    const answer = t.closest('[data-answer]');
    if (answer) return answerQuestion(answer.dataset.answer, answer.dataset.text, !!answer.dataset.more);
    const answerUndo = t.closest('[data-answer-undo]');
    if (answerUndo) return undoAnswer(answerUndo.dataset.answerUndo);
    const issueOpen = t.closest('[data-issue-open]');
    if (issueOpen) { view.selectedIssue = issueOpen.dataset.issueOpen; return renderAll(); }
    const issueSet = t.closest('[data-issue-set]');
    if (issueSet) return setIssue(issueSet.dataset.issueSet, issueSet.dataset.to);
    const copy = t.closest('[data-copy]');
    if (copy) {
      navigator.clipboard?.writeText(copy.dataset.copy).catch(() => {});
      view.copied = copy.dataset.copy;
      return renderAll();
    }
    const method = t.closest('[data-method]');
    if (method) {
      const k = method.dataset.method;
      view.shownMethods.has(k) ? view.shownMethods.delete(k) : view.shownMethods.add(k);
      return renderAll();
    }
    const dismiss = t.closest('[data-dismiss]');
    if (dismiss) {
      // Page action `fact dismiss`: goes to that session's Claude on its next prompt
      const [key, id] = dismiss.dataset.dismiss.split('|');
      const st = S.states[key];
      const fact = st.facts.find(f => f.id === id);
      st.facts = st.facts.filter(f => f !== fact);
      view.queued.push({ key, label: `dismissed ${id}` });
      st.activity.unshift({ ts: clock(), by: 'user', t: 'fact', op: 'dismiss', text: `dismissed ${id} "${fact.text}"`, fresh: true });
      return renderAll();
    }
  });

  document.addEventListener('submit', e => {
    const noteForm = e.target.closest('[data-note-form]');
    if (noteForm) {
      e.preventDefault();
      const text = noteForm.elements.text.value.trim();
      return text && addNote(text);
    }
    const form = e.target.closest('[data-answer-form]');
    if (!form) return;
    e.preventDefault();
    const text = form.elements.text.value.trim();
    if (text) answerQuestion(form.dataset.answerForm, text, false);
  });

  document.addEventListener('change', e => {
    const f = view.logFilter;
    const id = e.target.id;
    if (id === 'wt-pick') {
      view.wt = e.target.value;
      view.logUnseen = 0;
      return renderAll();
    }
    if (id === 'log-session') f.session = e.target.value;
    else if (id === 'log-tool') f.tool = e.target.value;
    else if (id === 'log-agents') f.hideAgents = e.target.checked;
    else if (id === 'log-files') f.filesOnly = e.target.checked;
    else if (id === 'log-events') f.events = e.target.checked;
    else return;
    renderFeed();
  });

  // Planning keys: [ ] prev/next bead, { } prev/next epic. Issues keys: [ ] prev/next, a approve. Ignored while typing.
  document.addEventListener('keydown', e => {
    if (e.target.closest?.('input, select, textarea') || e.metaKey || e.ctrlKey) return;
    if (view.active === 'planning') {
      const step = { '[': () => stepBead(-1), ']': () => stepBead(1), '{': () => stepEpic(-1), '}': () => stepEpic(1) }[e.key];
      return step?.();
    }
    if (view.active !== 'issues') return;
    if (e.key === '[') return stepIssue(-1);
    if (e.key === ']') return stepIssue(1);
    if (e.key !== 'a' || !view.selectedIssue) return;
    const [key, id] = view.selectedIssue.split('|');
    if (S.states[key].issues.find(i => i.id === id)?.status === 'explained') setIssue(view.selectedIssue, 'approved');
  });

  // ---------- Simulated liveness: the working session keeps calling tools (PostToolUse → tool run / file touch) ----------
  // Reason: the mock clock continues from the sample's newest row so new rows sort against sample times
  let simSeconds = 14 * 3600 + 21 * 60 + 8;
  const clock = () => { simSeconds += 4; return new Date(simSeconds * 1000).toISOString().slice(11, 19); };
  const LIVE_ROWS = [
    { t: 'tool', tool: 'Read', text: 'loader/hash.py' },
    { t: 'tool', tool: 'Grep', text: 'page_location', agent: 'Explore' },
    { t: 'file', tool: 'Edit', text: 'sql/views/sessions.sql' },
    { t: 'tool', tool: 'Bash', text: 'Re-run dedupe probe after normalizing' },
    { t: 'tool', tool: 'Glob', text: 'sql/views/*.sql', agent: 'Explore' },
    { t: 'tool', tool: 'Bash', text: '' },
    { t: 'tool', tool: 'Bash', text: 'Compare September session counts before and after' },
  ];
  let liveIndex = 0;
  setInterval(() => {
    const row = LIVE_ROWS[liveIndex++ % LIVE_ROWS.length];
    const working = S.logs.filter(l => l.on && !l.archived && l.session.state === 'working');
    working.forEach(log => {
      const st = S.states[log.key];
      st.activity.unshift({ ts: clock(), by: 'hook', op: row.t === 'file' ? 'touch' : 'run', ...row, sid: log.session.id, fresh: true });
      st.activity.length = Math.min(st.activity.length, 350);
      log.session.lastEventAgo = '0s';
    });
    // Only the picked worktree's rows count toward the Tool log badge
    if (working.some(l => l.key === view.wt)) {
      if (view.active === 'log') renderFeed();
      else { view.logUnseen += 1; renderTabs(); }
    }
    Object.values(S.states).forEach(st => st.activity.forEach(a => { a.fresh = false; }));
  }, 4000);

  // Theme
  const root = document.documentElement;
  const currentTheme = () => root.dataset.theme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.getElementById('theme-toggle').addEventListener('click', () => {
    root.dataset.theme = currentTheme() === 'dark' ? 'light' : 'dark';
  });

  // Deep link: #planning, #issues, #facts or #log
  const hashKey = decodeURIComponent(location.hash.slice(1));
  if (isTab(hashKey)) openTab(hashKey); else renderAll();
</script>
</body>
</html>
