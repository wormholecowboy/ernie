<!DOCTYPE html>
<!--
  TEMPLATE · shell taken from 01 Mission Control, filled one piece at a time.
  Tabs: ⌂ Home · ▤ Planning · ◎ Issues · ◆ Facts & decisions · ≡ Tool log.
  Worktree picker (P3 Q1, Q4): one select in the top bar picks the worktree every tab shows; no per-tab pickers, no "all".
    Grouped by repo; a worktree reads "· folder gone", "· off" or "· needs you" after its branch. Archived worktrees sit in
    an "Archived (N)" group. A banner above each tab: archived → Restore; folder gone → Archive (never auto-hidden);
    off → logging paused; an id collision (P4 F1) → "d1 collided … kept as d1′, rename by hand".
  Pieces so far:
    - Home tab: open questions for the picked worktree (items.jsonl, P4 Q1; replaces queue.md "qs", P4 Q2) as a focus list
      (picked from qcard-d): one line each with Q<n>, the question and its status (★ recommended, asked for more context,
      sent); the selected one opens with Context / If wrong / Example / Answer in a left gutter. Answer row: numbered
      choices, "need more context" (`question answer {more: true}`, stays open, A88) and an "other answer…" box (not on
      `assume` yes/no checks, A113). An answer queues for the session's next prompt with Undo until then.
      Keys: j/k move, 1–9 answer, m more context, u undo.
      Top strip: Where work is (active epic + bar, active bead, up to 3 `bd ready` beads: todo with every dep done),
      Add a note (`note add`), Ops (memory `## ops`, read-only, per branch). Session and Sync cards were dropped (git history).
      Right column: Next prompt delivers (inbox preview: sample `pending` + page-queued events), Answered.
    - Planning tab (view-only data: `epics` + `adhoc` in _sample_state.js; Beads fields not final): three columns. Left,
      the worktree's epics with a done/total bar, then ◇ Ad hoc (beads with no epic; replaces queue.md "next", P4 Q2);
      middle, the selected epic's goal, beads, epic done-when checks and its PRD-review findings; right, the selected bead:
      labels in a gutter, content capped at ~62ch: Status (text todo → active → done, or blocked naming the unfinished deps) ·
      What · Notes · Done when · Depends on / Unblocks (click to jump, across epics) · Linked · Files · Commit. Linked also
      shows the reverse links the page computes (P4 Q3): decisions whose `ref` is this bead, findings from its code review.
      ▤ PRD chip under the epic goal (P2: one PRD per epic, path from `spec_id`) swaps the right column for the PRD: plan
      state + review rounds from the epic's labels, path, section chips that scroll to each ## heading, the markdown at the
      reading measure. Opening a bead goes back to it; picking another epic keeps the PRD open on that epic's PRD.
      Keys: [ ] prev/next bead, { } prev/next epic, p PRD, esc back.
    - Issues tab (from 03 Issue Workbench): findings (Beads bugs) grouped by epic, then Ad hoc (P3 Q2); waiting-for-approval
      first. Each row and worksheet names its source = parent: PRD review (epic), code review · <bead>, or ad hoc; the
      source pill opens it on Planning. Worksheet: labels in a gutter (same layout as Home's open questions): Status (text
      explained → approved → fixed) · Example (first: lead with an example) · Cause · Fix · If skipped · How sure · Linked ·
      Decide, always the last row: keyed Approve / Dismiss / Undo (dismiss = close with resolution=dismissed).
      Keys: [ ] prev/next, a approve, d dismiss, u undo.
    - Facts & decisions tab: left column glossary then decisions (text + why + a `→ bead` chip from `ref`, P4 Q3; a
      "collided" tag on F1 collisions); right column facts with ✓ ~ ✗ badges (tap for the method, × to dismiss).
      Facts panel opens with filter pills that use the badge labels: All · ✓ verified · ~ inferred · ✗ unknown (data value
      `unchecked`, or no confidence), each with its count; tapping the active pill goes back to All.
      Each inferred / unknown fact has a ⌕ research pill (page op `fact research`, deferred to v2): queued for that
      session's next prompt → Claude spawns a subagent (Agent row + its tool calls land in the Tool log) → the answer updates
      the row (`fact set`, A123: badge → verified, method, corrected text with the old wording kept) or leaves a
      "no answer" note + retry. Mock: the next prompt is simulated 3 s after the click; outcomes come from RESEARCH_OUTCOMES.
    - Tool log tab: the picked worktree's tool calls, newest first (A114: Bash shows its description only). Filters:
      session (P3 Q5; activity rows carry `sid`, Claude's and your item events don't, A123), tool, hide subagents,
      files only, + ernie events. A new row lands every ~4 s on the working session.
  Data: _sample_state.js, loaded from this folder (same data as the 10 variations; P3/P4 additions at the end).
  Colours: _tokens.css; map in style-guide.html. Top-bar select picks the scheme: retro (default; brown ground, burnt-orange
    boxes, cream text, teal accent), original dark or original light (the blue scheme with its grid). Remembered per browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ernie · Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); font-size: 15px; line-height: 1.6; color: var(--text);
    background-color: var(--bg); overflow-x: hidden;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px; background-attachment: fixed; }
  code { font-family: var(--mono); font-size: .92em; }
  button { font: inherit; color: inherit; }
  .mock-banner { font: 11px var(--mono); text-align: center; padding: 5px 16px; background: var(--warn-bg); color: var(--warn-fg); letter-spacing: .05em; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .badge { font: 12px var(--mono); min-width: 18px; padding: 1px 6px; border-radius: 9px; background: var(--accent); color: var(--bg); text-align: center; }

  /* Top bar: brand · tabs · status */
  .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: flex-end; gap: 10px; padding: 8px 20px 0;
    border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); }
  .brand { font-weight: 800; font-size: 19px; letter-spacing: -.02em; padding-bottom: 7px; }
  .brand span { color: var(--accent); }
  .tabstrip { display: flex; align-items: flex-end; gap: 2px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: thin; }
  .tab { display: flex; align-items: center; border: 1px solid var(--border); border-bottom: none; border-radius: 8px 8px 0 0;
    background: var(--bg-recessed); color: var(--text-dim); flex: none; max-width: 260px; }
  .tab.active { background: var(--bg-card); color: var(--text); border-color: var(--border-accent); box-shadow: inset 0 2px 0 var(--accent); }
  .tab > button { background: none; border: 0; cursor: pointer; padding: 7px 12px; display: flex; align-items: center; gap: 7px;
    font: 600 13px var(--sans); min-width: 0; }
  .status { display: flex; align-items: center; gap: 12px; font: 13px var(--sans); color: var(--text-dim); padding-bottom: 7px; flex: none; }
  .live { color: var(--success); display: inline-flex; align-items: center; gap: 6px; }
  .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: pulse 1.8s infinite; }
  .icon-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: 12px var(--mono); }
  .icon-btn:hover { border-color: var(--accent); }
  @media (max-width: 720px) {
    .topbar { flex-wrap: wrap; padding: 8px 16px 0; }
    .status { margin-left: auto; }
    .tabstrip { order: 3; flex-basis: 100%; }
  }

  main { max-width: 1680px; margin: 0 auto; padding: 16px 20px 48px; }
  @media (max-width: 720px) { main { padding: 12px 16px 48px; } }

  /* Empty tab body */
  .canvas { min-height: calc(100dvh - 140px); border: 1.5px dashed var(--border); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 24px 16px; }
  .canvas h1 { margin: 0; font: 800 20px var(--sans); letter-spacing: -.02em; overflow-wrap: anywhere; }
  .canvas p { margin: 0; font: 13px/1.45 var(--sans); color: var(--text-dim); overflow-wrap: anywhere; }

  /* Tab header: title + meta */
  .tab-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin: 2px 0 14px; }
  .tab-head h1 { margin: 0; font: 800 22px var(--sans); letter-spacing: -.02em; }
  .tab-head .meta { font: 13px/1.45 var(--sans); color: var(--text-dim); }
  select.wt-pick, .filters select, select.scheme-pick { max-width: 100%; font: 12px var(--mono); background: var(--bg-card); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }

  /* Worktree picker (top bar) + worktree banners */
  .wt-pick-wrap { padding-bottom: 6px; flex: none; max-width: 240px; min-width: 0; }
  select.wt-pick { font-weight: 600; border-color: var(--border-accent); width: 100%; }
  .wt-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 14px; padding: 8px 12px; border-radius: 8px;
    font: 13px/1.45 var(--sans); border: 1px solid var(--border); background: var(--bg-card); overflow-wrap: anywhere; }
  .wt-banner.warn { border-color: var(--warning); background: var(--warn-bg); color: var(--warn-fg); }
  .wt-banner.dim { color: var(--text-dim); border-style: dashed; }
  .wt-banner span { flex: 1 1 260px; }

  /* Panels (from 01) */
  .panel { background: var(--bg-card); border: 1px solid var(--box-edge); border-radius: 10px; min-width: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--border);
    font: 600 13px/1.3 var(--sans); color: var(--text-dim); }
  .panel-head .count { color: var(--text-accent); }
  .panel-body { padding: 10px 14px 14px; min-width: 0; }
  .empty { color: var(--text-dim); font-size: 13px; line-height: 1.45; padding: 4px 0; }
  .hint { font: 13px/1.45 var(--sans); color: var(--text-dim); }
  .item-id { font: 12px var(--mono); color: var(--text-dim); margin-right: 6px; }
  .sub { font: 600 13px/1.3 var(--sans); color: var(--text-dim); margin: 14px 0 6px; }
  .sub:first-child { margin-top: 0; }
  .wt { font: 12px var(--mono); color: var(--text-accent); background: var(--accent-soft); border-radius: 4px; padding: 0 6px; margin-right: 6px; white-space: nowrap; }
  .collided { font: 12px var(--mono); color: var(--warn-fg); background: var(--warn-bg); border-radius: 4px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }
  .dec .refs { margin-top: 4px; }

  /* Facts & decisions */
  .fd-grid { display: grid; gap: 16px; align-items: start; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 860px) { .fd-grid { grid-template-columns: minmax(0, 1fr); } }
  .fd-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .dec { padding: 4px 0 4px 10px; border-left: 2px solid var(--accent); margin: 4px 0 12px; overflow-wrap: break-word; }
  .dec b { font-weight: 600; display: block; } .dec .why { font-size: 13px; line-height: 1.45; color: var(--text-dim); }
  .facts { list-style: none; margin: 0; padding: 0; }
  .facts li { position: relative; padding: 7px 28px 7px 0; border-bottom: 1px dashed var(--border); overflow-wrap: break-word; }
  .facts li:last-child { border-bottom: none; }
  .dismiss { position: absolute; right: 0; top: 6px; width: 22px; height: 22px; border-radius: 5px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--text-dim); }
  .dismiss:hover { border-color: var(--border); color: var(--error); }
  .conf { font: 12px var(--mono); padding: 1px 6px; border-radius: 4px; border: 0; cursor: pointer; margin-right: 6px; vertical-align: 1px; }
  .c-verified { background: var(--pass-bg); color: var(--pass-fg); } .c-inferred { background: var(--warn-bg); color: var(--warn-fg); }
  .c-unchecked { background: var(--bg-raised); color: var(--text-dim); border: 1px dashed var(--text-dim); }
  .method { font: 13px/1.5 var(--mono); color: var(--text-dim); margin: 5px 0 2px; padding: 5px 8px; border-left: 2px solid var(--border-accent); overflow-wrap: anywhere; }
  .gloss { margin: 0; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 12px; align-items: baseline; font-size: 15px; line-height: 1.6; }
  .gloss dt { font: 13px/1.6 var(--mono); color: var(--text-accent); } .gloss dd { margin: 0; overflow-wrap: break-word; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .fpill { font: 12px var(--mono); padding: 2px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-recessed); color: var(--text-dim); cursor: pointer; }
  .fpill:hover { border-color: var(--accent); }
  .fpill .n { opacity: .7; margin-left: 5px; }
  .fpill.on { border-color: transparent; }
  .fpill.on.k-all { background: var(--accent); color: var(--bg); }
  .fpill.on.k-verified { background: var(--pass-bg); color: var(--pass-fg); }
  .fpill.on.k-inferred { background: var(--warn-bg); color: var(--warn-fg); }
  .fpill.on.k-unchecked { background: var(--bg-raised); color: var(--text); border: 1px dashed var(--text-dim); }
  .queued { font: 13px/1.45 var(--sans); color: var(--warning); margin-top: 10px; overflow-wrap: anywhere; }
  .rpill { font: 12px var(--mono); padding: 1px 8px; margin-left: 8px; border-radius: 10px; border: 1px solid var(--border-accent);
    background: var(--accent-soft); color: var(--text-accent); cursor: pointer; vertical-align: 1px; white-space: nowrap; }
  .rpill:hover { border-color: var(--accent); }
  .rpill.wait { cursor: default; border-style: dashed; background: none; color: var(--warning); border-color: var(--warning); }
  .rpill.running { cursor: default; background: none; }
  .rpill.running::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%;
    border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .found { border-left-color: var(--success); } .found s { opacity: .7; }
  .no-answer { border-left-color: var(--warning); }

  /* Issues: list + worksheet (from 03) */
  .is-grid { display: grid; gap: 16px; align-items: start; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); }
  @media (max-width: 900px) { .is-grid { grid-template-columns: minmax(0, 1fr); } }
  .is-list { position: sticky; top: 64px; }
  @media (max-width: 900px) { .is-list { position: static; } }
  .is-group { font: 600 13px/1.3 var(--sans); color: var(--text-dim); margin: 12px 4px 4px; display: flex; justify-content: space-between; }
  .is-group:first-child { margin-top: 0; }
  .is-row { width: 100%; display: grid; grid-template-columns: 14px auto minmax(0, 1fr) auto; gap: 7px; align-items: baseline; border: 0; border-radius: 6px;
    background: none; padding: 7px 6px; text-align: left; cursor: pointer; }
  .is-row:hover { background: var(--bg-recessed); } .is-row.sel { background: var(--accent-soft); }
  .is-row .t { font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
  .is-row.sel .t { font-weight: 600; }
  .is-row .t .wt { margin: 4px 0 0; display: inline-block; }
  .is-row.st-fixed .t, .is-row.st-dropped .t { color: var(--text-dim); }
  .is-row.st-dropped .t { text-decoration: line-through; }
  .is-row .id, .is-row .cf { font: 12px var(--mono); color: var(--text-dim); }
  .g { font: 12px var(--mono); text-align: center; }
  .g--explained { color: var(--warning); } .g--approved { color: var(--accent); } .g--fixed { color: var(--success); } .g--dropped { color: var(--text-dim); }
  .legend { margin-top: 12px; font: 13px/1.45 var(--sans); color: var(--text-dim); padding: 0 4px; }
  .ws { max-width: 780px; }
  .ws-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 13px/1.45 var(--sans); color: var(--text-dim); }
  .ws h2 { font-size: 20px; line-height: 1.3; font-weight: 700; margin: 8px 0 22px; letter-spacing: -.01em; overflow-wrap: break-word; }
  .ws h2 .id { font: 13px var(--mono); color: var(--text-dim); margin-right: 4px; }
  .pill { font: 12px var(--mono); padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
  .p-ours { background: var(--info-bg); color: var(--info-fg); } .p-other { background: var(--warn-bg); color: var(--warn-fg); }
  .p-src { background: var(--bg-raised); color: var(--text-dim); border: 1px solid var(--border); cursor: pointer; }
  .p-src:hover { border-color: var(--accent); }
  .is-row .src { display: block; font: 13px/1.45 var(--sans); color: var(--text-dim); margin-top: 2px; }
  .quote { margin-top: 8px; font: 13px/1.45 var(--sans); color: var(--text-accent); }
  .btn { font: 13px var(--sans); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; }
  .btn:hover { border-color: var(--accent); } .btn--primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn--danger:hover { border-color: var(--error); color: var(--error); }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--box-edge); border-radius: 8px; background: var(--bg-card); }
  .tbl-wrap table { border-collapse: collapse; width: 100%; font: 13px/1.5 var(--mono); }
  .tbl-wrap th, .tbl-wrap td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  .tbl-wrap thead th { color: var(--text-dim); font-weight: 400; background: var(--bg-recessed); }
  .tbl-wrap tbody th { color: var(--text-accent); font-weight: 400; white-space: nowrap; }
  .tbl-wrap tr:last-child td, .tbl-wrap tr:last-child th { border-bottom: 0; }
  .ok { color: var(--success); } .bad { color: var(--error); }
  .ex-title { font-weight: 600; margin-bottom: 6px; } .cap { font-size: 13px; line-height: 1.45; color: var(--text-dim); margin: 6px 0 0 !important; }
  .run { font: 13px/1.45 var(--sans); color: var(--text-dim); margin-top: 4px; } .run code { color: var(--text-accent); }
  .impact { border-left: 3px solid var(--warning); padding: 4px 0 4px 10px; }
  .cmd { position: relative; margin-top: 6px; }
  .cmd pre { margin: 0; padding: 10px 70px 10px 12px; border-radius: 8px; background: var(--bg-recessed); border: 1px solid var(--border); font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmd button { position: absolute; top: 6px; right: 6px; }
  .linked { display: grid; gap: 6px; font-size: 15px; line-height: 1.6; } .linked b { font: 12px var(--mono); color: var(--text-accent); margin-right: 6px; font-weight: 400; }
  .ws-foot { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; font: 13px/1.45 var(--sans); color: var(--text-dim); align-items: center; flex-wrap: wrap; }

  /* Home: open questions */
  .home-grid { display: grid; gap: 16px; align-items: start; grid-template-columns: minmax(0, 1fr) 340px; }
  @media (max-width: 999px) { .home-grid { grid-template-columns: minmax(0, 1fr); } }
  /* Open questions: focus list (one line each, the selected one opens; labels in a left gutter) */
  .qf-hint { font: 13px/1.45 var(--sans); color: var(--text-dim); margin: 0 0 10px; }
  .qf-item { border: 1px solid var(--box-edge); border-radius: 12px; background: var(--bg-card); margin-bottom: 10px; overflow: hidden; min-width: 0; }
  .qf-item.sel { border-color: var(--border-accent); box-shadow: inset 3px 0 0 var(--accent); }
  .qf-line { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: baseline; width: 100%; padding: 14px 18px;
    border: 0; background: none; text-align: left; cursor: pointer; }
  .qf-line .n { font: 13px var(--mono); color: var(--text-dim); }
  .qf-line .t { font-size: 16px; font-weight: 600; line-height: 1.35; overflow-wrap: break-word; min-width: 0; }
  .qf-line .s { font: 13px/1.45 var(--sans); color: var(--text-dim); white-space: nowrap; }
  .qf-line .s.rec { color: var(--text-accent); } .qf-line .s.warn { color: var(--warning); }
  @media (max-width: 640px) { .qf-line { grid-template-columns: 28px minmax(0, 1fr); } .qf-line .s { grid-column: 2; white-space: normal; } }
  .qf-body { padding: 4px 18px 20px 66px; }
  @media (max-width: 640px) { .qf-body { padding-left: 18px; } }
  /* Detail gutter (questions, findings, beads): labels in a left column, content capped at a reading measure */
  .gut { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 18px 18px; align-items: baseline; margin: 0; }
  @media (max-width: 640px) { .gut { grid-template-columns: minmax(0, 1fr); gap: 4px; } .gut dd { margin-bottom: 12px; } }
  .gut dt { font: 600 13px/1.3 var(--sans); color: var(--text-dim); }
  .gut dd { margin: 0; max-width: 62ch; font-size: 15px; line-height: 1.6; min-width: 0; overflow-wrap: break-word; }
  .gut dd.wide { max-width: none; }
  .gut dd.impact { color: var(--warning); }
  .gut dd .dim { color: var(--text-dim); }
  .gut dd .cmd { margin-top: 6px; }
  .steps { color: var(--text-dim); }
  .steps b { font-weight: 400; color: var(--text-accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 5px; }
  .steps .past { color: var(--success); }
  .steps.off { text-decoration: line-through; }
  .kbtns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .kbtn { display: inline-flex; align-items: center; gap: 8px; font: 600 15px/1.35 var(--sans); padding: 7px 14px; border-radius: 8px;
    border: 1.5px solid var(--border); background: var(--bg-recessed); cursor: pointer; }
  .kbtn:hover, .kbtn.rec { border-color: var(--accent); }
  .kbtn.danger:hover { border-color: var(--error); color: var(--error); }
  .kbtn kbd { font: 12px var(--mono); padding: 0 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-dim); }
  .kbtn small { font: 400 13px var(--sans); color: var(--text-accent); }

  .other { display: flex; gap: 6px; min-width: 0; margin-top: 10px; max-width: 460px; }
  .other input { flex: 1; min-width: 0; font: 15px var(--sans); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-recessed); color: var(--text); }
  .kv { display: grid; gap: 5px; font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
  .kv .k { font: 600 13px/1.3 var(--sans); color: var(--text-dim); margin-right: 6px; }
  .inbox pre { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--bg-recessed); border: 1px solid var(--border); font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .ops { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.6; display: grid; gap: 4px; overflow-wrap: anywhere; }
  .note-form { display: flex; gap: 6px; }
  .note-form input { flex: 1; min-width: 0; font: 15px var(--sans); padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-recessed); color: var(--text); }
  .answered { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 15px; line-height: 1.6; }
  .answered li { overflow-wrap: anywhere; } .answered .a { color: var(--success); }

  /* Planning: epics | beads | bead detail */
  .pl-grid { display: grid; gap: 16px; align-items: start; grid-template-columns: minmax(0, 220px) minmax(0, 320px) minmax(0, 1fr); }
  @media (max-width: 1199px) { .pl-grid { grid-template-columns: minmax(0, 280px) minmax(0, 1fr); } .pl-phases { grid-column: 1 / -1; } }
  @media (max-width: 799px) { .pl-grid { grid-template-columns: minmax(0, 1fr); } }
  .pl-col { position: sticky; top: 64px; max-height: calc(100dvh - 80px); overflow-y: auto; }
  @media (max-width: 1199px) { .pl-col.pl-phases { position: static; max-height: none; } }
  @media (max-width: 799px) { .pl-col { position: static; max-height: none; } }
  .ph-row, .bd-row { width: 100%; display: grid; gap: 7px; align-items: baseline; border: 0; border-radius: 6px;
    background: none; padding: 7px 6px; text-align: left; cursor: pointer; }
  .ph-row { grid-template-columns: 14px auto minmax(0, 1fr); }
  .bd-row { grid-template-columns: 14px auto minmax(0, 1fr); }
  .ph-row:hover, .bd-row:hover { background: var(--bg-recessed); }
  .ph-row.sel, .bd-row.sel { background: var(--accent-soft); }
  .ph-row .id, .bd-row .id { font: 12px var(--mono); color: var(--text-dim); }
  .ph-row .t, .bd-row .t { font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; min-width: 0; }
  .ph-row .t b { font-weight: 400; display: block; }
  .ph-row.sel .t b, .bd-row.sel .t { font-weight: 600; }
  .bd-row.st-done .t { color: var(--text-dim); }
  .bd-row .why { display: block; font: 13px/1.45 var(--sans); color: var(--warning); margin-top: 2px; }
  .g--todo { color: var(--text-dim); } .g--active { color: var(--accent); } .g--done { color: var(--success); } .g--blocked { color: var(--warning); }
  .bar { display: flex; align-items: center; gap: 6px; margin-top: 4px; font: 12px var(--mono); color: var(--text-dim); }
  .bar i { flex: 1; height: 4px; border-radius: 2px; background: var(--bg-raised); border: 1px solid var(--border); overflow: hidden; display: block; }
  .bar i b { display: block; height: 100%; background: var(--success); }
  .ph-goal { font-size: 13px; line-height: 1.45; color: var(--text-dim); margin: 0 4px 10px; overflow-wrap: break-word; }
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 15px; line-height: 1.6; }
  .checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; overflow-wrap: anywhere; }
  .checks li::before { content: '☐'; color: var(--text-dim); font-family: var(--mono); }
  .checks li.on { color: var(--text-dim); } .checks li.on::before { content: '☑'; color: var(--success); }
  .ph-checks { margin: 12px 4px 0; padding-top: 10px; border-top: 1px dashed var(--border); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 13px var(--mono); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; text-align: left; }
  .chip:hover { border-color: var(--accent); }
  .chip .g { margin-right: 5px; }
  .blocked-msg { font: 12px var(--mono); color: var(--warning); margin-top: 6px; }
  .files { list-style: none; margin: 0; padding: 0; font: 13px var(--mono); color: var(--text-accent); display: grid; gap: 3px; overflow-wrap: anywhere; }
  .prd-open { margin: -4px 4px 12px; }
  .prd-open .chip[aria-pressed="true"] { border-color: var(--accent); }
  /* PRD reader: replaces the bead detail; body capped at the reading measure */
  .prd-path { font: 13px var(--mono); color: var(--text-accent); margin: -14px 0 14px; overflow-wrap: anywhere; }
  .prd-toc { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .md { max-width: 62ch; font-size: 15px; line-height: 1.6; overflow-wrap: break-word; }
  .md h3 { font: 600 17px/1.35 var(--sans); margin: 26px 0 8px; scroll-margin-top: 72px; }
  .md h4 { font: 600 15px/1.35 var(--sans); margin: 18px 0 6px; }
  .md p { margin: 0 0 12px; }
  .md ul, .md ol { margin: 0 0 12px; padding-left: 22px; display: grid; gap: 4px; }
  .md code { color: var(--text-accent); }
  .md pre { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: var(--bg-recessed); border: 1px solid var(--border);
    font: 13px/1.5 var(--mono); overflow-x: auto; }
  .md pre code { color: var(--text); }
  @media (max-width: 1199px) {
    .pl-phases .panel-body { display: flex; flex-wrap: wrap; gap: 4px; }
    .pl-phases .ph-row { width: auto; }
    .pl-phases .bar i { flex: 1 0 56px; }
  }

  /* Tool log */
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; border-bottom: 1px solid var(--border);
    font: 13px var(--sans); color: var(--text-dim); }
  .filters label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .feed { list-style: none; margin: 0; padding: 4px 0; font: 12px var(--mono); }
  .feed li { display: grid; grid-template-columns: 70px 76px 96px minmax(0, 1fr); gap: 10px; padding: 5px 14px;
    border-bottom: 1px solid var(--border); color: var(--text-dim); align-items: baseline; }
  .feed li.head { font: 600 13px/1.3 var(--sans); border-bottom-color: var(--border-accent); }
  .feed .cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed .tool { color: var(--text); }
  .feed .txt { font-size: 13px; overflow-wrap: anywhere; color: var(--text); }
  .feed .txt.none { color: var(--text-dim); font-style: italic; }
  .feed li.file .tool { color: var(--warning); }
  .feed .sid { color: var(--text-dim); } .feed .sid.now { color: var(--success); }
  .feed li.ev .tool { color: var(--accent); } .feed li.ev.by-user .tool { color: var(--success); }
  .tag { font-size: 12px; padding: 0 5px; margin-left: 6px; border-radius: 4px; background: var(--info-bg); color: var(--info-fg); white-space: nowrap; }
  .tag.file { background: var(--warn-bg); color: var(--warn-fg); }
  .fresh { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
  @media (max-width: 720px) {
    .feed li { grid-template-columns: 62px minmax(0, 1fr); gap: 2px 8px; }
    .feed li.head { display: none; }
    .feed .sidcell { grid-column: 2; grid-row: 1; }
    .feed .tool { grid-column: 1; grid-row: 2; }
    .feed .txt { grid-column: 2; grid-row: 2; }
  }
</style>
