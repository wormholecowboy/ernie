    if (answerUndo) return undoAnswer(answerUndo.dataset.answerUndo);
    const scratch = t.closest('[data-scratch]');
    if (scratch) return toggleScratch(scratch.dataset.scratch);
    const fileOpen = t.closest('[data-file-open]');
    if (fileOpen) { view.selectedFile = fileOpen.dataset.fileOpen; return renderAll(); }
    const issueOpen = t.closest('[data-issue-open]');
    if (issueOpen) { view.selectedIssue = issueOpen.dataset.issueOpen; return renderAll(); }
    const issueSet = t.closest('[data-issue-set]');
    if (issueSet) return setIssue(issueSet.dataset.issueSet, issueSet.dataset.to);
    const copy = t.closest('[data-copy]');
    if (copy) {
      navigator.clipboard?.writeText(copy.dataset.copy).catch(() => {});
      view.copied = copy.dataset.copy;
      return renderAll();
    }
    const method = t.closest('[data-method]');
    if (method) {
      const k = method.dataset.method;
      view.shownMethods.has(k) ? view.shownMethods.delete(k) : view.shownMethods.add(k);
      return renderAll();
    }
    const dismiss = t.closest('[data-dismiss]');
    if (dismiss) {
      // Page action `fact dismiss`: goes to that session's Claude on its next prompt
      const [key, id] = dismiss.dataset.dismiss.split('|');
      const st = S.states[key];
      const fact = st.facts.find(f => f.id === id);
      view.queued.push({ key, label: `dismissed ${id}`, fact, index: st.facts.indexOf(fact) });
      st.facts = st.facts.filter(f => f !== fact);
      st.activity.unshift({ ts: clock(), by: 'user', t: 'fact', op: 'dismiss', text: `dismissed ${id} "${fact.text}"`, fresh: true });
      return renderAll();
    }
  });

  document.addEventListener('submit', e => {
    // Note boxes for page ops: Request changes on a gate or a cap-hit bead, Send back on a closed bead
    const opNote = e.target.closest('[data-op-note]');
    if (opNote) {
      e.preventDefault();
      const text = opNote.elements.text.value.trim();
      if (!text) return opNote.elements.text.focus();
      const [kind, ...rest] = opNote.dataset.opNote.split('|');
      const target = rest.join('|');
      if (kind === 'gate') return gateAction(target, 'changes', text);
      if (kind === 'cap') return capPick(target, 'changes', text);
      return sendBack(target, text);
    }
    const askForm = e.target.closest('[data-ask-form]');
    if (askForm) {
      e.preventDefault();
      const text = askForm.elements.text.value.trim();
      return text && askAbout(askForm.dataset.askForm, text);
    }
    const beadForm = e.target.closest('[data-bead-form]');
    if (beadForm) {
      e.preventDefault();
      return createBead(beadForm);
    }
    const noteForm = e.target.closest('[data-note-form]');
    if (noteForm) {
      e.preventDefault();
      const text = noteForm.elements.text.value.trim();
      return text && addNote(text);
    }
    const form = e.target.closest('[data-answer-form]');
    if (!form) return;
    e.preventDefault();
    const text = form.elements.text.value.trim();
    if (text) answerQuestion(form.dataset.answerForm, text, false);
  });

  document.addEventListener('input', e => {
    const field = e.target.closest('[data-setting]');
    if (!field) return;
    view.settingsDraft[field.dataset.setting] = field.value === '' ? NaN : Number(field.value);
    updateSettingsState();
  });

  document.addEventListener('change', e => {
    const f = view.logFilter;
    const id = e.target.id;
    if (id === 'scheme-pick') return applyScheme(e.target.value);
    if (id === 'wt-pick') {
      view.wt = e.target.value;
      view.logUnseen = 0;
      return renderAll();
    }
    if (id === 'log-session') f.session = e.target.value;
    else if (id === 'log-tool') f.tool = e.target.value;
    else if (id === 'log-agents') f.hideAgents = e.target.checked;
    else if (id === 'log-files') f.filesOnly = e.target.checked;
    else if (id === 'log-events') f.events = e.target.checked;
    else return;
    renderFeed();
  });

  // Settings: `,` opens or closes, esc closes. Any tab: g then h/p/i/f/s/a/l switches tab. Files keys: j/k (or [ ]) prev/next.
  // Scratch keys: j/k (or [ ]) prev/next pad, o open/close. Home keys: j/k, 1–9, m, u (open
  // questions; on a cap-hit card 1–4 pick, / ask). Planning keys: j/k (or [ ]) prev/next bead, { } prev/next epic, p PRD,
  // e epic detail, n + Bead (Ad hoc), / ask, esc back; on a gate a approve, r review / polish again, c request changes; on a
  // bead t tick, r review again, b send back (closed); on a cap-hit bead a / d / r / c. Issues keys: j/k (or [ ])
  // prev/next, a approve, d dismiss, u undo. Ignored while typing.
  const GO_KEYS = { h: 'home', p: 'planning', i: 'issues', f: 'facts', s: 'scratch', a: 'files', l: 'log' };
  let goPending = 0; // time `g` was pressed; the next key within 1 s picks a tab
  document.addEventListener('keydown', e => {
    if (view.settingsOpen && e.key === 'Escape') {
      toggleSettings(false);
      return document.getElementById('settings-btn').focus();
    }
    // esc inside a page-op note box or the + Bead form closes it
    if (e.key === 'Escape' && e.target.closest?.('[data-op-note], [data-bead-form]')) {
      if (e.target.closest('[data-op-note]')) view.opNote = null;
      else view.newBead = false;
      return renderAll();
    }
    if (e.target.closest?.('input, select, textarea') || e.metaKey || e.ctrlKey) return;
    if (e.key === ',') return toggleSettings();
    // Tab keys stay off while the panel is open
    if (view.settingsOpen) return;
    if (Date.now() - goPending < 1000) {
      goPending = 0;
      return GO_KEYS[e.key] && openTab(GO_KEYS[e.key]);
    }
    if (e.key === 'g') { goPending = Date.now(); return; }
    // `/` jumps to the ask field of what's open (a cap-hit card, a gate, a cap-hit bead)
    const askField = document.querySelector('#main [data-ask-form] input');
    if (e.key === '/' && askField && (view.active === 'home' || view.active === 'planning')) {
      e.preventDefault();
      return askField.focus();
    }
    if (view.active === 'home') {
      if (e.key === 'j' || e.key === 'k') return stepQuestion(e.key === 'j' ? 1 : -1);
      // Reason: 4 on a cap-hit card opens a note box; without this the 4 lands in it
      if (view.selectedQuestion?.includes('|cap:')) e.preventDefault();
      return questionKey(e.key);
    }
    if (view.active === 'planning') {
      const { epic } = planSelection();
      const pane = planPane(epic);
      if (e.key === 'Escape') {
        if (view.opNote) view.opNote = null;
        else if (pane === 'new') view.newBead = false;
        else if (pane === 'prd') view.prdOpen = false;
        else if (pane === 'audit') view.auditOpen = false;
        else if (pane === 'epic') view.epicOpen = false;
        else return;
        return renderAll();
      }
      if (e.key === 'p') {
        view.prdOpen = !view.prdOpen;
        view.newBead = false;
        return renderAll();
      }
      if (e.key === 'e' && epic && epic.ep.id !== ADHOC) {
        Object.assign(view, { epicOpen: !(pane === 'epic' || pane === 'audit'), auditOpen: false, prdOpen: false, newBead: false });
        return renderAll();
      }
      if (e.key === 'n' && epic?.ep.id === ADHOC) {
        Object.assign(view, { newBead: true, prdOpen: false });
        e.preventDefault();
        renderAll();
        return document.querySelector('[data-bead-form] input[name=title]')?.focus();
      }
      // c and b open a note box; keep the letter out of it
      if (['a', 'b', 'c', 'd', 'r', 't'].includes(e.key) && planActionKey(e.key)) return e.preventDefault();
      const step = { k: () => stepBead(-1), j: () => stepBead(1), '[': () => stepBead(-1), ']': () => stepBead(1), '{': () => stepEpic(-1), '}': () => stepEpic(1) }[e.key];
      return step?.();
    }
    if (view.active === 'scratch') {
      if (e.key === 'k' || e.key === '[') return stepScratch(-1);
      if (e.key === 'j' || e.key === ']') return stepScratch(1);
      if (e.key === 'o') return toggleScratch(view.selectedScratch);
      return;
    }
    if (view.active === 'files') {
      if (e.key === 'k' || e.key === '[') return stepFile(-1);
      if (e.key === 'j' || e.key === ']') return stepFile(1);
      return;
    }
    if (view.active !== 'issues') return;
    if (e.key === 'k' || e.key === '[') return stepIssue(-1);
    if (e.key === 'j' || e.key === ']') return stepIssue(1);
    if (!view.selectedIssue) return;
    const [key, id] = view.selectedIssue.split('|');
    const status = S.states[key].issues.find(i => i.id === id)?.status;
    // Same moves as the Decide row's buttons for that status
    const to = {
      a: status === 'explained' && 'approved',
      d: (status === 'explained' || status === 'approved') && 'dismissed',
      u: (status === 'approved' || status === 'dismissed') && 'explained',
    }[e.key];
    if (to) setIssue(view.selectedIssue, to);
  });

  // ---------- Simulated liveness: the working session keeps calling tools (PostToolUse → tool run / file touch) ----------
  // Reason: the mock clock continues from the sample's newest row so new rows sort against sample times
  let simSeconds = 14 * 3600 + 21 * 60 + 8;
  const clock = () => { simSeconds += 4; return new Date(simSeconds * 1000).toISOString().slice(11, 19); };
  const LIVE_ROWS = [
    { t: 'tool', tool: 'Read', text: 'loader/hash.py' },
    { t: 'tool', tool: 'Grep', text: 'page_location', agent: 'Explore' },
    { t: 'file', tool: 'Edit', text: 'sql/views/sessions.sql' },
    { t: 'tool', tool: 'Bash', text: 'Re-run dedupe probe after normalizing' },
    { t: 'tool', tool: 'Glob', text: 'sql/views/*.sql', agent: 'Explore' },
    { t: 'tool', tool: 'Bash', text: '' },
    { t: 'tool', tool: 'Bash', text: 'Compare September session counts before and after' },
  ];
  let liveIndex = 0;
  setInterval(() => {
    const row = LIVE_ROWS[liveIndex++ % LIVE_ROWS.length];
    const working = S.logs.filter(l => l.on && !l.archived && l.session.state === 'working');
    working.forEach(log => {
      const st = S.states[log.key];
      st.activity.unshift({ ts: clock(), by: 'hook', op: row.t === 'file' ? 'touch' : 'run', ...row, sid: log.session.id, fresh: true });
      st.activity.length = Math.min(st.activity.length, 350);
      log.session.lastEventAgo = '0s';
    });
    renderNowStrip();
    // Only the picked worktree's rows count toward the Tool log badge
    if (working.some(l => l.key === view.wt)) {
      if (view.active === 'log') renderFeed();
      else { view.logUnseen += 1; renderTabs(); }
    }
    Object.values(S.states).forEach(st => st.activity.forEach(a => { a.fresh = false; }));
  }, 4000);

  // Colour scheme: retro is the default (no attribute); the pick is remembered per browser
  const SCHEMES = ['retro', 'original', 'original-light'];
  function applyScheme(scheme) {
    if (!SCHEMES.includes(scheme)) scheme = 'retro';
    if (scheme === 'retro') delete document.documentElement.dataset.scheme;
    else document.documentElement.dataset.scheme = scheme;
    document.getElementById('scheme-pick').value = scheme;
    try { localStorage.setItem('ernie-scheme', scheme); } catch (err) { /* storage blocked: pick lasts this visit */ }
  }
  let savedScheme = null;
  try { savedScheme = localStorage.getItem('ernie-scheme'); } catch (err) { /* storage blocked */ }
  applyScheme(savedScheme);

  // Deep link: #planning, #issues, #facts, #scratch, #files or #log
  const hashKey = decodeURIComponent(location.hash.slice(1));
  if (isTab(hashKey)) openTab(hashKey); else renderAll();
</script>
</body>
</html>
