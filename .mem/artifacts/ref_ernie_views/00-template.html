        <span class="meta">${(st.epics || []).length} epics · ${epicBeads.length} beads · ${st.adhoc.length} ad hoc · ${allBeads.filter(b => b.status === 'active').length} active · ${allBeads.filter(b => b.status === 'blocked').length} blocked · ${st.queue.length} in the queue</span>
        <span class="hint">Beads fields not final; revisit in P5</span></div>
      ${epics.length ? `<div class="pl-grid">
        <section class="panel pl-col pl-phases"><div class="panel-body">${epicCol}</div></section>
        <section class="panel pl-col"><div class="panel-body">${beadCol}</div></section>
        <div>${right}</div>
      </div>` : '<div class="canvas"><p>No epics or ad hoc beads for this worktree.</p></div>'}`;
  }

  function stepBead(delta) {
    const { beads } = planSelection();
    const next = beads[beads.findIndex(x => x.key === view.selectedBead) + delta];
    if (!next) return;
    view.selectedBead = next.key;
    Object.assign(view, { prdOpen: false, epicOpen: false, auditOpen: false, newBead: false, opNote: null });
    renderAll();
  }

  function stepEpic(delta) {
    const { epics } = planSelection();
    const next = epics[epics.findIndex(x => x.key === view.selectedEpic) + delta];
    if (!next) return;
    view.selectedEpic = next.key;
    Object.assign(view, { epicOpen: null, auditOpen: false, newBead: false, opNote: null });
    renderAll();
  }

  // ---------- Planning: plan stages, gates, audit, queue, review cap, Now (P6) ----------
  // One row per P2 stage: PRD review → you approve the PRD → breakdown → polish → audit → you approve the breakdown → build
  const STAGE_GLYPH = { done: '●', now: '◐', waiting: '◔', todo: '○' };
  const STAGE_CLASS = { done: 'done', now: 'active', waiting: 'blocked', todo: 'todo' };
  const STAGE_TITLE = { done: 'done', now: 'running', waiting: 'waiting on you', todo: 'not started' };
  const STAGE_NAME = { prd: 'PRD review', 'approve-prd': 'Approve PRD', breakdown: 'Breakdown', polish: 'Polish', audit: 'Audit',
    'approve-breakdown': 'Approve breakdown', build: 'Build' };
  // The two human gates (P6 Q3/Q3b): the PRD gate reruns a review round, the breakdown gate a polish round
  const GATE = {
    'approve-prd': { what: 'approve the PRD', short: 'approve PRD', gate: 'PRD', again: 'Review again' },
    'approve-breakdown': { what: 'approve the breakdown', short: 'approve breakdown', gate: 'breakdown', again: 'Polish again' },
  };
  // PRD sections that frame the work rather than ask for it; the audit lists them but expects no bead under them
  const AUDIT_CONTEXT = ['Problem', 'Goal', 'Scope', 'Risks', 'Open questions'];

  // Still being planned = something before Build is unfinished
  const stillPlanning = stages => stages.some(s => s.kind !== 'build' && s.state !== 'done');
  const stageNow = s => `${STAGE_NAME[s.kind].toLowerCase()}${s.rounds ? ` r${s.rounds.length + 1}` : ''}`;
  // A gate answer (Approve, Review / Polish again, Request changes) waiting for the next prompt; asks don't answer a gate
  const gateSent = (epicKey, s) => view.queued.find(q => q.gateKey === epicKey && q.stageKind === s.kind);
  // Waiting on you = a gate stage with no answer queued yet
  const gateWaiting = (logKey, ep) => (ep.stages || []).find(s => s.state === 'waiting' && !gateSent(`${logKey}|${ep.id}`, s));

  // Code-review findings waiting for your approval (Beads workflow Q7: the bead waits on you, the queue moves on)
  const isSentBack = iss => (iss.labels || []).includes('review:user');
  const openFindings = (logKey, b) => S.states[logKey].issues.filter(i => i.parent === b.id && i.status === 'explained' && !isSentBack(i));
  const beadOpQueued = (logKey, b) => view.queued.find(q => q.key === logKey && q.beadId === b.id && q.beadOp);
  // Cap hit (P6 Q6b): in progress, reviews at the cap, a finding still open. Derived from Beads, so acting on the bead or
  // the finding anywhere (Planning, Issues, the Home card) clears it; a queued Review again / Request changes counts as acting
  const capHit = (logKey, b) => b.status === 'active' && (b.reviews?.length || 0) >= S.settings.reviewMax
    && openFindings(logKey, b).length > 0 && !beadOpQueued(logKey, b);
  const capLine = (logKey, b) => `${b.id} hit the review cap · ${plural(openFindings(logKey, b).length, 'finding')} left`;

  // What an in-progress bead is doing: coding, review rN, or waiting on you (an open finding)
  function beadStage(logKey, b) {
    const op = beadOpQueued(logKey, b);
    if (op) return { text: `${op.beadOp} · next prompt`, queued: true };
    if (capHit(logKey, b)) return { text: 'hit the review cap', waiting: true };
    if (openFindings(logKey, b).length) return { text: 'waiting on you', waiting: true };
    if (b.stage === 'review') return { text: `review r${(b.reviews?.length || 0) + 1}` };
    return { text: 'coding' };
  }

  // Round tokens: `r1 2 found · r2 clean` (PRD and code review count findings), `r1 3 edits, 1 major` (polish counts edits)
  const roundText = (kind, r) => kind === 'polish' ? `${plural(r.edits, 'edit')}${r.major ? `, ${r.major} major` : ''}` : r.found ? `${r.found} found` : 'clean';
  const roundClean = (kind, r) => kind === 'polish' ? !r.edits : !r.found;
  const roundsHTML = (kind, rounds, tail = '') => `<span class="rnds">${rounds.map(r =>
    `<span class="rnd ${roundClean(kind, r) ? 'clean' : ''}" title="${esc(r.note || (r.ids || []).join(', ') || roundText(kind, r))}"><span class="n">r${r.n}</span>${roundText(kind, r)}</span>`).join('')}${tail}</span>`;

  // Bead Reviews row: finished rounds, then the running one or "cap hit"
  function beadRoundsHTML(logKey, b) {
    const rounds = b.reviews || [];
    const tail = b.status === 'active' && b.stage === 'review' ? `<span class="rnd now"><span class="n">r${rounds.length + 1}</span>running</span>`
      : capHit(logKey, b) ? '<span class="rnd over">cap hit</span>' : '';
    return roundsHTML('review', rounds, tail);
  }

  // Now (Beads workflow Q4, P6 Q5), derived from Beads: a running bead (coding / review rN) first, else a running
  // planning stage, else what waits on you (a gate, then a bead with an open finding). Stalled = something is running
  // but no Claude session is working in the worktree (a crash leaves the bead in progress)
  function nowOf(logKey) {
    const st = S.states[logKey];
    if (!st) return null;
    const epics = st.epics || [];
    const stalled = logOf(logKey)?.session.state !== 'working';
    const inProgress = beadsOf(logKey).filter(x => x.b.status === 'active');
    const running = inProgress.filter(x => { const s = beadStage(logKey, x.b); return !s.waiting && !s.queued; });
    const activeEpic = epics.find(ep => ep.status === 'active');
    const bead = running.find(x => x.ep === activeEpic) || running[0];
    if (bead) return { ep: bead.ep, bead, label: bead.b.id, what: beadStage(logKey, bead.b).text, since: bead.b.since, stalled };
    for (const ep of epics) {
      const s = (ep.stages || []).find(x => x.state === 'now' && x.kind !== 'build');
      if (s) return { ep, label: ep.id, what: stageNow(s), since: s.since, stalled };
    }
    for (const ep of epics) {
      const s = gateWaiting(logKey, ep);
      if (s) return { ep, label: ep.id, what: `waiting on you: ${GATE[s.kind].what}`, short: GATE[s.kind].short, since: s.since, waiting: true };
    }
    const waiting = inProgress.find(x => beadStage(logKey, x.b).waiting);
    if (waiting) return { ep: waiting.ep, bead: waiting, label: waiting.b.id, what: beadStage(logKey, waiting.b).text, since: waiting.b.since, waiting: true };
    return null;
  }

  // Minutes from an HH:MM sample time to the mock clock, as "8m" or "1h 50m"; other formats (Oct 13) give ''
  function ago(since) {
    const m = /^(\d\d):(\d\d)$/.exec(since || '');
    if (!m) return '';
    const mins = Math.max(0, Math.floor((simSeconds - (+m[1] * 3600 + +m[2] * 60)) / 60));
    return mins < 60 ? `${mins}m` : `${Math.floor(mins / 60)}h ${mins % 60}m`;
  }

  // Top-bar strip on every tab (P6 Q5): mustard when Claude waits on you or stalled; click opens it on Planning
  function renderNowStrip() {
    const now = nowOf(view.wt);
    const box = document.getElementById('now-strip');
    if (!now) { box.innerHTML = ''; return; }
    const dur = ago(now.since);
    const tail = `${dur ? ` · ${dur}` : ''}${now.stalled ? ' · stalled' : ''}`;
    // Reason: the strip shares the top bar with the tabs, so a gate shows its short name; the mustard says it waits on you
    const text = `${now.label} ${now.short || now.what}${tail}`;
    const full = `${now.label} ${now.what}${tail}`;
    const target = now.bead ? `data-bead-open="${esc(now.bead.key)}"` : `data-epic-detail-open="${esc(view.wt)}|${esc(now.ep.id)}"`;
    box.innerHTML = `<button class="now-strip ${now.waiting || now.stalled ? 'warn' : ''}" type="button" ${target} title="Now: ${esc(full)} · open on Planning">${esc(text)}</button>`;
  }

  // Home's Now line: the bead or epic, what it's doing and since when; waiting on you and stalled in mustard
  function nowHTML(now) {
    if (!now) return '<span class="hint">nothing running</span>';
    const chip = now.bead ? beadChip(now.bead)
      : `<button class="chip" type="button" data-epic-detail-open="${esc(view.wt)}|${esc(now.ep.id)}">${esc(epicLabel(now.ep))}</button>`;
    return `${chip} <span class="${now.waiting || now.stalled ? 'warn-txt' : ''}">${esc(now.what)}${now.since ? ` · since ${esc(now.since)}` : ''}${now.stalled ? ' · stalled' : ''}</span>`;
  }

  // The "Plan & reviews" row's status line: waiting on you / <stage> rN running / building · N of M done
  function planSummary(logKey, ep) {
    const stages = ep.stages || [];
    const done = ep.beads.filter(b => b.status === 'done').length;
    const count = `${done} of ${ep.beads.length} done`;
    const waiting = gateWaiting(logKey, ep);
    if (waiting) return { state: 'waiting', warn: true, text: `waiting on you: ${GATE[waiting.kind].what}${waiting.since ? ` · since ${waiting.since}` : ''}` };
    const sent = view.queued.find(q => q.gateKey === `${logKey}|${ep.id}`);
    if (sent) return { state: 'now', text: `${sent.label} · next prompt` };
    const stalled = logOf(logKey)?.session.state !== 'working';
    const running = stages.find(s => s.state === 'now' && s.kind !== 'build');
    if (running) return { state: 'now', warn: stalled, text: `${stageNow(running)} running${running.since ? ` · since ${running.since}` : ''}${stalled ? ' · stalled' : ''}` };
    if (stages.find(s => s.kind === 'build')?.state === 'now') {
      const now = nowOf(logKey);
      const here = now?.bead && now.ep === ep;
      return { state: 'now', warn: here && (now.waiting || now.stalled), text: `building · ${count}${here ? ` · ${now.label} ${now.what}${now.stalled ? ' · stalled' : ''}` : ''}` };
    }
    if (!stages.length) return { state: ep.status === 'active' ? 'now' : ep.status === 'done' ? 'done' : 'todo', text: `${count} · no plan history` };
    return stages.every(s => s.state === 'done') ? { state: 'done', text: 'planned and built' } : { state: 'todo', text: 'not started' };
  }

  // What happened in one stage, for the Plan list; the stage name sits in its own column so the list scans
  function stageDet(logKey, ep, s) {
    const since = s.since ? ` · since ${esc(s.since)}` : '';
    if (GATE[s.kind]) {
      if (gateSent(`${logKey}|${ep.id}`, s)) return 'your answer goes with the next prompt';
      if (s.state === 'done') return `you approved · ${esc(s.at)}`;
      if (s.state === 'waiting') return `<span class="warn-txt">waiting on you${s.kind === 'approve-breakdown' ? ' · read the audit first' : ''}${since}</span>`;
      return s.kind === 'approve-prd' ? 'after PRD review' : 'after the audit';
    }
    if (s.kind === 'prd' || s.kind === 'polish') {
      const running = s.state === 'now' ? `<span class="rnd now"><span class="n">r${(s.rounds?.length || 0) + 1}</span>running${since}</span>` : '';
      if (!s.rounds?.length && !running) return s.kind === 'prd' ? 'not started' : 'after the breakdown';
      const settle = s.kind === 'polish' && s.settled === false ? '<span class="rnd over">didn\'t settle</span>' : '';
      return roundsHTML(s.kind, s.rounds || [], running + settle);
    }
    if (s.kind === 'breakdown') {
      if (s.state === 'todo') return 'after you approve the PRD';
      return s.state === 'now' ? `running${since}` : `${plural(s.beads, 'bead')} from a fresh agent`;
    }
    if (s.kind === 'audit') {
      if (s.state === 'todo') return 'after polish';
      const a = auditOf(ep, s);
      if (!a.gaps.length && !a.uncited.length && !a.dupes.length) return 'no gaps: every PRD section has a bead, every bead cites one';
      return [
        a.gaps.length ? `<span class="warn-txt">${plural(a.gaps.length, 'gap')}: ${a.gaps.map(esc).join(' · ')}</span>` : 'no gaps',
        a.uncited.length ? `<span class="warn-txt">${a.uncited.length} uncited</span>` : '',
        a.dupes.length ? `<span class="warn-txt">${plural(a.dupes.length, 'possible duplicate')}</span>` : '',
      ].filter(Boolean).join(' · ');
    }
    const count = `${ep.beads.filter(b => b.status === 'done').length} of ${ep.beads.length}`;
    if (s.state === 'done') return `${count} beads closed · ${esc(s.at)}`;
    if (s.state === 'now') {
      const now = nowOf(logKey);
      return `${count} done${now?.bead && now.ep === ep ? ` · ${esc(now.label)} ${esc(now.what)}` : ''}`;
    }
    return 'beads enter the queue after your approval';
  }

  function planStageHTML(epic, s) {
    const ep = epic.ep;
    const name = s.kind === 'audit' && s.state !== 'todo'
      ? '<button class="stage-link" type="button" data-audit-open title="open the audit report">Audit</button>' : esc(STAGE_NAME[s.kind]);
    const gate = GATE[s.kind] && (s.state === 'waiting' || gateSent(epic.key, s)) ? gateHTML(epic, s) : '';
    return `<li class="st-${s.state}">${glyph(STAGE_CLASS[s.state], STAGE_GLYPH[s.state], STAGE_TITLE[s.state])}
      <span class="lbl">${name}</span><span class="det">${stageDet(view.wt, ep, s)}</span>${gate}</li>`;
  }

  // Gate actions on the stage that waits on you (P6 Q3): Approve · Review / Polish again · Request changes (note) · ask
  function gateHTML(epic, s) {
    const g = GATE[s.kind];
    const sent = gateSent(epic.key, s);
    if (sent) return `<div class="gate">${sentLine(sent)}</div>`;
    const k = esc(epic.key);
    const ticked = s.kind === 'approve-breakdown' ? tickedIn(epic) : [];
    const again = ticked.length ? `${g.again} · ${plural(ticked.length, 'ticked bead')}` : g.again;
    const btn = (action, key, label) => `<button class="kbtn" type="button" data-gate="${k}" data-action="${action}"><kbd>${key}</kbd>${label}</button>`;
    const noteKey = `gate|${epic.key}`;
    return `<div class="gate"><div class="kbtns">${btn('approve', 'a', 'Approve')}${btn('again', 'r', again)}${btn('changes', 'c', 'Request changes')}</div>
      ${view.opNote === noteKey ? opNoteHTML(noteKey, 'what should change…') : ''}
      ${askHTML(`gate|${epic.key}`, `the ${g.gate} gate`)}
      <div class="now-keys">a approve · r ${g.again.toLowerCase()} · c request changes · / ask</div></div>`;
  }

  // Beads of this epic that are ticked; Polish again is limited to them when there are any (Beads workflow Q6b)
  const tickedIn = epic => epic.ep.beads.filter(b => S.states[view.wt].queue.includes(b.id)).map(b => b.id);

  // Epic detail (P6 Q2 B): the epic in the right column, same gutter as a bead. Plan = one row per P2 stage; the stage
  // that waits on you carries the gate's actions (P6 Q3); the Audit row opens the audit report (P6 Q4)
  function epicDetailHTML(epic) {
    const ep = epic.ep;
    const prdFindings = S.states[view.wt].issues.filter(i => i.parent === ep.id);
    const stages = ep.stages || [];
    const gate = stages.some(s => s.state === 'waiting');
    return `<article class="ws">
      <div class="ws-meta"><span>epic</span><span class="pill p-ours">${esc(epicLabel(ep))}</span>
        ${ep.prd ? `<span>Plan: ${esc(ep.prd.plan)}</span>` : ''}</div>
      <h2><span class="id">${esc(ep.id)}</span>${esc(ep.title)}</h2>
      <dl class="gut">
        <dt>Goal</dt><dd>${esc(ep.goal || '—')}</dd>
        ${stages.length ? `<dt>Plan</dt><dd class="wide"><ol class="tl">${stages.map(s => planStageHTML(epic, s)).join('')}</ol></dd>` : ''}
        ${ep.doneWhen?.length ? `<dt>Done when</dt><dd>${checklist(ep.doneWhen)}</dd>` : ''}
        ${ep.prd ? `<dt>PRD</dt><dd><button class="chip" type="button" data-prd-toggle>▤ ${esc(ep.prd.path.split('/').pop())}<kbd>p</kbd></button></dd>` : ''}
        ${prdFindings.length ? `<dt>Findings</dt><dd><div class="linked">${prdFindings.map(i => linkHTML(view.wt, i.id, 'found in PRD review')).join('')}</div></dd>` : ''}
      </dl>
      <footer class="ws-foot"><span></span><span>e epic · j / k bead · p PRD${gate ? ' · a / r / c gate · / ask' : ''}</span><span></span></footer></article>`;
  }

  // Audit (Beads workflow Q6b, P6 Q4): mechanical, no tokens. Every checked PRD section → the beads that cite it
  // (`metadata.prd`), beads citing none, and the titles-only duplicate pass
  function auditOf(ep, s) {
    const sections = ep.prd ? [...ep.prd.md.matchAll(/^## (.*)/gm)].map(m => m[1]) : [];
    const map = sections.filter(t => !AUDIT_CONTEXT.includes(t)).map(t => ({ section: t, beads: ep.beads.filter(b => (b.cites || []).includes(t)) }));
    return {
      map, context: sections.filter(t => AUDIT_CONTEXT.includes(t)),
      gaps: map.filter(m => !m.beads.length).map(m => m.section),
      uncited: ep.beads.filter(b => !(b.cites || []).some(t => sections.includes(t))),
      dupes: s?.dupes || [],
    };
  }

  function auditHTML(epic) {
    const ep = epic.ep;
    const s = (ep.stages || []).find(x => x.kind === 'audit');
    const a = auditOf(ep, s);
    const chips = list => `<div class="chips">${list.map(b => beadChip({ b, ep, key: `${epic.key}|${b.id}` })).join('')}</div>`;
    const byId = id => ep.beads.find(b => b.id === id);
    return `<article class="ws">
      <div class="ws-meta"><button class="btn" type="button" data-audit-close>‹ epic ${esc(ep.id)} · esc</button>
        <span>audit${s?.at ? ` · ${esc(s.at)}` : ''}</span><span class="pill p-ours">${esc(epicLabel(ep))}</span></div>
      <h2>Audit</h2>
      <dl class="gut">
        <dt>PRD sections</dt><dd class="wide"><div class="aud">${a.map.map(m => `<span>${esc(m.section)}</span>${m.beads.length ? chips(m.beads) : '<span class="gap">no bead · gap</span>'}`).join('')}</div>
          ${a.context.length ? `<p class="hint">Not checked, they frame the PRD: ${a.context.map(esc).join(' · ')}</p>` : ''}</dd>
        <dt>Uncited beads</dt><dd>${a.uncited.length ? `${chips(a.uncited)}<p class="hint">These cite no PRD section: work the PRD doesn't ask for, or a missing citation.</p>` : 'None. Every bead cites a section.'}</dd>
        <dt>Possible duplicates</dt><dd class="wide">${a.dupes.length ? `${a.dupes.map(pair => chips(pair.map(byId).filter(Boolean))).join('')}<p class="hint">Titles-only pass across polish batches; read both before you approve.</p>` : 'None found.'}</dd>
      </dl>
      <footer class="ws-foot"><span></span><span>esc back to the epic</span><span></span></footer></article>`;
  }

  // Queue tick (Beads workflow Q1/Q3): an empty box, or the bead's place in the queue
  function tickHTML(x) {
    const pos = S.states[x.key.split('|')[0]].queue.indexOf(x.b.id);
    const title = pos >= 0 ? `#${pos + 1} in the queue · untick (t)` : 'tick into the queue (t)';
    return `<button class="tick" type="button" data-tick="${esc(x.key)}" aria-pressed="${pos >= 0}" title="${title}" aria-label="${esc(x.b.id)}: ${title}">${pos >= 0 ? pos + 1 : ''}</button>`;
  }

  // Ticking adds the bead to the end of the ernie queue at once (Claude takes the first ticked bead that is ready); unticking removes it
  function toggleTick(beadKey) {
    const [logKey, , beadId] = beadKey.split('|');
    const st = S.states[logKey];
    const pos = st.queue.indexOf(beadId);
    if (pos >= 0) st.queue.splice(pos, 1);
    else st.queue.push(beadId);
    logRow(logKey, { by: 'user', t: 'queue', op: pos >= 0 ? 'untick' : 'tick', text: `${pos >= 0 ? 'untick' : 'tick'} ${beadId}` });
    renderAll();
  }

  // Bead action row (last, fixed spot): a cap-hit bead gets the cap choices (P6 Q6); other beads get Tick, Review again
  // and, once closed, Send back (Beads workflow Q1, Q5)
  function beadActionsHTML(entry) {
    const { b } = entry;
    const [logKey] = entry.key.split('|');
    if (capHit(logKey, b)) {
      return `<dl class="gut decide"><dt>Decide</dt><dd class="wide"><p class="msg">${esc(capLine(logKey, b))}. Claude moved on; the bead stays in progress until you pick.</p>
        ${capChoicesHTML(entry, ['a', 'd', 'r', 'c'])}</dd></dl>`;
    }
    const st = S.states[logKey];
    const sent = beadOpQueued(logKey, b);
    const pos = st.queue.indexOf(b.id);
    const canTick = b.status === 'todo' || b.status === 'blocked';
    const noteKey = `sendback|${entry.key}`;
    const k = esc(entry.key);
    const btns = [
      canTick ? `<button class="kbtn" type="button" data-tick="${k}"><kbd>t</kbd>${pos >= 0 ? `Untick · #${pos + 1} in the queue` : 'Tick into the queue'}</button>` : '',
      sent ? '' : `<button class="kbtn" type="button" data-bead-op="${k}" data-action="again"><kbd>r</kbd>Review again</button>`,
      b.status === 'done' ? `<button class="kbtn" type="button" data-sendback="${k}"><kbd>b</kbd>Send back</button>` : '',
    ].join('');
    const what = b.status === 'done' ? 'Closed. Send back opens a bug bead from your note; Review again runs one more review round.'
      : canTick ? (pos >= 0 ? `Ticked: Claude takes it at #${pos + 1} once its deps are done.` : 'Tick it and Claude works it after the beads ticked before it.')
      : 'In progress. Review again runs one more fresh review round; findings land on Issues.';
    const msg = view.beadMsg?.beadKey === entry.key ? `<p class="done-msg">${esc(view.beadMsg.text)}</p>` : '';
    return `<dl class="gut decide"><dt>Actions</dt><dd class="wide">${msg}<p class="msg">${what}</p><div class="kbtns">${btns}</div>
      ${view.opNote === noteKey ? opNoteHTML(noteKey, 'what is wrong with it…') : ''}${sent ? sentLine(sent) : ''}</dd></dl>`;
  }

  // Cap-hit choices, shared by the bead's Decide row and the Home card; they run the same page ops as Planning and Issues
  function capChoicesHTML(entry, keys) {
    const [logKey] = entry.key.split('|');
    const finding = openFindings(logKey, entry.b)[0];
    const k = esc(entry.key);
    const choices = [['approve', 'Approve the fix'], ['dismiss', 'Dismiss and close'], ['again', 'Review again'], ['changes', 'Request changes on the bead']];
    const noteKey = `cap|${entry.key}`;
    return `<div class="kbtns">${choices.map(([action, label], i) =>
        `<button class="kbtn ${action === 'dismiss' ? 'danger' : ''}" type="button" data-cap="${k}" data-action="${action}"><kbd>${keys[i]}</kbd>${label}</button>`).join('')}</div>
      ${view.opNote === noteKey ? opNoteHTML(noteKey, `what should change in ${entry.b.id}…`) : ''}
      ${askHTML(`issue|${logKey}|${finding.id}`, finding.id)}`;
  }

  // Cap-hit card on Home (P6 Q6b): derived from Beads, not an ernie question (no Q<n>, never in Answered)
  function capCardHTML(x) {
    const k = `${view.wt}|cap:${x.b.id}`;
    const on = k === view.selectedQuestion;
    const finding = openFindings(view.wt, x.b)[0];
    const body = !on ? '' : `<div class="qf-body"><dl class="gut">
      <dt>Bead</dt><dd><div class="chips">${beadChip(x)}</div></dd>
      <dt>Reviews</dt><dd>${beadRoundsHTML(view.wt, x.b)}</dd>
      <dt>Open finding</dt><dd><div class="linked">${linkHTML(view.wt, finding.id)}</div></dd>
      ${finding.impact ? `<dt>If skipped</dt><dd class="impact">${esc(finding.impact)}</dd>` : ''}
      <dt>Decide</dt><dd>${capChoicesHTML(x, ['1', '2', '3', '4'])}<div class="qf-keys">j / k next question · 1–4 pick · / ask</div></dd></dl></div>`;
    return `<div class="qf-item ${on ? 'sel' : ''}"><button class="qf-line" type="button" data-question="${esc(k)}">
      <span class="n">${glyph('blocked', '⚑', 'review cap · from Beads, not an ernie question')}</span><span class="t">${esc(capLine(view.wt, x.b))}</span>
      <span class="s">from Beads · ${esc(epicLabel(x.ep))}</span></button>${body}</div>`;
  }
  const capCards = logKey => beadsOf(logKey).filter(x => capHit(logKey, x.b));

  // Page ops that wait for the next prompt get a qid and an undo(); Undo before the prompt puts the page back
  let nextQid = 1;
  function queueOp(entry, undo = () => {}) {
    view.queued.push({ ...entry, qid: nextQid++, undo });
    view.opNote = null;
    renderAll();
  }

  function undoOp(qid) {
    const entry = view.queued.find(q => q.qid === qid);
    if (!entry) return;
    entry.undo();
    view.queued = view.queued.filter(q => q !== entry);
    renderAll();
  }

  // One queued op as a line with its Undo; finding changes undo through `issue set` like the Issues tab
  const sentLine = q => `<div class="qf-sent">→ ${esc(q.label)} · goes with your next prompt ${q.qid
    ? `<button class="btn" type="button" data-undo="${q.qid}">Undo</button>`
    : `<button class="btn" type="button" data-issue-set="${esc(q.key)}|${esc(q.issueId)}" data-to="${esc(q.from)}">Undo</button>`}</div>`;

  const opNoteHTML = (noteKey, placeholder) => `<form class="other op-note" data-op-note="${esc(noteKey)}">
    <input name="text" maxlength="500" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}"><button class="btn btn--primary" type="submit">Send</button>
    <button class="btn" type="button" data-op-note-cancel>Cancel</button></form>`;

  function openNote(noteKey) {
    view.opNote = noteKey;
    renderAll();
    document.querySelector('[data-op-note] input')?.focus();
  }

  // Ask field (spec D14): your question about the item goes with the next prompt; the item stays open
  function askHTML(askKey, what) {
    const asks = view.queued.filter(q => q.askKey === askKey);
    return `<form class="other ask" data-ask-form="${esc(askKey)}"><input name="text" maxlength="500" placeholder="ask about this…" aria-label="Ask about ${esc(what)}"><button class="btn" type="submit">Send</button></form>
      ${asks.map(q => `<div class="qf-sent">asked “${esc(q.text)}” · goes with your next prompt <button class="btn" type="button" data-undo="${q.qid}">Undo</button></div>`).join('')}`;
  }

  function askAbout(askKey, text) {
    const [kind, logKey, id] = askKey.split('|');
    const label = `${id}: you ask "${text}"`;
    logRow(logKey, { by: 'user', t: kind, op: 'ask', text: label });
    queueOp({ key: logKey, label, askKey, text });
  }

  // Gate answers (P6 Q3): Approve resolves the human gate as soon as the page writes it (like approving a finding);
  // the others wait for Claude. All of them can be undone until the next prompt
  function gateAction(epicKey, action, note = '') {
    const [logKey, epicId] = epicKey.split('|');
    const ep = (S.states[logKey].epics || []).find(x => x.id === epicId);
    const s = ep && gateWaiting(logKey, ep);
    if (!s) return;
    const g = GATE[s.kind];
    const entry = { key: logKey, gateKey: epicKey, stageKind: s.kind };
    view.epicOpen = true;
    let undo;
    if (action === 'approve') {
      const before = { state: s.state, at: s.at };
      Object.assign(s, { state: 'done', at: 'today' });
      entry.label = `${epicId} ${g.gate} → approved`;
      undo = () => Object.assign(s, before);
    } else if (action === 'again') {
      const ticked = s.kind === 'approve-breakdown' ? tickedIn({ ep }) : [];
      entry.label = `${epicId}: ${g.again.toLowerCase()}${ticked.length ? ` (ticked: ${ticked.join(', ')})` : ''}`;
    } else {
      entry.label = `${epicId} ${g.gate}: request changes "${note}"`;
    }
    logRow(logKey, { by: 'user', t: 'gate', op: action, text: entry.label });
    queueOp(entry, undo);
  }

  // Bead ops that wait for the next prompt: Review again (one more fresh review round, any bead) and Request changes
  // (a cap-hit bead: Claude reworks it from your note)
  function beadOp(beadKey, op, note = '') {
    const [logKey, , beadId] = beadKey.split('|');
    const label = op === 'changes' ? `${beadId}: request changes "${note}"` : `${beadId}: review again`;
    logRow(logKey, { by: 'user', t: 'bead', op, text: label });
    queueOp({ key: logKey, label, beadId, beadOp: op === 'changes' ? 'request changes' : 'review again', capBead: capHit(logKey, beadEntry(beadKey).b) });
  }
  const beadEntry = beadKey => beadsOf(beadKey.split('|')[0]).find(x => x.key === beadKey);

  // A cap-hit choice from the bead's Decide row or the Home card
  function capPick(beadKey, action, note = '') {
    const [logKey] = beadKey.split('|');
    const entry = beadEntry(beadKey);
    if (!entry || !capHit(logKey, entry.b)) return;
    const finding = openFindings(logKey, entry.b)[0];
    if (action === 'changes' && !note) return openNote(`cap|${beadKey}`);
    if (action === 'approve') return setIssue(`${logKey}|${finding.id}`, 'approved', null, true);
    if (action === 'dismiss') return setIssue(`${logKey}|${finding.id}`, 'dismissed', entry.b, true);
    beadOp(beadKey, action, note);
  }

  // Send back (Beads workflow Q5): the page runs `bd create` at once: a bug bead discovered-from the closed bead, your note
  // as its description, label review:user, no gate (pre-approved), ticked to the end of the queue. The bead stays closed
  function sendBack(beadKey, note) {
    const [logKey, , beadId] = beadKey.split('|');
    const st = S.states[logKey];
    const id = `i${Math.max(0, ...st.issues.map(i => +i.id.slice(1) || 0)) + 1}`;
    st.issues.push({ id, title: note.length > 80 ? `${note.slice(0, 79)}…` : note, status: 'approved', owner: 'us', parent: beadId,
      labels: ['review:user'], cause: note, fix: 'Claude works it from your note when the queue reaches it.',
      impact: `${beadId} stays closed, but its work is wrong until this lands.` });
    st.queue.push(id);
    view.opNote = null;
    view.beadMsg = { beadKey, text: `Sent back · ${id} created, #${st.queue.length} in the queue` };
    logRow(logKey, { by: 'user', t: 'bead', op: 'send back', text: `${id} ← ${beadId}: ${note}` });
    renderAll();
  }

  // + Bead (Beads workflow Q8): the server runs `bd create -l wt:<branch>` at once (page-button pattern, no Claude turn)
  function newBeadHTML() {
    return `<article class="ws">
      <div class="ws-meta"><span>new bead</span><span class="pill p-ours">Ad hoc</span></div>
      <h2>+ Bead</h2>
      <form class="bead-form" data-bead-form>
        <dl class="gut">
          <dt>Title</dt><dd><input type="text" name="title" maxlength="200" placeholder="what to do, in a few words" aria-label="Title"></dd>
          <dt>Description</dt><dd><textarea name="what" maxlength="2000" placeholder="what done looks like, files, anything Claude needs" aria-label="Description"></textarea></dd>
          <dt>Priority</dt><dd><select name="priority" aria-label="Priority"><option value="">none</option>${[0, 1, 2, 3, 4].map(p => `<option value="${p}">P${p}</option>`).join('')}</select></dd>
          <dt>Queue</dt><dd><label><input type="checkbox" name="tick">tick into the queue</label></dd>
        </dl>
        <dl class="gut decide"><dt>Create</dt><dd class="wide"><p class="msg">The server runs <code>bd create -l wt:${esc(curLog().branch)}</code> right away; no Claude turn.</p>
          <div class="kbtns"><button class="kbtn rec" type="submit">Create bead</button><button class="kbtn" type="button" data-bead-new><kbd>esc</kbd>Cancel</button></div></dd></dl>
      </form></article>`;
  }

  function createBead(form) {
    const st = cur();
    const title = form.elements.title.value.trim();
    if (!title) return form.elements.title.focus();
    const taken = new Set(beadsOf(view.wt).map(x => x.b.id));
    let id;
    do { id = Math.random().toString(36).slice(2, 5); } while (taken.has(id));
    const bead = { id, title, status: 'todo' };
    const what = form.elements.what.value.trim();
    if (what) bead.what = what;
    if (form.elements.priority.value) bead.priority = Number(form.elements.priority.value);
    st.adhoc.push(bead);
    if (form.elements.tick.checked) st.queue.push(id);
    Object.assign(view, { newBead: false, selectedEpic: `${view.wt}|${ADHOC}`, selectedBead: `${view.wt}|${ADHOC}|${id}` });
    view.beadMsg = { beadKey: view.selectedBead, text: `Created ${id}${form.elements.tick.checked ? `, #${st.queue.length} in the queue` : ''}` };
    logRow(view.wt, { by: 'user', t: 'bead', op: 'create', text: `${id} ${title}` });
    renderAll();
  }

  // Planning keys that act on the right column: the gate in the epic detail, else the selected bead
  function planActionKey(key) {
    const { epic } = planSelection();
    const pane = planPane(epic);
    if (pane === 'epic') {
      const s = epic && gateWaiting(view.wt, epic.ep);
      const action = { a: 'approve', r: 'again', c: 'changes' }[key];
      if (!s || !action) return false;
      if (action === 'changes') openNote(`gate|${epic.key}`);
      else gateAction(epic.key, action);
      return true;
    }
    if (pane !== 'bead' || !view.selectedBead) return false;
    const entry = beadEntry(view.selectedBead);
    if (!entry) return false;
    if (capHit(view.wt, entry.b)) {
      const action = { a: 'approve', d: 'dismiss', r: 'again', c: 'changes' }[key];
      if (action) capPick(entry.key, action);
      return !!action;
    }
    if (key === 't' && (entry.b.status === 'todo' || entry.b.status === 'blocked')) { toggleTick(entry.key); return true; }
    if (key === 'r' && !beadOpQueued(view.wt, entry.b)) { beadOp(entry.key, 'again'); return true; }
    if (key === 'b' && entry.b.status === 'done') { openNote(`sendback|${entry.key}`); return true; }
    return false;
  }

  // ---------- Issues tab ----------
  // Findings are Beads bugs (P4). Source = parent: an epic (PRD review), a bead (code review) or none (ad hoc) (P3 Q2)
  const STATUS_ORDER = { explained: 0, approved: 1, fixed: 2, dismissed: 3 };
  const STATUS_GLYPH = { explained: '○', approved: '◐', fixed: '●', dismissed: '⊘' };
  const CONF_GLYPH = { verified: '✓', inferred: '~', unchecked: '✗' };

  // Where a finding came from and which epic it lists under; null epic → the Ad hoc group
  function findingSource(logKey, iss) {
    const epic = (S.states[logKey].epics || []).find(ep => ep.id === iss.parent);
    if (epic) return { epic, label: 'PRD review', bead: null };
    const bead = beadsOf(logKey).find(x => x.b.id === iss.parent);
    if (bead) return { epic: bead.ep.id === ADHOC ? null : bead.ep, label: `${isSentBack(iss) ? 'sent back' : 'code review'} · ${bead.b.id}`, bead };
    return { epic: null, label: 'ad hoc', bead: null };
  }

  // Epics in plan order, then Ad hoc; inside each, waiting-for-approval first so the next thing you act on is on top
  function issueList() {
    const logKey = view.wt;
    const epicOrder = (S.states[logKey].epics || []).map(ep => ep.id);
    const rank = x => x.src.epic ? epicOrder.indexOf(x.src.epic.id) : epicOrder.length;
    return S.states[logKey].issues
      .map(iss => ({ iss, log: logOf(logKey), key: `${logKey}|${iss.id}`, src: findingSource(logKey, iss) }))
      .sort((a, b) => rank(a) - rank(b) || STATUS_ORDER[a.iss.status] - STATUS_ORDER[b.iss.status]);
  }

  const cell = v => {
    const s = esc(v);
    return s.startsWith('✓') ? `<span class="ok">${s}</span>` : s.startsWith('✗') ? `<span class="bad">${s}</span>` : s;
  };
  function exampleHTML(ex) {
    return `<div class="ex-title"><span class="item-id">${esc(ex.name)}</span>${esc(ex.title)}</div>
      <div class="tbl-wrap"><table><thead><tr>${ex.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${ex.rows.map(r => `<tr><th>${esc(r[0])}</th>${r.slice(1).map(v => `<td>${cell(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${ex.caption ? `<p class="cap">${esc(ex.caption)}</p>` : ''}
      ${ex.run ? `<div class="run">see for yourself: <code>${esc(ex.run)}</code> · shown, never run</div>` : ''}`;
  }

  // Status as one line of text: past steps green, the current one highlighted. `off` strikes it through (dismissed)
  function stepsHTML(steps, current, off = false) {
    const at = steps.indexOf(current);
    return `<span class="steps ${off ? 'off' : ''}">${steps.map((s, i) =>
      i === at ? `<b>${s}</b>` : i < at ? `<span class="past">${s}</span>` : s).join(' → ')}</span>`;
  }

  // Finding detail: labels in a gutter, the example first (lead with an example), Decide always the last row
  function worksheetHTML(entry, list) {
    const { iss, log } = entry;
    const st = S.states[log.key];
    const pos = list.findIndex(x => x.key === entry.key);
    const prev = list[pos - 1], next = list[pos + 1];
    const ex = iss.example && st.examples.find(e => e.name === iss.example);
    const blob = [iss.title, iss.cause, iss.fix, iss.impact].join(' ');
    const terms = st.facts.filter(f => f.kind === 'term' && (new RegExp(`\\b${f.term}\\b`).test(blob) || new RegExp(`\\b${iss.id}\\b`).test(f.text)));
    const notes = st.notes.filter(n => n.ref === iss.id);
    const k = esc(entry.key);
    const btn = (to, key, label, cls = '') => `<button class="kbtn ${cls}" type="button" data-issue-set="${k}" data-to="${to}"><kbd>${key}</kbd>${label}</button>`;
    // Dismiss = close the finding with metadata.resolution = dismissed; a later review round sees it and won't re-raise it
    const decide = {
      explained: [btn('approved', 'a', 'Approve', 'rec') + btn('dismissed', 'd', 'Dismiss', 'danger'), 'Claude can\'t fix this until you approve it.'],
      approved: [btn('explained', 'u', 'Undo') + btn('dismissed', 'd', 'Dismiss', 'danger'), 'Approved. Claude can fix it after your next prompt.'],
      fixed: ['', 'Fixed by Claude. Nothing for you to do.'],
      dismissed: [btn('explained', 'u', 'Undo'), 'Dismissed. Claude won\'t act on it, and later reviews skip it.'],
    }[iss.status];
    const src = entry.src;
    const srcAttr = src.bead ? `data-bead-open="${esc(src.bead.key)}"` : src.epic ? `data-epic-open="${esc(log.key)}|${esc(src.epic.id)}"` : '';
    const srcPill = srcAttr
      ? `<button class="pill p-src" type="button" ${srcAttr} title="open on the Planning tab">${esc(src.label)}${src.epic ? ` · ${esc(src.epic.id)}` : ''}</button>`
      : `<span class="pill p-src">ad hoc</span>`;
    const status = iss.status === 'dismissed'
      ? `${stepsHTML(['explained', 'approved', 'fixed'], 'explained', true)} <span class="steps"><b>dismissed</b></span>`
      : stepsHTML(['explained', 'approved', 'fixed'], iss.status);
    return `<article class="ws">
      <div class="ws-meta"><span>finding ${pos + 1} of ${list.length}</span>
        <span class="pill ${iss.owner === 'us' ? 'p-ours' : 'p-other'}">${iss.owner === 'us' ? 'ours' : 'platform / other'}</span>
        ${srcPill}</div>
      <h2><span class="id">${esc(iss.id)}</span>${esc(iss.title)}</h2>
      <dl class="gut">
        <dt>Status</dt><dd>${status}${iss.quote ? `<div class="quote">approved in chat: “${esc(iss.quote)}”</div>` : ''}</dd>
        <dt>Example</dt><dd class="wide">${ex ? exampleHTML(ex) : '<span class="dim">No example attached.</span>'}</dd>
        <dt>Cause</dt><dd>${esc(iss.cause)}</dd>
        <dt>Fix</dt><dd>${esc(iss.fix)}</dd>
        <dt>If skipped</dt><dd class="impact">${esc(iss.impact)}</dd>
        <dt>How sure</dt><dd>${confBadge(iss, `${entry.key}:method`)}
          ${iss.method ? `<div class="cmd"><pre>${esc(iss.method)}</pre><button class="btn" type="button" data-copy="${esc(iss.method)}">${view.copied === iss.method ? 'copied' : 'copy'}</button></div>` : '<span class="dim">No method given.</span>'}</dd>
        ${notes.length || terms.length ? `<dt>Linked</dt><dd><div class="linked">
          ${notes.map(n => `<div><span class="lid">${esc(n.id)}</span>${esc(n.text)}</div>`).join('')}
          ${terms.map(f => `<div><span class="lid">${esc(f.term)}</span>${esc(f.text)}</div>`).join('')}</div></dd>` : ''}
      </dl>
      <dl class="gut decide"><dt>Decide</dt><dd class="wide"><p class="msg">${decide[1]}</p>${decide[0] ? `<div class="kbtns">${decide[0]}</div>` : ''}</dd></dl>
      <footer class="ws-foot">
        ${prev ? `<button class="btn" type="button" data-issue-open="${esc(prev.key)}" title="k">‹ ${esc(prev.iss.id)}</button>` : '<span></span>'}
        ${next ? `<button class="btn" type="button" data-issue-open="${esc(next.key)}" title="j">${esc(next.iss.id)} ›</button>` : '<span></span>'}
      </footer></article>`;
  }

  function renderIssues() {
    const list = issueList();
    if (!list.some(x => x.key === view.selectedIssue)) {
      view.selectedIssue = (list.find(x => x.iss.status === 'explained') || list[0])?.key ?? null;
    }
    const row = x => `<button class="is-row st-${x.iss.status} ${x.key === view.selectedIssue ? 'sel' : ''}" type="button" data-issue-open="${esc(x.key)}" title="${x.iss.status}">
      <span class="g g--${x.iss.status}">${STATUS_GLYPH[x.iss.status]}</span><span class="id">${esc(x.iss.id)}</span>
      <span class="t">${esc(x.iss.title)}<span class="src">${esc(x.src.label)}${x.iss.owner === 'us' ? '' : ' · platform / other'}</span></span>
      <span class="cf" title="${esc(confGlyph[x.iss.confidence] || 'no confidence given')}">${CONF_GLYPH[x.iss.confidence] || '?'}</span></button>`;
    // One group per epic that has findings, then Ad hoc (P3 Q2)
    const groups = [];
    list.forEach(x => {
      const label = x.src.epic ? epicLabel(x.src.epic) : 'Ad hoc';
      let group = groups.find(g => g.label === label);
      if (!group) groups.push(group = { label, items: [] });
      group.items.push(x);
    });
    const groupHtml = g => `<div class="is-group"><span>${esc(g.label)}</span><span>${g.items.length}</span></div>` + g.items.map(row).join('');
    const waiting = list.filter(x => x.iss.status === 'explained').length;
    const selected = list.find(x => x.key === view.selectedIssue);

    document.getElementById('main').innerHTML = `${wtBanner()}
      <div class="tab-head"><h1>Issues</h1>
        <span class="meta">${list.length} findings · ${waiting} waiting for your approval</span></div>
      <div class="is-grid">
        <section class="panel is-list"><div class="panel-body">
          ${groups.map(groupHtml).join('') || '<div class="empty">No findings for this worktree.</div>'}
          <div class="legend">status ○ explained ◐ approved ● fixed ⊘ dismissed<br>sure ✓ verified ~ inferred ✗ unknown</div>
          ${queuedLine()}</div></section>
        <div>${selected ? worksheetHTML(selected, list) : '<div class="canvas"><p>No findings logged.</p></div>'}</div>
      </div>`;
  }

  // closeBead: Dismiss and close on a cap-hit bead also closes the bead; fromCap: picked on a cap-hit bead (Home lists its Undo)
  function setIssue(entryKey, status, closeBead = null, fromCap = false) {
    const [key, id] = entryKey.split('|');
    const st = S.states[key];
    const iss = st.issues.find(i => i.id === id);
    const prior = view.queued.find(q => q.key === key && q.issueId === id);
    const origin = prior ? prior.from : iss.status;
    iss.status = status;
    if (status !== 'approved') delete iss.quote;
    // A bead closed along with its finding reopens when the finding's change is replaced or undone
    if (prior?.bead) prior.bead.b.status = prior.bead.status;
    const bead = closeBead && { b: closeBead, status: closeBead.status };
    if (bead) closeBead.status = 'done';
    // Page action `issue set`: goes to that session's Claude on its next prompt.
    // Reason: setting it back to the status Claude already has cancels the queued change instead of sending a no-op
    const label = (status === 'explained' ? `${id} → explained (undo)` : `${id} → ${status}`) + (bead ? ` · ${closeBead.id} closed` : '');
    view.queued = view.queued.filter(q => q !== prior);
    if (status !== origin) view.queued.push({ key, label, issueId: id, from: origin, bead, capBead: fromCap || prior?.capBead });
    st.activity.unshift({ ts: clock(), by: 'user', t: 'issue', op: 'set', text: label, fresh: true });
    renderAll();
  }

  function stepIssue(delta) {
    const list = issueList();
    const pos = list.findIndex(x => x.key === view.selectedIssue);
    const next = list[pos + delta];
    if (!next) return;
    view.selectedIssue = next.key;
    renderAll();
  }

  // ---------- Files tab ----------
  // Kind comes from the filename prefix (same prefixes as repo memory artifacts); order = group order in the list
  const FILE_KINDS = [
    { prefix: 'prd_', label: 'PRD', what: 'one per epic; the epic points at it' },
    { prefix: 'plan_', label: 'Plan', what: 'a plan to execute' },
    { prefix: 'spec_', label: 'Spec', what: 'decisions other work must follow' },
    { prefix: 'ref_', label: 'Ref', what: 'facts captured from the world' },
    { prefix: '', label: 'Other', what: 'no known prefix' },
  ];
  const fileName = path => path.split('/').pop();
  const fileKind = path => FILE_KINDS.find(k => fileName(path).startsWith(k.prefix));

  // PRDs come from the epics (P2: `spec_id`); the rest from the artifacts folder. Grouped by kind, newest first inside a kind
  function fileList() {
    const logKey = view.wt;
    const st = S.states[logKey];
    const prds = (st.epics || []).filter(ep => ep.prd).map(ep => ({ path: ep.prd.path, md: ep.prd.md, epic: ep, prd: ep.prd }));
    const files = [...prds, ...(st.artifacts || [])].map(f => ({ ...f, key: `${logKey}|${f.path}`, kind: fileKind(f.path) }));
    const kindRank = f => FILE_KINDS.indexOf(f.kind);
    return files.sort((a, b) => kindRank(a) - kindRank(b) || sortKey(b.updated || '').localeCompare(sortKey(a.updated || '')));
  }

  function fileTitle(f) {
    return /^# (.*)/m.exec(f.md)?.[1] || fileName(f.path);
  }

  function fileHTML(f, list) {
    const pos = list.findIndex(x => x.key === f.key);
    const prev = list[pos - 1], next = list[pos + 1];
    const body = f.md.replace(/^# .*\n?/m, '');
    const sections = [...body.matchAll(/^## (.*)/gm)].map(m => m[1]);
    const epicPill = f.epic
      ? `<button class="pill p-src" type="button" data-epic-open="${esc(view.wt)}|${esc(f.epic.id)}" title="open on the Planning tab">${esc(epicLabel(f.epic))}</button>
        <span>Plan: ${esc(f.prd.plan)} · ${plural(f.prd.review, 'review round')}</span>`
      : '';
    const updated = f.updated ? `<span>updated ${esc(f.updated)}${f.by ? ` by ${esc(f.by)}` : ''}</span>` : '';
    return `<article class="ws">
      <div class="ws-meta"><span>file ${pos + 1} of ${list.length}</span><span class="pill p-ours" title="${esc(f.kind.what)}">${esc(f.kind.label)}</span>${epicPill}${updated}</div>
      <h2>${esc(fileTitle(f))}</h2>
      <div class="prd-path">${esc(f.path)}</div>
      ${sections.length ? `<nav class="prd-toc" aria-label="Sections">${sections.map(t => `<button class="chip" type="button" data-prd-jump="prd-${slug(t)}">${esc(t)}</button>`).join('')}</nav>` : ''}
      <div class="md">${mdToHTML(body)}</div>
      <footer class="ws-foot">
        ${prev ? `<button class="btn" type="button" data-file-open="${esc(prev.key)}" title="k">‹ ${esc(fileName(prev.path))}</button>` : '<span></span>'}
        ${next ? `<button class="btn" type="button" data-file-open="${esc(next.key)}" title="j">${esc(fileName(next.path))} ›</button>` : '<span></span>'}
      </footer></article>`;
  }

  function renderFiles() {
    const list = fileList();
    if (!list.some(x => x.key === view.selectedFile)) view.selectedFile = list[0]?.key ?? null;
    const row = f => `<button class="is-row fl-row ${f.key === view.selectedFile ? 'sel' : ''}" type="button" data-file-open="${esc(f.key)}">
      <span class="t">${esc(fileTitle(f))}<span class="fn">${esc(fileName(f.path))}${f.updated ? ` · ${esc(f.updated)}` : ''}</span></span></button>`;
    const groups = FILE_KINDS.map(k => ({ k, items: list.filter(f => f.kind === k) })).filter(g => g.items.length);
    const selected = list.find(f => f.key === view.selectedFile);

    document.getElementById('main').innerHTML = `${wtBanner()}
      <div class="tab-head"><h1>Files</h1>
        <span class="meta">${plural(list.length, 'file')} in .ernie/mem/${esc(curLog().branch)}/artifacts/ · read-only</span></div>
      <div class="is-grid">
        <section class="panel is-list"><div class="panel-body">
          ${groups.map(g => `<div class="is-group" title="${esc(g.k.what)}"><span>${esc(g.k.label)}</span><span>${g.items.length}</span></div>${g.items.map(row).join('')}`).join('')
            || '<div class="empty">No files yet. Claude writes PRDs, plans, specs and refs here.</div>'}
        </div></section>
        <div>${selected ? fileHTML(selected, list) : '<div class="canvas"><p>No files for this worktree.</p></div>'}</div>
      </div>`;
  }

  function stepFile(delta) {
    const list = fileList();
    const next = list[list.findIndex(x => x.key === view.selectedFile) + delta];
    if (!next) return;
    view.selectedFile = next.key;
    renderAll();
  }

  // ---------- Scratch tab ----------
  // Other formats from ref_ernie_formats.md the tab may take later (codes = that file's sections)
  const SCRATCH_SOON = [
    { name: 'Atomic example', what: 'Two real rows side by side, field names as row labels (B1).' },
    { name: 'Options on one example', what: 'Each option run on the same rows, ★ on the recommended one (B9).' },
    { name: 'Mapping table', what: 'A-field → B-field, with an analogy (B12).' },
    { name: 'Timeline', what: 'State over time; good for races and retries (A6).' },
    { name: 'Before / after', what: '3–5 lines each side instead of a diff (A5).' },
    { name: 'Annotated mini-lesson', what: 'A code block with notes under it, ready for /pnotes (B11).' },
    { name: 'Handoff text', what: 'Rewritten for another audience, with a copy button (B8, v2 per A93).' },
    { name: 'Arrow chain', what: 'Up to 4 hops as a diagram; longer flows stay numbered (A3).' },
  ];

  const scratchList = () => cur().scratch || [];

  function flowHTML(pad) {
    const steps = pad.steps.map(s => `<li><div>${esc(s.text)}${s.at ? `<span class="at">${esc(s.at)}</span>` : ''}${s.result ? `<span class="res">${esc(s.result)}</span>` : ''}</div></li>`).join('');
    return `<dl class="gut">
      ${pad.asked ? `<dt>Asked</dt><dd class="sc-asked">"${esc(pad.asked)}"</dd>` : ''}
      ${pad.example ? `<dt>Traced with</dt><dd>${esc(pad.example)}</dd>` : ''}
      <dt>Steps</dt><dd><ol class="sc-flow">${steps}</ol></dd>
      ${pad.end ? `<dt>End state</dt><dd>${esc(pad.end)}</dd>` : ''}</dl>`;
  }

  function renderScratch() {
    const pads = scratchList();
    const keyOf = pad => `${view.wt}|${pad.id}`;
    if (!view.scratchSeen.has(view.wt)) {
      view.scratchSeen.add(view.wt);
      if (pads[0]) view.scratchOpen.add(keyOf(pads[0]));
    }
    if (!pads.some(p => keyOf(p) === view.selectedScratch)) view.selectedScratch = pads[0] ? keyOf(pads[0]) : null;
    const row = (pad, i) => {
      const k = keyOf(pad);
      const open = view.scratchOpen.has(k);
      return `<section class="panel panel--ground sc-item ${open ? 'open' : ''} ${k === view.selectedScratch ? 'sel' : ''}">
        <button class="qf-line" type="button" data-scratch="${esc(k)}" aria-expanded="${open}">
          <span class="n">#${pads.length - i}</span><span class="t">${esc(pad.title)}</span>
          <span class="s">${esc(pad.kind)} · ${plural(pad.steps.length, 'step')} · ${esc(pad.ts)}</span></button>
        ${open ? `<div class="qf-body">${flowHTML(pad)}</div>` : ''}</section>`;
    };
    const soon = `<section class="sc-soon"><h2>More formats <span class="pill p-other">coming soon</span></h2>
      <ul>${SCRATCH_SOON.map(f => `<li><b>${esc(f.name)}</b>${esc(f.what)}</li>`).join('')}</ul></section>`;

    document.getElementById('main').innerHTML = `${wtBanner()}
      <div class="tab-head"><h1>Scratch</h1>
        <span class="meta">${plural(pads.length, 'pad')} · Claude writes these when you ask for an explanation · newest first · read-only</span></div>
      ${pads.map(row).join('') || '<div class="empty">No pads yet. Ask Claude to explain a flow in order and it lands here.</div>'}
      ${pads.length ? '<div class="qf-keys">j / k next pad · o open / close</div>' : ''}
      ${soon}`;
  }

  function toggleScratch(k) {
    if (!k) return;
    if (view.scratchOpen.has(k)) view.scratchOpen.delete(k);
    else view.scratchOpen.add(k);
    view.selectedScratch = k;
    renderAll();
  }

  function stepScratch(delta) {
    const pads = scratchList();
    const next = pads[pads.findIndex(p => `${view.wt}|${p.id}` === view.selectedScratch) + delta];
    if (!next) return;
    view.selectedScratch = `${view.wt}|${next.id}`;
    view.scratchOpen.add(view.selectedScratch);
    renderAll();
  }

  // ---------- Tool log tab ----------
  const isToolRow = a => a.t === 'tool' || a.t === 'file';
  // Reason: sample times are bare HH:MM:SS (today) or "yesterday HH:MM"; prefix so a string sort puts today first
  const sortKey = ts => /^\d\d:\d\d:\d\d$/.test(ts) ? '1' + ts : '0' + ts;

  // P3 Q5: sessions are a filter, not a container. Only activity rows carry `sid` (A123); Claude's and your item events don't,
  // so picking one session hides them
  function mergedRows() {
    const f = view.logFilter;
    return cur().activity
      .filter(a => (f.events || isToolRow(a))
        && (f.session === 'all' || a.sid === f.session)
        && (f.tool === 'all' || a.tool === f.tool)
        && !(f.hideAgents && a.agent)
        && (!f.filesOnly || a.t === 'file'))
      .sort((a, b) => sortKey(b.ts).localeCompare(sortKey(a.ts)));
  }

  // Sessions seen in this worktree's activity, newest first; the live one is marked
  function sessionsOf() {
    const seen = [];
    cur().activity.forEach(a => { if (a.sid && !seen.includes(a.sid)) seen.push(a.sid); });
    return seen;
  }

  // Descriptions (Bash, Agent) and item events read as prose; paths, globs, patterns and URLs stay mono
  const PROSE_TOOLS = ['Bash', 'Agent'];
  function rowHtml(a) {
    const kind = a.t === 'tool' ? 'tl' : a.t === 'file' ? 'file' : `ev by-${a.by}`;
    const who = isToolRow(a) ? a.tool : a.by === 'user' ? 'you' : a.by;
    const text = a.text ? esc(a.text) : '';
    const prose = !isToolRow(a) || PROSE_TOOLS.includes(a.tool);
    const tags = (a.t === 'file' ? '<span class="tag file">file</span>' : '') + (a.agent ? `<span class="tag">${esc(a.agent)}</span>` : '');
    return `<li class="${kind} ${a.fresh ? 'fresh' : ''}"><span class="cell">${esc(a.ts.replace('yesterday', 'yday'))}</span>
      <span class="cell tool" title="${esc(who)}">${esc(who)}</span>
      <span class="txt ${text ? (prose ? 'prose' : '') : 'none'}" ${text ? '' : 'title="no description"'}>${text || '—'}${tags}</span></li>`;
  }

  // One divider row each time the session changes; item events carry no session and stay under the one above them
  function sessionDivider(sid) {
    const live = sid === curLog().session.id;
    return `<li class="sess ${live ? 'now' : ''}">session ${esc(sid)}${live ? ' · current' : ''}</li>`;
  }

  function renderLogTab() {
    const f = view.logFilter;
    const sessions = sessionsOf();
    if (f.session !== 'all' && !sessions.includes(f.session)) f.session = 'all';
    const liveSid = curLog().session.id;
    const tools = [...new Set(cur().activity.filter(isToolRow).map(a => a.tool))].sort();
    document.getElementById('main').innerHTML = `${wtBanner()}
      <div class="tab-head"><h1>Tool log</h1><span class="meta" id="log-count"></span></div>
      <section class="panel panel--ground">
        <div class="filters">
          <select id="log-session" aria-label="Session"><option value="all">all sessions (${sessions.length})</option>${sessions.map(sid =>
            `<option value="${esc(sid)}" ${f.session === sid ? 'selected' : ''}>${esc(sid)}${sid === liveSid ? ' · current' : ''}</option>`).join('')}</select>
          <select id="log-tool" aria-label="Tool"><option value="all">all tools</option>${tools.map(t => `<option ${f.tool === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
          <label><input type="checkbox" id="log-agents" ${f.hideAgents ? 'checked' : ''}>hide subagents</label>
          <label><input type="checkbox" id="log-files" ${f.filesOnly ? 'checked' : ''}>files only</label>
          <label><input type="checkbox" id="log-events" ${f.events ? 'checked' : ''}>+ ernie events</label>
        </div>
        <ul class="feed" id="feed"></ul>
      </section>`;
    renderFeed();
  }

  function renderFeed() {
    const feed = document.getElementById('feed');
    if (!feed) return;
    const rows = mergedRows();
    let lastSid = null;
    const body = rows.map(a => {
      const divider = a.sid && a.sid !== lastSid ? sessionDivider(a.sid) : '';
      if (a.sid) lastSid = a.sid;
      return divider + rowHtml(a);
    }).join('');
    feed.innerHTML = `<li class="head"><span>Time</span><span>Tool</span><span>What</span></li>`
      + (body || '<li><span></span><span></span><span class="txt none">nothing matches</span></li>');
    document.getElementById('log-count').textContent = `${rows.length} rows · newest first · Bash shows its description, never the command`;
  }

  // ---------- Home tab: open questions ----------
  // Questions live in items.jsonl (P4 Q1) and replace queue.md "qs" (P4 Q2). An answer is a page op `question answer`
  // that reaches Claude with this session's next prompt; "need more context" sends `{more: true}` and keeps it open (A88)
  // Reason: an answer still waiting for the next prompt keeps its card (with Undo) until it's delivered
  const isOpen = q => !q.answer || q.more || view.queued.some(x => x.questionKey === `${view.wt}|${q.id}`);

  // Open questions as a focus list: one line each with its status; the selected question opens with Context /
  // If wrong / Example / Answer in a left gutter. Keys on Home: j/k move, 1–9 answer, m need more context, u undo
  // Cap-hit cards (derived from Beads, P6 Q6b) list first: until you pick, that bead's epic can't finish
  function questionList(open, caps = []) {
    const keys = homeKeys(open, caps);
    if (!keys.includes(view.selectedQuestion)) view.selectedQuestion = keys[0] ?? null;
    return caps.map(capCardHTML).join('') + open.map((q, i) => {
        const k = `${view.wt}|${q.id}`;
        const on = k === view.selectedQuestion;
        const sent = view.queued.find(x => x.questionKey === k);
        const choices = q.choices || [];
        const title = `${q.kind === 'assume' ? 'I assumed ' : ''}${esc(q.text)}${q.kind === 'assume' ? '. True?' : ''}`;
        const status = sent ? `<span class="s warn">sent · ${esc(sent.label)}</span>`
          : q.more ? '<span class="s warn">asked for more context</span>'
          : q.recommended ? `<span class="s rec">★ ${esc(q.recommended)}</span>`
          : '<span class="s"></span>';
        const ex = q.example && cur().examples.find(e => e.name === q.example);
        // Reason: assumption checks are yes/no only (A113), so they get no free-text box
        const other = q.kind === 'assume' ? '' : `<form class="other" data-answer-form="${esc(k)}">
          <input name="text" placeholder="other answer…" aria-label="Other answer for ${esc(q.id)}"><button class="btn" type="submit">Send</button></form>`;
        const answerRow = sent
          ? `<div class="qf-sent">→ ${esc(sent.label)} · goes with your next prompt <button class="btn" type="button" data-answer-undo="${esc(k)}">Undo</button></div>`
          : `<div class="kbtns">${choices.map((c, n) => `<button class="kbtn ${c === q.recommended ? 'rec' : ''}" type="button" data-answer="${esc(k)}" data-text="${esc(c)}">
              <kbd>${n + 1}</kbd>${esc(c)}${c === q.recommended ? '<small>recommended</small>' : ''}</button>`).join('')}
            <button class="kbtn" type="button" data-answer="${esc(k)}" data-more="1"><kbd>m</kbd>need more context</button></div>${other}`;
        const body = !on ? '' : `<div class="qf-body"><dl class="gut">
          ${q.context ? `<dt>Context</dt><dd>${esc(q.context)}</dd>` : ''}
          ${q.impact ? `<dt>If wrong</dt><dd class="impact">${esc(q.impact)}</dd>` : ''}
          ${ex ? `<dt>Example</dt><dd>${exampleHTML(ex)}</dd>` : ''}
          ${q.ref ? `<dt>About</dt><dd>${esc(q.ref)}</dd>` : ''}
          <dt>Answer</dt><dd>${answerRow}<div class="qf-keys">j / k next question${sent ? ' · u undo' : ''}</div></dd></dl></div>`;
        return `<div class="qf-item ${on ? 'sel' : ''}"><button class="qf-line" type="button" data-question="${esc(k)}">
          <span class="n">Q${i + 1}</span><span class="t">${title}</span>${status}</button>${body}</div>`;
      }).join('');
  }

  // Keys of the Home focus list in order: cap-hit cards ("<log>|cap:<bead id>"), then open questions
  const homeKeys = (open, caps) => [...caps.map(x => `${view.wt}|cap:${x.b.id}`), ...open.map(q => `${view.wt}|${q.id}`)];

  function stepQuestion(delta) {
    const keys = homeKeys(cur().questions.filter(isOpen), capCards(view.wt));
    const next = keys[keys.indexOf(view.selectedQuestion) + delta];
    if (!next) return;
    view.selectedQuestion = next;
    renderAll();
  }

  // Home keys act on the selected question; on a cap-hit card 1–4 pick its choices
  function questionKey(key) {
    const k = view.selectedQuestion;
    if (!k) return;
    if (k.includes('|cap:')) {
      const action = { 1: 'approve', 2: 'dismiss', 3: 'again', 4: 'changes' }[key];
      const bead = action && beadsOf(view.wt).find(x => `${view.wt}|cap:${x.b.id}` === k);
      return bead && capPick(bead.key, action);
    }
    const sent = view.queued.some(x => x.questionKey === k);
    if (key === 'u') return sent && undoAnswer(k);
    if (sent) return;
    if (key === 'm') return answerQuestion(k, '', true);
    const [logKey, id] = k.split('|');
    const choice = (S.states[logKey].questions.find(q => q.id === id)?.choices || [])[+key - 1];
    if (choice) answerQuestion(k, choice, false);
  }

  // Where work is: active epic, Now (P6 Q5: a bead's stage or a planning stage, derived from Beads), what `bd ready` would
  // hand out next (todo, every dep done) and the queue in tick order
  function workCard() {
    const st = cur();
    const all = beadsOf(view.wt);
    if (!all.length && !(st.epics || []).length) return panel('Where work is', '', '<div class="empty">No epics or beads for this worktree.</div>');
    const activeEpic = (st.epics || []).find(ep => ep.status === 'active');
    const queue = st.queue.map(id => {
      const bead = all.find(x => x.b.id === id);
      if (bead) return beadChip(bead);
      const iss = st.issues.find(i => i.id === id);
      return iss ? issueChip(view.wt, iss) : '';
    }).filter(Boolean);
    const doneIds = new Set(all.filter(x => x.b.status === 'done').map(x => x.b.id));
    const ready = all.filter(x => x.b.status === 'todo' && (x.b.deps || []).every(id => doneIds.has(id)));
    return panel('Where work is', '', `<div class="kv">
      ${activeEpic ? `<div><span class="k">Epic</span><span><button class="chip" type="button" data-epic-open="${esc(view.wt)}|${esc(activeEpic.id)}">${esc(epicLabel(activeEpic))}</button>${progressBar(activeEpic.beads)}</span></div>` : ''}
      <div><span class="k">Now</span><span>${nowHTML(nowOf(view.wt))}</span></div>
      <div><span class="k">Ready</span>${ready.length ? `<div class="chips">${ready.slice(0, 3).map(beadChip).join('')}</div>` : '<span class="hint">nothing ready</span>'}</div>
      ${queue.length ? `<div><span class="k">Queue</span><div class="chips">${queue.slice(0, 3).join('')}${queue.length > 3 ? `<span class="hint">+${queue.length - 3} more</span>` : ''}</div></div>` : ''}
    </div>`);
  }

  // What the next prompt's hook will inject: the sample's pending events plus this page's queued ones
  function inboxPanel() {
    const st = cur();
    const lines = [...st.pending.map(p => p.label), ...view.queued.filter(q => q.key === view.wt).map(q => q.label)];
    const body = lines.length
      ? `<div class="inbox"><div>ernie inbox · turn ${st.turn + 1}</div>${lines.map(t => `<div>- ${esc(t)}</div>`).join('')}</div>`
      : '<div class="empty">Nothing queued; the next prompt delivers nothing.</div>';
    return panel('Next prompt delivers', lines.length, body);
  }

  // Page op `note add`: goes to Claude with the next prompt and stays on the page
  function notePanel() {
    const notes = cur().notes.slice(-3).reverse();
    return panel('Add a note', '', `<form class="note-form" data-note-form>
        <input name="text" placeholder="note for Claude…" aria-label="Note for Claude"><button class="btn" type="submit">Add</button></form>
      ${notes.length ? `<ul class="answered" style="margin-top:10px">${notes.map(n => `<li><span class="item-id">${esc(n.id)}</span>${esc(n.text)}</li>`).join('')}</ul>` : ''}`);
  }

  function opsPanel() {
    const ops = cur().ops || [];
    return panel('Ops', ops.length, ops.length
      ? `<ol class="ops">${ops.map(o => `<li>${esc(o)}</li>`).join('')}</ol><div class="hint" style="margin-top:8px">this worktree's standing instructions · add with *op</div>`
      : '<div class="empty">No ops for this worktree. Add with *op.</div>');
  }

  function renderHome() {
    const st = cur();
    const open = st.questions.filter(isOpen);
    const caps = capCards(view.wt);
    const answered = st.questions.filter(q => !isOpen(q));
    // A cap-hit card leaves the moment you pick (P6 Q6b); its Undo stays here until the next prompt, like a dismissed fact
    const capSent = view.queued.filter(q => q.key === view.wt && q.capBead).map(sentLine).join('');
    const answeredList = answered.length
      ? `<ul class="answered">${answered.map(q => `<li><span class="item-id">${esc(q.id)}</span>${esc(q.text)}<br><span class="a">→ ${esc(q.answer)}</span></li>`).join('')}</ul>`
      : '<div class="empty">Nothing answered yet.</div>';
    document.getElementById('main').innerHTML = `${wtBanner()}
      <div class="tab-head"><h1>Home</h1>
        <span class="meta">${open.length} open question${open.length === 1 ? '' : 's'}${caps.length ? ` · ${caps.length} review cap` : ''} · ${answered.length} answered</span></div>
      <div class="home-top">${workCard()}${inboxPanel()}${notePanel()}</div>
      ${open.length || caps.length
        ? questionList(open, caps)
        : '<div class="canvas" style="min-height:200px"><p>No open questions for this worktree.</p></div>'}
      ${capSent ? `<div style="margin-top:12px">${capSent}</div>` : ''}
      <div class="home-bottom">${panel('Answered', answered.length, answeredList)}${opsPanel()}</div>`;
  }

  function addNote(text) {
    const st = cur();
    const id = `n${Math.max(0, ...st.notes.map(n => +n.id.slice(1))) + 1}`;
    st.notes.push({ id, text });
    view.queued.push({ key: view.wt, label: `note: ${text}` });
    logRow(view.wt, { by: 'user', t: 'note', op: 'add', text: `${id} ${text}` });
    renderAll();
  }

  // Answer, or ask for more context. Undo before the next prompt cancels the queued answer
  function answerQuestion(k, text, more) {
    const [key, id] = k.split('|');
    const q = S.states[key].questions.find(x => x.id === id);
    const label = more ? `${id}: need more context` : `${id} → ${text}`;
    view.queued.push({ key, label, questionKey: k, before: { answer: q.answer, more: q.more } });
    // Reason: the fold applies the answer as soon as the page writes it; only delivery to Claude waits for the prompt
    Object.assign(q, more ? { more: true } : { answer: text, more: false });
    logRow(key, { by: 'user', t: 'question', op: 'answer', text: label });
    renderAll();
  }

  function undoAnswer(k) {
    const sent = view.queued.find(x => x.questionKey === k);
    const [key, id] = k.split('|');
    Object.assign(S.states[key].questions.find(x => x.id === id), sent.before);
    view.queued = view.queued.filter(x => x !== sent);
    renderAll();
  }

  // ---------- Settings panel ----------
  function settingErrors(draft) {
    const errors = {};
    Object.entries(SETTING_RANGES).forEach(([name, [lo, hi]]) => {
      const n = draft[name];
      if (!Number.isInteger(n) || n < lo || n > hi) errors[name] = `${lo}–${hi}`;
    });
    if (!errors.prdMin && !errors.prdMax && draft.prdMin > draft.prdMax) errors.prdMax = 'max below min';
    if (!errors.reviewMin && !errors.reviewMax && draft.reviewMin > draft.reviewMax) errors.reviewMax = 'max below min';
    return errors;
  }
  const settingsDirty = () => Object.keys(SETTING_RANGES).some(name => view.settingsDraft[name] !== S.settings[name]);

  function renderSettings() {
    const box = document.getElementById('settings');
    const btn = document.getElementById('settings-btn');
    document.getElementById('queue-paused').hidden = !S.settings.queuePaused;
    btn.setAttribute('aria-expanded', String(view.settingsOpen));
    box.hidden = !view.settingsOpen;
    if (!view.settingsOpen) return;
    const d = view.settingsDraft;
    const num = name => `<input type="number" inputmode="numeric" data-setting="${name}" min="${SETTING_RANGES[name][0]}" max="${SETTING_RANGES[name][1]}" value="${d[name]}" aria-label="${name}"><span class="err" data-err="${name}"></span>`;
    const log = curLog();
    const kind = S.repoKinds?.[log.repo] || 'not set';
    const paused = S.settings.queuePaused;
    box.innerHTML = `
      <div class="panel-head"><span>Settings · every repo</span><button class="btn" type="button" data-settings-toggle aria-label="Close settings">✕</button></div>
      <div class="panel-body">
        <section>
          <div class="sub">Agent loop</div>
          <dl class="gut">
            <dt>Queue</dt><dd><div class="kbtns">
              <button class="kbtn ${paused ? '' : 'rec'}" type="button" data-queue-set="run" aria-pressed="${!paused}">Running</button>
              <button class="kbtn ${paused ? 'rec' : ''}" type="button" data-queue-set="pause" aria-pressed="${paused}">Paused</button></div>
              <p class="hint">${paused ? 'Ticked beads wait. Nothing new starts until you press Running.' : 'Claude works through ticked beads in order.'} Applies at once; Claude finishes the step it's on.</p></dd>
            <dt>Polish batch</dt><dd>${num('polishBatch')}<p class="hint">Beads per polish agent. 30 beads at 10 → 3 agents per round.</p></dd>
            <dt>Polish rounds</dt><dd><span class="pair">up to ${num('polishRounds')}</span><p class="hint">Stops sooner after a round with only small fixes, or when edits stop shrinking.</p></dd>
            <dt>PRD review</dt><dd><span class="pair">min ${num('prdMin')} max ${num('prdMax')}</span><p class="hint">Rounds before you approve the PRD. Each is a fresh agent.</p></dd>
            <dt>Code review</dt><dd><span class="pair">min ${num('reviewMin')} max ${num('reviewMax')}</span><p class="hint">Rounds per finished bead. Stops at the first clean round after the min; at the max it flags the bead and moves on.</p></dd>
          </dl>
        </section>
        <section>
          <div class="sub">This machine · read-only</div>
          <dl class="gut">
            <dt>Port</dt><dd><span class="ro">7477</span><span class="hint">ERNIE_PORT</span></dd>
            <dt>State folder</dt><dd><span class="ro">~/.local/state/ernie</span><span class="hint">ERNIE_HOME</span></dd>
            <dt>Repo kind</dt><dd><span class="ro">${esc(log.repo)} · ${esc(kind)}</span><span class="hint">git config · set by <code>ernie init</code></span></dd>
            <dt>Beads push</dt><dd><span class="ro">${kind === 'personal' ? 'on · every 5 min' : 'off · stealth'}</span><span class="hint">bd config dolt.auto-push</span></dd>
          </dl>
        </section>
        <div class="actions">
          <button class="btn btn--primary" type="button" data-settings-save>Save</button>
          <button class="btn" type="button" data-settings-reset>Reset to defaults</button>
          <span class="msg" id="settings-msg"></span>
        </div>
      </div>`;
    updateSettingsState();
  }

  // Refreshes Save, errors and the message without re-rendering, so a number input keeps focus while typing
  function updateSettingsState() {
    const errors = settingErrors(view.settingsDraft);
    document.querySelectorAll('#settings [data-err]').forEach(el => { el.textContent = errors[el.dataset.err] || ''; });
    const dirty = settingsDirty();
    document.querySelector('#settings [data-settings-save]').disabled = !dirty || Object.keys(errors).length > 0;
    document.getElementById('settings-msg').textContent = dirty ? 'Unsaved changes.' : view.settingsMsg;
  }

  function toggleSettings(open = !view.settingsOpen) {
    view.settingsOpen = open;
    view.settingsDraft = open ? { ...S.settings } : null;
    view.settingsMsg = '';
    renderSettings();
  }

  function renderAll() {
    pickWorktree();
    renderPicker();
    renderTabs();
    renderSettings();
    renderNowStrip();
    if (view.active === 'planning') renderPlanning();
    else if (view.active === 'issues') renderIssues();
    else if (view.active === 'facts') renderFacts();
    else if (view.active === 'scratch') renderScratch();
    else if (view.active === 'files') renderFiles();
    else if (view.active === 'log') renderLogTab();
    else renderHome();
    Object.values(S.states).forEach(st => st.activity.forEach(a => { a.fresh = false; }));
  }

  function openTab(key) {
    view.active = key;
    if (key === 'log') view.logUnseen = 0;
    history.replaceState(null, '', key === 'home' ? location.pathname : `#${key}`);
    renderAll();
  }

  // ---------- Events ----------
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-settings-toggle]')) return toggleSettings();
    // A click outside the open panel closes it (unsaved number edits are dropped) and still does its own thing
    if (view.settingsOpen && !t.closest('#settings')) toggleSettings(false);
    const queueSet = t.closest('[data-queue-set]');
    if (queueSet) {
      S.settings.queuePaused = queueSet.dataset.queueSet === 'pause';
      view.settingsMsg = S.settings.queuePaused ? 'Queue paused.' : 'Queue running.';
      return renderSettings();
    }
    if (t.closest('[data-settings-save]')) {
      Object.keys(SETTING_RANGES).forEach(name => { S.settings[name] = view.settingsDraft[name]; });
      view.settingsMsg = 'Saved to ~/.config/ernie/settings.json.';
      return renderSettings();
    }
    if (t.closest('[data-settings-reset]')) {
      Object.keys(SETTING_RANGES).forEach(name => { view.settingsDraft[name] = SETTINGS_DEFAULTS[name]; });
      return renderSettings();
    }
    const tab = t.closest('[data-tab]');
    if (tab) return openTab(tab.dataset.tab);

    // Epic and bead chips can sit on other tabs (a decision's ref, a finding's source); they open the Planning tab
    const epicOpen = t.closest('[data-epic-open]');
    if (epicOpen) {
      if (epicOpen.dataset.epicOpen !== view.selectedEpic) Object.assign(view, { epicOpen: null, auditOpen: false, newBead: false, opNote: null });
      view.selectedEpic = epicOpen.dataset.epicOpen;
      return view.active === 'planning' ? renderAll() : openTab('planning');
    }
    // The Now strip and Home's Now chip open an epic straight on its detail (a gate waiting on you, a running stage)
    const epicDetailOpen = t.closest('[data-epic-detail-open]');
    if (epicDetailOpen) {
      view.selectedEpic = epicDetailOpen.dataset.epicDetailOpen;
      Object.assign(view, { epicOpen: true, auditOpen: false, prdOpen: false, newBead: false, opNote: null });
      return view.active === 'planning' ? renderAll() : openTab('planning');
    }
    const tick = t.closest('[data-tick]');
    if (tick) return toggleTick(tick.dataset.tick);
    const beadOpen = t.closest('[data-bead-open]');
    if (beadOpen) {
      const [logKey, epicId] = beadOpen.dataset.beadOpen.split('|');
      view.wt = logKey;
      view.selectedEpic = `${logKey}|${epicId}`;
      view.selectedBead = beadOpen.dataset.beadOpen;
      Object.assign(view, { prdOpen: false, epicOpen: false, auditOpen: false, newBead: false, opNote: null });
      return view.active === 'planning' ? renderAll() : openTab('planning');
    }
    if (t.closest('[data-prd-toggle]')) {
      view.prdOpen = !view.prdOpen;
      view.newBead = false;
      return renderAll();
    }
    const epicDetail = t.closest('[data-epic-detail]');
    if (epicDetail) {
      Object.assign(view, { epicOpen: !epicDetail.classList.contains('sel'), auditOpen: false, prdOpen: false, newBead: false });
      return renderAll();
    }
    if (t.closest('[data-audit-open]') || t.closest('[data-audit-close]')) {
      view.auditOpen = !!t.closest('[data-audit-open]');
      return renderAll();
    }
    if (t.closest('[data-bead-new]')) {
      Object.assign(view, { newBead: !view.newBead, prdOpen: false });
      renderAll();
      return view.newBead && document.querySelector('[data-bead-form] input[name=title]')?.focus();
    }
    const gate = t.closest('[data-gate]');
    if (gate) {
      return gate.dataset.action === 'changes' ? openNote(`gate|${gate.dataset.gate}`) : gateAction(gate.dataset.gate, gate.dataset.action);
    }
    const cap = t.closest('[data-cap]');
    if (cap) return capPick(cap.dataset.cap, cap.dataset.action);
    const beadOpBtn = t.closest('[data-bead-op]');
    if (beadOpBtn) return beadOp(beadOpBtn.dataset.beadOp, beadOpBtn.dataset.action);
    const sendBackBtn = t.closest('[data-sendback]');
    if (sendBackBtn) return openNote(`sendback|${sendBackBtn.dataset.sendback}`);
    if (t.closest('[data-op-note-cancel]')) { view.opNote = null; return renderAll(); }
    const undo = t.closest('[data-undo]');
    if (undo) return undoOp(Number(undo.dataset.undo));
    const prdJump = t.closest('[data-prd-jump]');
    if (prdJump) return document.getElementById(prdJump.dataset.prdJump)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const issueJump = t.closest('[data-issue-jump]');
    if (issueJump) {
      view.wt = issueJump.dataset.issueJump.split('|')[0];
      view.selectedIssue = issueJump.dataset.issueJump;
      return openTab('issues');
    }
    // P3 Q4: archive writes a `<branch>.archived` marker (implies off); restore removes it. Neither reaches Claude
    const archive = t.closest('[data-archive]');
    if (archive) {
      Object.assign(logOf(archive.dataset.archive), { archived: true, on: false });
      return renderAll();
    }
    const restore = t.closest('[data-restore]');
    if (restore) {
      logOf(restore.dataset.restore).archived = false;
      return renderAll();
    }
    const research = t.closest('[data-research]');
    if (research) return startResearch(research.dataset.research);
    const factKindPill = t.closest('[data-fact-kind]');
    if (factKindPill) {
      const kind = factKindPill.dataset.factKind;
      view.factsKind = view.factsKind === kind ? 'all' : kind;
      return renderAll();
    }
    const question = t.closest('[data-question]');
    if (question) { view.selectedQuestion = question.dataset.question; return renderAll(); }
    const answer = t.closest('[data-answer]');
    if (answer) return answerQuestion(answer.dataset.answer, answer.dataset.text, !!answer.dataset.more);
    const factUndo = t.closest('[data-fact-undo]');
    if (factUndo) {
      const [key, id] = factUndo.dataset.factUndo.split('|');
      const sent = view.queued.find(q => q.key === key && q.fact?.id === id);
      S.states[key].facts.splice(sent.index, 0, sent.fact);
      view.queued = view.queued.filter(q => q !== sent);
      return renderAll();
    }
    const answerUndo = t.closest('[data-answer-undo]');
