<!DOCTYPE html>
<!--
  VARIATION 05 · Turn Timeline
  For: keeping an eye on what Claude did between your prompts, and catching up after being away.
  Key idea: the page is a vertical timeline cut at turn marks. Each turn reads top to bottom as
    you sent → Claude did (tool runs folded into "4 Bash · 1 Agent (3 subagent calls)…") → Claude logged (cards you can act on).
    The next prompt (your queued outbox) sits at the very top as a ghost turn; the current turn under it streams live.
    A right rail keeps the persistent "open now" state: questions N/M one at a time, issues awaiting approval (ours / theirs), plan, terms, decisions.
  MUST items:
    1. Selector: header dropdown, grouped by repo, each worktree with on/off and session state (working / waiting on you / idle / off). Picking one opens it as a tab.
    2. Tool log: per-turn "Claude did" lane (summary, expandable rows) + a separate "Tool log" sub-tab with the flat table and filters
       (tool, hide subagents, files only). A new tool run is appended to the working session every ~4 s and highlighted.
    3. Tabs (meaning a): worktree tabs across the top, each with a needs-you badge. Issues (meaning b) are focused one at a time in the rail with I n/M.
  Phone: the rail drops below the timeline; an "open now" strip at the top links down to it.
    4. Home tab: one compact "last turn" card per worktree, side by side.
  Turn 13 is synthesized: rows older than the turn-14 mark are grouped as turn 13 (no mark for it in the sample window).
-->

<div class="mock-banner">MOCK · Turn Timeline · sample data, no server <button type="button" id="sim-prompt" title="Mock only: stands in for you pressing enter in the terminal">simulate your next prompt</button></div>

  <div class="brand">ernie<span>.</span></div>
  <div class="picker" id="picker"></div>

    <span id="server-line"></span>
    <button class="icon-btn" id="theme-toggle" type="button">◐ theme</button>

<script>
// Shared sample data for the ernie view variations (ref_ernie_views/*.html).
// Every mock inlines a copy of ERNIE_SAMPLE so all ten show the same data and differ only in layout.
// Shapes follow spec_ernie.md (event types, fold output) plus A114 `tool run` activity rows.
// Fields marked "view-only" are not in the spec yet; mocks that use them should say so.

const ERNIE_SAMPLE = {
  server: { port: 7477, version: 'v0.1.0-12-g3c9e1a7', connected: true },

  // One entry per log file (~/.local/state/ernie/<repo>/<branch>.jsonl). Worktrees of one repo share the repo slug.
  logs: [

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clock = () => new Date().toTimeString().slice(0, 8);
const logOf = key => S.logs.find(l => l.key === key);
const stOf = key => S.states[key];
const stateClass = s => ({ 'working': 'working', 'waiting on you': 'waiting', 'idle': 'idle', 'off': 'off' }[s]);
const CONF = { verified: '✓', inferred: '~', unchecked: '✗' };
const NEXT_STATUS = { todo: 'active', active: 'done', done: 'todo', dropped: 'todo' };
const GLYPH = { todo: '', active: '▶', done: '✓', dropped: '–' };
const isToolRow = r => (r.t === 'tool' && r.op === 'run') || (r.t === 'file' && r.op === 'touch');
const shortTool = name => name.startsWith('mcp__') ? name.split('__').slice(1).join(' · ').replace('claude_ai_', '') : name;
const refId = r => (r.text.match(/^([pqifden]\d+)\b/) || [])[1];

// ---------- turn grouping: activity is newest first; turn marks split it ----------
function turnGroups(key) {
  const st = stOf(key);
  const rows = [...st.activity].reverse();
  const firstMark = rows.find(r => r.t === 'turn');
  const markNum = r => Number((r.text.match(/turn (\d+)/) || [])[1]);
  let current = { n: firstMark ? markNum(firstMark) - 1 : st.turn, mark: null, rows: [], synthetic: true };
  const groups = [];
  rows.forEach(r => {
    if (r.t !== 'turn') return current.rows.push(r);
    if (current.rows.length) groups.push(current);
    current = { n: markNum(r), mark: r, rows: [] };
  });
  groups.push(current);
  // Reason: your page/terminal events since a mark are delivered by the NEXT mark, so they belong to that turn's "you sent"
  groups.forEach((g, i) => {
    g.sent = g.mark?.delivered ? g.mark.delivered : (i > 0 ? groups[i - 1].rows.filter(r => r.by === 'user').map(r => r.text) : null);
  });
  return groups.reverse();
}

function toolSummary(rows) {
  const tools = rows.filter(isToolRow);
  const counts = new Map();
  tools.filter(r => !r.agent).forEach(r => counts.set(r.tool, (counts.get(r.tool) || 0) + 1));
  const subCalls = tools.filter(r => r.agent).length;
  const parts = [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([tool, n]) =>
    `<span><span class="n">${n}</span> ${esc(shortTool(tool))}${tool === 'Agent' && subCalls ? ` <span class="dim">(${subCalls} subagent calls)</span>` : ''}</span>`);
  return { html: parts.join('<span class="dim">·</span>'), count: tools.length };
}

function toolRow(r, opts = {}) {
  const sub = r.agent ? `<span class="sub">↳ ${esc(r.agent)}</span>` : '';
  const text = r.t === 'file' ? `✎ ${esc(r.text)}` : esc(r.text);
  const turnCol = opts.turn != null ? `<span class="turnno">T${opts.turn}</span>` : '';
  return `<li class="trow ${r.agent ? 'subagent' : ''} ${r.fresh ? 'fresh' : ''}"><span>${esc(r.ts)}</span>${turnCol}<span class="tool" title="${esc(r.tool)}">${esc(shortTool(r.tool))}</span><span class="txt">${text}</span>${sub}</li>`;
}

// ---------- shared cards ----------
function confBadge(item, key) {
  if (!item.confidence) return '';
  const mid = `m-${key}-${item.id}`;
  return `<button type="button" class="conf ${item.confidence}" title="${esc(item.method || 'no method given')}" data-method="${mid}">${CONF[item.confidence]} ${item.confidence}</button>`;
}
const methodLine = (item, key) => item.confidence ? `<div class="method ${view.methodOpen.has(`m-${key}-${item.id}`) ? 'show' : ''}">how: ${esc(item.method || 'no method given')}</div>` : '';

function exampleBlock(st, name) {
  const e = st.examples.find(x => x.name === name);
  if (!e) return '';
  return `<div class="ex"><div class="ex-title">${esc(e.name)} · ${esc(e.title)}</div><div class="ex-wrap"><table>
    <tr>${e.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
    ${e.rows.map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>
    ${e.caption ? `<div class="cap">${esc(e.caption)}</div>` : ''}${e.run ? `<div class="run">see for yourself: <code>${esc(e.run)}</code></div>` : ''}</div>`;
}
function exampleToggle(key, st, owner, name) {
  if (!name) return '';
  const k = `${key}:${owner}:${name}`;
  const open = view.exOpen.has(k);
  return `<div><button type="button" class="link-btn" data-ex="${esc(k)}">${open ? 'hide' : 'show'} example ${esc(name)}</button>${open ? exampleBlock(st, name) : ''}</div>`;
}

function questionCard(key, q, where) {
  const st = stOf(key);
  const pos = `Q${st.questions.indexOf(q) + 1}/${st.questions.length}`;
  const top = `<div class="card-top"><span class="kind">question</span><span>${pos} · ${q.id}</span></div>`;
  if (q.status === 'dropped') return `<div class="card">${top}<div class="dim">${esc(q.text)} (dropped)</div></div>`;
  if (q.answer && !q.more) return `<div class="card">${top}<div class="card-title">${esc(q.text)}</div><div class="ans">→ ${esc(q.answer)}</div></div>`;
  const title = q.kind === 'assume' ? `I assumed: ${esc(q.text)}. True?` : esc(q.text);
  const choices = q.kind === 'assume' ? ['yes', 'no'] : (q.choices || []);
  const chips = choices.map(c => `<button type="button" class="chip ${c === q.recommended ? 'rec' : ''}" data-answer="${q.id}" data-key="${esc(key)}" data-value="${esc(c)}">${esc(c)}${c === q.recommended ? ' ★ recommended' : ''}</button>`).join('');
  return `<div class="card needs" id="${where}-${q.id}">${top}<div class="card-title">${title}</div>
    ${q.context ? `<div class="kv"><i>context</i>${esc(q.context)}</div>` : ''}${q.impact ? `<div class="kv"><i>impact</i>${esc(q.impact)}</div>` : ''}
    ${exampleToggle(key, st, `${where}-${q.id}`, q.example)}
    ${q.more ? `<div class="waiting-more">you asked for more context · Claude answers on your next prompt</div>` : ''}
    <div class="actions">${chips}${q.more ? '' : `<button type="button" class="link-btn" data-more="${q.id}" data-key="${esc(key)}">need more context</button>`}</div>
    ${q.kind === 'assume' ? '' : `<input class="txt-in" data-keep="${where}-ans-${esc(key)}-${q.id}" data-answer-input="${q.id}" data-key="${esc(key)}" placeholder="or type an answer + enter">`}</div>`;
}

function issueCard(key, i, where) {
  const st = stOf(key);
  const pos = `I${st.issues.indexOf(i) + 1}/${st.issues.length}`;
  let actions = '';
  if (i.status === 'explained') actions = `<button type="button" class="btn btn--primary" data-issue="${i.id}" data-key="${esc(key)}" data-to="approved">Approve</button><button type="button" class="btn" data-issue="${i.id}" data-key="${esc(key)}" data-to="dropped">Drop</button><span class="dim mono">Claude can't fix until you approve</span>`;
  if (i.status === 'approved') actions = `${i.quote ? `<span class="quote">approved in chat: '${esc(i.quote)}'</span>` : '<span class="quote">approved on the page</span>'}<button type="button" class="link-btn" data-issue="${i.id}" data-key="${esc(key)}" data-to="explained">undo</button>`;
  return `<div class="card ${i.status === 'explained' ? 'needs' : ''}" id="${where}-${i.id}">
    <div class="card-top"><span class="kind">issue</span><span>${pos} · ${i.id}</span><span class="tag ${i.owner}">${i.owner === 'us' ? 'ours' : 'theirs'}</span><span class="st ${i.status}">${i.status}</span>${confBadge(i, key)}</div>
    <div class="card-title">${esc(i.title)}</div>
    <div class="kv"><i>cause</i>${esc(i.cause)}</div><div class="kv"><i>fix</i>${esc(i.fix)}</div><div class="kv"><i>impact</i>${esc(i.impact)}</div>
    ${methodLine(i, key)}${exampleToggle(key, st, `${where}-${i.id}`, i.example)}${actions ? `<div class="actions">${actions}</div>` : ''}</div>`;
}

function factCard(key, id) {
  const f = stOf(key).facts.find(x => x.id === id);
  if (!f) return `<div class="plain-line dim"><span class="id">${id}</span> dismissed</div>`;
  if (f.kind === 'term') return `<div class="card"><div class="card-top"><span class="kind">term</span><span>${f.id}</span></div><b class="mono">${esc(f.term)}</b> — ${esc(f.text)}</div>`;
  return `<div class="card"><div class="card-top"><span class="kind">fact</span><span>${f.id}</span>${confBadge(f, key)}
    <button type="button" class="link-btn" data-dismiss="${f.id}" data-key="${esc(key)}" style="margin-left:auto">dismiss</button></div>${esc(f.text)}${methodLine(f, key)}</div>`;
}

function diagramBlock(key, d) {
  const cacheKey = `${currentTheme()}|${d.mermaid}`;
  const cached = svgCache.get(cacheKey);
  return `<div class="card"><div class="card-top"><span class="kind">diagram</span><span>${esc(d.name)}</span></div>
    <div class="mmd" data-src="${esc(d.mermaid)}" data-cache="${esc(cacheKey)}">${cached || '<span class="dim mono">rendering…</span>'}</div></div>`;
}

// A logged row → the card for the item it touched, rendered from current state
function loggedCard(key, r) {
  const st = stOf(key), id = refId(r);
  if (r.t === 'plan') {
    const p = st.plan.find(x => x.id === id);
    return `<div class="plain-line"><span class="id">plan</span>${esc(r.text)}${p ? ` <span class="dim">· ${esc(p.text)} (now ${p.status})</span>` : ''}</div>`;
  }
  if (r.t === 'question') { const q = st.questions.find(x => x.id === id); return q ? questionCard(key, q, 'tl') : ''; }
  if (r.t === 'issue') { const i = st.issues.find(x => x.id === id); return i ? issueCard(key, i, 'tl') : ''; }
  if (r.t === 'example') return `<div class="card"><div class="card-top"><span class="kind">example</span></div>${exampleBlock(st, id)}</div>`;
  if (r.t === 'fact') return factCard(key, id);
  if (r.t === 'decision') { const d = st.decisions.find(x => x.id === id); return d ? `<div class="dec"><span class="id">${d.id}</span> <b>${esc(d.text)}</b><span class="why">${esc(d.why)}</span></div>` : ''; }
  if (r.t === 'diagram') { const d = st.diagrams.find(x => r.text.startsWith(x.name)); return d ? diagramBlock(key, d) : ''; }
  return `<div class="plain-line"><span class="id">${esc(r.t)}</span>${esc(r.text)}</div>`;
}

// ---------- timeline ----------
function nextPromptBlock(key) {
  const st = stOf(key);
  const items = st.pending.length
    ? `<div class="sent">${st.pending.map(p => `<span class="pill you">${esc(p.label)}</span>`).join('')}</div>`
    : '<div class="dim">Nothing queued. Claude is up to date.</div>';
  return `<section class="turn next"><div class="node">${st.turn + 1}</div>
    <div class="turn-head"><h2>Next prompt</h2><span class="meta">turn ${st.turn + 1} · goes to Claude when you next press enter in the terminal</span></div>
    <div class="turn-body"><div class="lane l-you"><div class="lane-label"><b>queued</b> ${st.pending.length} event${st.pending.length === 1 ? '' : 's'}</div>${items}
      ${st.inboxText ? `<pre class="inbox">${esc(st.inboxText)}</pre>` : ''}
      <input class="txt-in" id="note-input" data-keep="note-${esc(key)}" data-note="${esc(key)}" placeholder="Note to Claude… (enter to queue)"></div></div></section>`;
}

function turnBlock(key, g, isLatest) {
  const log = logOf(key);
  const live = isLatest && log.session.state === 'working';
  const expKey = `${key}:${g.n}`;
  const tools = g.rows.filter(isToolRow);
  const logged = g.rows.filter(r => r.by === 'claude');
  const sum = toolSummary(g.rows);
  const expanded = view.expanded.has(expKey);
  const shown = expanded ? tools : (live ? tools.slice(-3) : []);
  const started = g.mark ? g.mark.ts : (g.rows[0]?.ts || '');
  const sent = g.sent === null
    ? '<div class="dim">your prompt (before the sample window)</div>'
    : g.sent.length ? `<div class="sent">${g.sent.map(t => `<span class="pill you">${esc(t)}</span>`).join('')}</div>` : '<div class="dim">your prompt only, no page events</div>';
  return `<section class="turn ${live ? 'live' : ''}"><div class="node">${g.n}</div>
    <div class="turn-head"><h2>Turn ${g.n}</h2><span class="meta">${live ? '<span class="state working">● live</span> · ' : ''}started ${esc(started)}${g.synthetic ? ' · grouped from rows before the next mark' : ''}</span></div>
    <div class="turn-body">
      <div class="lane l-you"><div class="lane-label"><b>you sent</b></div>${sent}</div>
      <div class="lane l-did"><div class="lane-label"><b>claude did</b> ${sum.count} tool call${sum.count === 1 ? '' : 's'}
        ${sum.count ? `<button type="button" class="link-btn" data-expand="${esc(expKey)}">${expanded ? 'collapse' : 'show all rows'}</button>` : ''}</div>
        ${sum.count ? `<div class="summary">${sum.html}</div>` : '<div class="dim">no tool calls</div>'}
        ${shown.length ? `<ul class="rows">${shown.slice().reverse().map(r => toolRow(r)).join('')}</ul>` : ''}
        ${live && !expanded && tools.length > 3 ? `<div class="now">latest 3 of ${tools.length} · newest on top</div>` : ''}</div>
      <div class="lane l-log"><div class="lane-label"><b>claude logged</b> ${logged.length}</div>
        ${logged.length ? `<div class="cards">${logged.map(r => loggedCard(key, r)).join('')}</div>` : '<div class="dim">nothing logged this turn</div>'}</div>
    </div></section>`;
}

// Items whose add/put is older than the activity window, so no turn owns them
function earlierBlock(key, oldestTurn) {
  const st = stOf(key);
  const added = new Set(st.activity.filter(r => r.by === 'claude' && ['add', 'put'].includes(r.op)).map(refId));
  const qs = st.questions.filter(q => !added.has(q.id));
  const is = st.issues.filter(i => !added.has(i.id));
  const fs = st.facts.filter(f => !added.has(f.id) && f.kind !== 'term');
  const ex = st.examples.filter(e => !added.has(e.name));
  const parts = [];
  if (qs.length || is.length) parts.push(`<div class="lane-label"><b>questions · issues</b> live in the rail</div>` +
    [...qs.map(q => `<div class="plain-line"><span class="id">${q.id}</span>${esc(q.kind === 'assume' ? `I assumed: ${q.text}` : q.text)} <span class="dim">${q.answer ? `→ ${esc(q.answer)}` : q.more ? '· asked for more context' : '· open'}</span></div>`),
     ...is.map(i => `<div class="plain-line"><span class="id">${i.id}</span>${esc(i.title)} <span class="st ${i.status}">${i.status}</span></div>`)].join(''));
  if (fs.length) parts.push(`<div class="lane-label" style="margin-top:8px"><b>facts</b></div><div class="cards">${fs.map(f => factCard(key, f.id)).join('')}</div>`);
  if (ex.length) parts.push(`<div class="cards">${ex.map(e => `<div class="card">${exampleBlock(st, e.name)}</div>`).join('')}</div>`);
  if (st.notes.length) parts.push(`<div class="lane-label" style="margin-top:8px"><b>your notes</b></div>${st.notes.map(n => `<div class="plain-line"><span class="id">${n.id}</span>${esc(n.text)}${n.ref ? ` <span class="dim">→ ${esc(n.ref)}</span>` : ''}</div>`).join('')}`);
  if (st.diagrams.length) parts.push(`<div class="lane-label" style="margin-top:8px"><b>diagrams</b></div><div class="cards">${st.diagrams.map(d => diagramBlock(key, d)).join('')}</div>`);
  if (!parts.length) return '';
  return `<section class="turn"><div class="node">…</div><div class="turn-head"><h2>Before turn ${oldestTurn}</h2><span class="meta">logged earlier, outside the activity window</span></div>
    <div class="turn-body"><div class="lane l-log">${parts.join('')}</div></div></section>`;
}

function renderTimeline(key) {
  const groups = turnGroups(key);
  return `<div class="tl">${nextPromptBlock(key)}${groups.map((g, i) => turnBlock(key, g, i === 0)).join('')}${earlierBlock(key, groups[groups.length - 1].n)}</div>`;
}

function renderToolLog(key) {
  const st = stOf(key), f = view.filters;
  const turnOf = new Map();
  turnGroups(key).forEach(g => g.rows.forEach(r => turnOf.set(r, g.n)));
  const all = st.activity.filter(isToolRow);
  const tools = [...new Set(all.map(r => r.tool))];
  const rows = all.filter(r => (f.tool === 'all' || r.tool === f.tool) && !(f.hideSub && r.agent) && !(f.filesOnly && r.t !== 'file'));
  return `<div class="panel"><div class="panel-head"><span>Tool log · newest first</span><span class="count">${rows.length}/${all.length}</span></div><div class="panel-body">
    <div class="filters"><label>tool <select id="f-tool"><option value="all">all</option>${tools.map(t => `<option value="${esc(t)}" ${f.tool === t ? 'selected' : ''}>${esc(shortTool(t))}</option>`).join('')}</select></label>
      <label><input type="checkbox" id="f-sub" ${f.hideSub ? 'checked' : ''}> hide subagents</label>
      <label><input type="checkbox" id="f-files" ${f.filesOnly ? 'checked' : ''}> files only</label></div>
    <ul class="rows logtable">${rows.map(r => toolRow(r, { turn: turnOf.get(r) })).join('') || '<li class="dim">no rows match</li>'}</ul></div></div>`;
}

// ---------- rail ----------
function needsYou(key) {
  const st = stOf(key);
  if (!st) return 0;
  return st.questions.filter(q => !q.answer && !q.more && q.status !== 'dropped').length + st.issues.filter(i => i.status === 'explained').length;
}

function renderRail(key) {
  const st = stOf(key);
  const open = st.questions.filter(q => (!q.answer || q.more) && q.status !== 'dropped');
  const idx = Math.min(view.qIndex[key] || 0, Math.max(open.length - 1, 0));
  const qPanel = open.length
    ? `<div class="panel-head"><span>Open questions</span><span class="qnav"><span class="count">${idx + 1}/${open.length}</span>
        <button type="button" class="icon-btn" data-qnav="-1" ${idx === 0 ? 'disabled' : ''}>‹</button><button type="button" class="icon-btn" data-qnav="1" ${idx >= open.length - 1 ? 'disabled' : ''}>›</button></span></div>
       <div class="panel-body">${questionCard(key, open[idx], 'rail')}</div>`
    : `<div class="panel-head"><span>Open questions</span><span class="count">0</span></div><div class="panel-body dim">None open.</div>`;
  const live = st.issues.filter(i => i.status === 'explained' || i.status === 'approved');
  const closed = st.issues.filter(i => i.status === 'fixed' || i.status === 'dropped');
  const group = owner => live.filter(i => i.owner === owner).map(i => issueCard(key, i, 'rail')).join('');
  const awaiting = live.filter(i => i.status === 'explained').length;
  const issues = `<div class="panel-head"><span>Issues</span><span class="count">${awaiting} awaiting approval</span></div><div class="panel-body">
    ${live.some(i => i.owner === 'us') ? `<div class="grp">Ours (${live.filter(i => i.owner === 'us').length})</div><div class="cards">${group('us')}</div>` : ''}
    ${live.some(i => i.owner === 'other') ? `<div class="grp">Theirs (${live.filter(i => i.owner === 'other').length})</div><div class="cards">${group('other')}</div>` : ''}
    ${closed.map(i => `<div class="closed">${i.id} <span class="st ${i.status}">${i.status}</span> ${esc(i.title)}</div>`).join('')}
    ${st.issues.length ? '' : '<div class="dim">No issues.</div>'}</div>`;
  const done = st.plan.filter(p => p.status === 'done').length;
  const plan = `<div class="panel-head"><span>Plan</span><span class="count">${done}/${st.plan.length}</span></div>
    <div class="progress"><i style="width:${st.plan.length ? done / st.plan.length * 100 : 0}%"></i></div><div class="panel-body">
    ${st.plan.length ? `<ul class="plan">${st.plan.map(p => `<li class="${p.status}"><button type="button" class="sbox" data-plan="${p.id}" data-key="${esc(key)}" title="${p.status}: click to change">${GLYPH[p.status]}</button><span class="id">${p.id}</span> <span class="t">${esc(p.text)}</span></li>`).join('')}</ul>` : '<div class="dim">No plan yet.</div>'}</div>`;
  const terms = st.facts.filter(f => f.kind === 'term');
  const ref = (terms.length || st.decisions.length) ? `<div class="panel-head"><span>Terms · decisions</span></div><div class="panel-body">
    ${terms.length ? `<dl class="gloss">${terms.map(t => `<dt>${esc(t.term)}</dt><dd>${esc(t.text)}</dd>`).join('')}</dl>` : ''}
    ${st.decisions.map(d => `<div class="dec"><span class="id">${d.id}</span> ${esc(d.text)}<span class="why">${esc(d.why)}</span></div>`).join('')}</div>` : '';
  return `<aside class="rail" id="rail"><section class="panel">${qPanel}</section><section class="panel">${issues}</section><section class="panel">${plan}</section>${ref ? `<section class="panel">${ref}</section>` : ''}</aside>`;
}

// Narrow screens: the rail drops below the timeline, so this strip links down to it
function openStrip(key) {
  const st = stOf(key);
  const nq = st.questions.filter(q => !q.answer && !q.more).length, ni = st.issues.filter(i => i.status === 'explained').length;
  const done = st.plan.filter(p => p.status === 'done').length;
  return `<div class="open-strip"><a class="pill" href="#rail">open now ↓</a><a class="pill ${nq ? 'you' : ''}" href="#rail">${nq} question${nq === 1 ? '' : 's'}</a>
    <a class="pill ${ni ? 'you' : ''}" href="#rail">${ni} to approve</a><a class="pill" href="#rail">plan ${done}/${st.plan.length}</a></div>`;
}

// ---------- home ----------
function homeCard(log) {
  const sc = stateClass(log.session.state);
  const head = `<h3><span class="repo">${esc(log.repo)} /</span> ${esc(log.branch)}</h3>
    <div class="state ${sc}"><span class="dot ${sc}"></span> ${esc(log.session.state)} · last event ${esc(log.session.lastEventAgo)} ago</div>`;
  if (!log.on || !stOf(log.key)) return `<div class="hcard off">${head}<div class="hrow dim">ernie is off for this branch (<code>${esc(log.branch)}.off</code>). Run <code>ernie init</code> in your own shell to turn it back on.</div></div>`;
  const st = stOf(log.key), g = turnGroups(log.key)[0];
  const sum = toolSummary(g.rows);
  const logged = g.rows.filter(r => r.by === 'claude').map(r => r.text);
  const nq = st.questions.filter(q => !q.answer && !q.more).length, ni = st.issues.filter(i => i.status === 'explained').length;
  return `<div class="hcard">${head}
    <div class="hrow"><i>last turn · ${g.n}</i>${g.sent?.length ? `you sent ${g.sent.map(esc).join(', ')}` : '<span class="dim">no page events sent</span>'}</div>
    <div class="hrow"><i>claude did</i><span class="summary">${sum.count ? sum.html : '<span class="dim">no tool calls</span>'}</span></div>
    <div class="hrow"><i>claude logged</i>${logged.length ? logged.map(esc).join(' · ') : '<span class="dim">nothing</span>'}</div>
    <div class="hrow"><i>needs you</i>${nq} question${nq === 1 ? '' : 's'} · ${ni} issue${ni === 1 ? '' : 's'} to approve · ${st.pending.length} queued for next prompt</div>
    <div class="actions"><button type="button" class="btn ${nq + ni ? 'btn--primary' : ''}" data-open="${esc(log.key)}">open tab</button></div></div>`;
}

// ---------- chrome ----------
function renderPicker() {
  const cur = logOf(view.active);
  const repos = [...new Set(S.logs.map(l => l.repo))];
  document.getElementById('picker').innerHTML = `<button type="button" class="picker-btn" id="picker-btn">
      ${cur ? `<span class="dot ${stateClass(cur.session.state)}"></span><span class="name">${esc(cur.key)}</span>` : '<span class="name">pick a worktree</span>'} ▾</button>
    <div class="picker-menu ${view.pickerOpen ? 'open' : ''}">${repos.map(repo => `<div class="picker-repo">${esc(repo)}</div>` + S.logs.filter(l => l.repo === repo).map(l => {
      const sc = stateClass(l.session.state);
      return `<button type="button" class="picker-item ${l.on ? '' : 'off'}" data-open="${esc(l.key)}"><span class="dot ${sc}"></span>
        <span>${esc(l.branch)}<br><small>${esc(l.worktree)}</small></span><span class="state ${sc}">${l.on ? esc(l.session.state) : 'off'}</span></button>`;
    }).join('')).join('')}</div>`;
}

function renderTabs() {
  const tabs = view.tabs.map(key => {
    const log = logOf(key), sc = stateClass(log.session.state), n = needsYou(key);
    return `<div class="wtab ${view.active === key ? 'sel' : ''} ${view.bumped.has(key) ? 'bump' : ''}" data-tab="${esc(key)}" role="tab">
      <span class="dot ${sc}"></span><span><span class="repo">${esc(log.repo)}/</span>${esc(log.branch)}</span>
      ${sc === 'working' ? '<span class="badge live">live</span>' : ''}${n ? `<span class="badge" title="needs you">${n}</span>` : ''}
      <button type="button" class="x" data-close="${esc(key)}" title="close tab">×</button></div>`;
  }).join('');
  document.getElementById('tabbar').innerHTML = `<div class="wtab ${view.active === 'home' ? 'sel' : ''}" data-tab="home" role="tab">⌂ Home</div>${tabs}`;
  view.bumped.clear();
}

function render() {
  // Reason: keep focus + unsent text across full redraws (the real page redraws on every SSE frame)
  const focused = document.activeElement?.dataset?.keep;
  const caret = document.activeElement?.selectionStart;
  document.querySelectorAll('[data-keep]').forEach(el => { view.drafts[el.dataset.keep] = el.value; });
  const railScroll = document.querySelector('.rail')?.scrollTop || 0;

  renderPicker();
  renderTabs();
  const shell = document.getElementById('shell');
  document.getElementById('server-line').innerHTML = `<span class="state working">● live</span> 127.0.0.1:${S.server.port} · ${esc(S.server.version)}`;
  if (view.active === 'home') {
    shell.className = 'shell home';
    shell.innerHTML = `<div><p class="home-intro">What each session did in its last turn. Open one to see its full timeline.</p><div class="home-grid">${S.logs.map(homeCard).join('')}</div></div>`;
  } else {
    const key = view.active, log = logOf(key), sub = view.sub[key] || 'timeline';
    shell.className = 'shell';
    shell.innerHTML = `<div style="min-width:0"><div class="subbar"><div class="seg"><button type="button" class="${sub === 'timeline' ? 'sel' : ''}" data-sub="timeline">Timeline</button><button type="button" class="${sub === 'log' ? 'sel' : ''}" data-sub="log">Tool log</button></div>
      <span class="where">${esc(log.worktree)} · session ${esc(log.session.id || '—')} · <span class="state ${stateClass(log.session.state)}">${esc(log.session.state)}</span></span></div>
      ${openStrip(key)}${sub === 'timeline' ? renderTimeline(key) : renderToolLog(key)}</div>${renderRail(key)}`;
  }
  document.querySelectorAll('[data-keep]').forEach(el => {
    el.value = view.drafts[el.dataset.keep] || '';
    if (el.dataset.keep === focused) { el.focus(); if (caret != null) el.setSelectionRange(caret, caret); }
  });
  const rail = document.querySelector('.rail');
  if (rail) rail.scrollTop = railScroll;
  Object.values(S.states).forEach(st => st.activity.forEach(r => { r.fresh = false; }));
  window.dispatchEvent(new Event('diagrams'));
}

// ---------- actions: allowed page ops only; each one updates state + the pending outbox ----------
function queue(key, event, label) {
  const st = stOf(key);
  st.pending.push({ ...event, label });
  st.inboxText = `ernie inbox · turn ${st.turn + 1}\n` + st.pending.map(p => `- ${p.label}`).join('\n');
  render();
}
function answer(key, id, value, more = false) {
  const q = stOf(key).questions.find(x => x.id === id);
  const text = more ? 'need more context' : String(value).trim();
  if (!q || !text) return;
  q.answer = text; q.more = more;
  if (more) q.followUp = 'need more context';
  delete view.drafts[`rail-ans-${key}-${id}`]; delete view.drafts[`tl-ans-${key}-${id}`];
  queue(key, { t: 'question', op: 'answer', id, text, ...(more ? { more: true } : {}) }, `${id} → ${text}`);
}

document.addEventListener('click', e => {
  const t = sel => e.target.closest(sel);
  let el;
  if ((el = t('#picker-btn'))) { view.pickerOpen = !view.pickerOpen; return renderPicker(); }
  if (view.pickerOpen && !t('.picker-menu')) { view.pickerOpen = false; renderPicker(); }
  if ((el = t('[data-close]'))) { view.tabs = view.tabs.filter(k => k !== el.dataset.close); if (view.active === el.dataset.close) view.active = 'home'; return render(); }
  if ((el = t('[data-open]'))) {
    const key = el.dataset.open;
    view.pickerOpen = false;
    if (!stOf(key) || !logOf(key).on) { view.active = 'home'; return render(); }
    if (!view.tabs.includes(key)) view.tabs.push(key);
    view.active = key; return render();
  }
  if ((el = t('[data-tab]'))) { view.active = el.dataset.tab; return render(); }
  if ((el = t('[data-sub]'))) { view.sub[view.active] = el.dataset.sub; return render(); }
  if ((el = t('[data-expand]'))) { const k = el.dataset.expand; view.expanded.has(k) ? view.expanded.delete(k) : view.expanded.add(k); return render(); }
  if ((el = t('[data-ex]'))) { const k = el.dataset.ex; view.exOpen.has(k) ? view.exOpen.delete(k) : view.exOpen.add(k); return render(); }
  if ((el = t('[data-method]'))) { const k = el.dataset.method; view.methodOpen.has(k) ? view.methodOpen.delete(k) : view.methodOpen.add(k); return render(); }
  if ((el = t('[data-qnav]'))) { view.qIndex[view.active] = (view.qIndex[view.active] || 0) + Number(el.dataset.qnav); return render(); }
  if ((el = t('[data-answer]'))) return answer(el.dataset.key, el.dataset.answer, el.dataset.value);
  if ((el = t('[data-more]'))) return answer(el.dataset.key, el.dataset.more, '', true);
  if ((el = t('[data-plan]'))) {
    const p = stOf(el.dataset.key).plan.find(x => x.id === el.dataset.plan);
    p.status = NEXT_STATUS[p.status];
    return queue(el.dataset.key, { t: 'plan', op: 'set', id: p.id, status: p.status }, `${p.id} → ${p.status}`);
  }
  if ((el = t('[data-issue]'))) {
    const i = stOf(el.dataset.key).issues.find(x => x.id === el.dataset.issue);
    i.status = el.dataset.to;
    if (i.status === 'explained') delete i.quote;
    return queue(el.dataset.key, { t: 'issue', op: 'set', id: i.id, status: i.status }, `${i.id} → ${i.status === 'explained' ? 'explained (undo approval)' : i.status}`);
  }
  if ((el = t('[data-dismiss]'))) {
    const st = stOf(el.dataset.key);
    const f = st.facts.find(x => x.id === el.dataset.dismiss);
    st.facts = st.facts.filter(x => x !== f);
    return queue(el.dataset.key, { t: 'fact', op: 'dismiss', id: f.id }, `dismissed ${f.id} "${f.text}"`);
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const el = e.target;
  if (el.dataset.answerInput) return answer(el.dataset.key, el.dataset.answerInput, el.value);
  if (el.dataset.note && el.value.trim()) {
    const text = el.value.trim();
    el.value = ''; delete view.drafts[el.dataset.keep];
    queue(el.dataset.note, { t: 'note', op: 'add', text }, `note: ${text}`);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-tool') view.filters.tool = e.target.value;
  else if (e.target.id === 'f-sub') view.filters.hideSub = e.target.checked;
  else if (e.target.id === 'f-files') view.filters.filesOnly = e.target.checked;
  else return;
  render();
});

// Mock only: stands in for you sending a prompt; the UserPromptSubmit hook delivers the inbox and writes a turn mark
document.getElementById('sim-prompt').addEventListener('click', () => {
  const key = view.active === 'home' ? S.logs.find(l => l.session.state === 'working').key : view.active;
  const st = stOf(key);
  st.turn += 1;
  st.activity.unshift({ ts: clock(), by: 'hook', t: 'turn', op: 'mark', text: `turn ${st.turn} · delivered ${st.pending.length} event${st.pending.length === 1 ? '' : 's'}`, delivered: st.pending.map(p => p.label) });
  st.pending = []; st.inboxText = '';
  render();
});

// Simulated liveness: the working session gets a new tool run every ~4 s
setInterval(() => {
  const log = S.logs.find(l => l.session.state === 'working');
  const spec = LIVE_ROWS[liveStep++ % LIVE_ROWS.length];
  stOf(log.key).activity.unshift({ ts: clock(), by: 'hook', t: spec.t || 'tool', op: spec.op || 'run', tool: spec.tool, text: spec.text, ...(spec.agent ? { agent: spec.agent } : {}), fresh: true });
  log.session.lastEventAgo = '0s';
  if (view.active !== log.key) view.bumped.add(log.key);
  render();
}, 4000);

// Theme
const root = document.documentElement;
window.currentTheme = () => root.dataset.theme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
document.getElementById('theme-toggle').addEventListener('click', () => { root.dataset.theme = currentTheme() === 'dark' ? 'light' : 'dark'; render(); });
window.svgCache = svgCache;
render();
</script>

<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
const palettes = {
  dark: { primaryColor: '#0c2f48', primaryTextColor: '#d8e6f2', primaryBorderColor: '#38bdf8', lineColor: '#5f7d96', secondaryColor: '#0f1e2c', tertiaryColor: '#0c1925',
    background: '#0c1925', mainBkg: '#0c2f48', edgeLabelBackground: '#0c1925', actorBkg: '#0c2f48', actorBorder: '#38bdf8', actorTextColor: '#d8e6f2', actorLineColor: '#1f5a82',
    signalColor: '#8299ae', signalTextColor: '#d8e6f2', noteBkgColor: '#78350f', noteTextColor: '#fde68a' },
  light: { primaryColor: '#e0f2fe', primaryTextColor: '#0d1f2e', primaryBorderColor: '#0284c7', lineColor: '#7b93a8', secondaryColor: '#ffffff', tertiaryColor: '#f3f7fb',
    background: '#eef3f8', mainBkg: '#e0f2fe', edgeLabelBackground: '#eef3f8', actorBkg: '#e0f2fe', actorBorder: '#0284c7', actorTextColor: '#0d1f2e', actorLineColor: '#7cc4ee',
    signalColor: '#557087', signalTextColor: '#0d1f2e', noteBkgColor: '#fef3c7', noteTextColor: '#92400e' },
};
let pass = 0;
// Reason: only render diagrams missing from the cache; Mermaid is the expensive part of a redraw
async function renderDiagrams() {
  const targets = [...document.querySelectorAll('.mmd')].filter(el => !window.svgCache.has(el.dataset.cache));
  if (!targets.length) return;
  const theme = window.currentTheme();
  mermaid.initialize({ startOnLoad: false, theme: 'base', securityLevel: 'strict', fontFamily: "'Fragment Mono', ui-monospace, monospace",
    themeVariables: { ...palettes[theme], fontFamily: "'Fragment Mono', ui-monospace, monospace", fontSize: '13px' }, flowchart: { curve: 'basis' }, sequence: { mirrorActors: false } });
  for (const el of targets) {
    try {
      const { svg } = await mermaid.render(`dgm-${++pass}`, el.dataset.src);
      window.svgCache.set(el.dataset.cache, svg);
    } catch (err) {
      window.svgCache.set(el.dataset.cache, `<span class="dim mono">Diagram failed to render: ${String(err.message || err).replace(/</g, '&lt;')}</span>`);
    }
    document.querySelectorAll('.mmd').forEach(node => { if (node.dataset.cache === el.dataset.cache) node.innerHTML = window.svgCache.get(el.dataset.cache); });
  }
}
await document.fonts.ready;
renderDiagrams();
window.addEventListener('diagrams', renderDiagrams);
</script>
