<!--
  Variation 10 · Issue Threads
  For: following each issue's story from finding to fix, one item at a time, across several worktrees.
  Key idea: every ernie issue and question is a THREAD (Slack/Linear style). Its history reads as a
  conversation of structured events: Claude explained i1 with e1 (✓ + method) → you asked for more →
  you approved → Claude's tool runs (linked to the item by timing) → fixed. The composer under a thread
  offers only the spec's page actions and says they reach Claude on your next prompt.
  MUST items:
    1. Selector  → left sidebar: repo → worktree list with session-state dots (working / waiting / idle / off); click to switch log.
    2. Tool log  → #tool-log channel (filters: tool, hide subagents, files only) + tool runs folded into each thread
                   as "Claude: 1 file touched, 2 Bash runs" (expandable). A new row lands every ~4 s on the working log.
    3. Tabs      → meaning (b): issue/question threads open as tabs, from any worktree (tab carries the ticket tag,
                   which covers meaning (a)). Unread dot when something new lands in a background tab.
    4. Home      → digest of threads changed since you last looked, grouped by worktree, with "needs you" counts.
  View-only (not in the spec): per-thread history (HISTORY), last-seen marks, tool-run ↔ item linking by time.
-->
<!DOCTYPE html>

<style>

    --accent: #0284c7; --accent-soft: #e0f2fe; --border: #d3dfea; --border-accent: #7cc4ee;
    --success: #059669; --warning: #b45309; --error: #dc2626;
    --pass-bg: #d1fae5; --pass-fg: #065f46; --warn-bg: #fef3c7; --warn-fg: #92400e;
    --info-bg: #dbeafe; --info-fg: #1e40af; --shadow: rgba(13,31,46,.16);

}

  --bg: #f3f7fb; --bg-card: #ffffff; --bg-recessed: #eef3f8; --bg-raised: #ffffff;
  --text: #0d1f2e; --text-dim: #557087; --text-accent: #0369a1;
  --accent: #0284c7; --accent-soft: #e0f2fe; --border: #d3dfea; --border-accent: #7cc4ee;
  --success: #059669; --warning: #b45309; --error: #dc2626;
  --pass-bg: #d1fae5; --pass-fg: #065f46; --warn-bg: #fef3c7; --warn-fg: #92400e;

.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: calc(100dvh - 26px); }

/* Sidebar */
.side { background: var(--bg-recessed); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 10px 16px; }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 10px; }
.brand { font-weight: 800; font-size: 19px; letter-spacing: -.02em; } .brand span { color: var(--accent); }
.icon-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font: 11px var(--mono); }
.icon-btn:hover { border-color: var(--accent); }
.sec { font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); padding: 14px 8px 4px; }
.nav { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none;
  padding: 5px 8px; border-radius: 6px; font-size: 13.5px; min-width: 0; }
.nav:hover { background: var(--bg-card); } .nav.sel { background: var(--accent-soft); color: var(--text-accent); }
.nav .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .nav.unread .lbl { font-weight: 600; color: var(--text); }
.nav small { display: block; font: 10.5px var(--mono); color: var(--text-dim); } .nav.off { opacity: .55; }
.n { font: 10.5px var(--mono); padding: 0 6px; border-radius: 9px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim); }
.n.hot { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
.repo { font: 11px var(--mono); color: var(--text-dim); padding: 6px 8px 2px; } .sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.s-working { background: var(--success); animation: pulse 1.8s ease-in-out infinite; }
.s-waiting { background: var(--warning); } .s-idle { background: var(--text-dim); } .s-off { border: 1.5px solid var(--text-dim); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.udot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabbar { display: flex; align-items: flex-end; gap: 3px; padding: 8px 10px 0; border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: thin; flex: none; }
.tab { display: flex; align-items: center; gap: 6px; flex: none; max-width: 240px; padding: 6px 10px; border: 1px solid var(--border);
  border-bottom: 0; border-radius: 7px 7px 0 0; background: var(--bg-recessed); font-size: 12.5px; color: var(--text-dim); }
.tab.sel { background: var(--bg-card); color: var(--text); border-color: var(--border-accent); }
.tab .tl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tab .x { border: 0; background: none; padding: 0 2px; color: var(--text-dim); }
.tab .x:hover { color: var(--error); } .tw { font: 10px var(--mono); color: var(--text-accent); } .menu-btn { display: none; margin-bottom: 4px; }
.pane { flex: 1; overflow-y: auto; padding: 18px 24px 28px; min-height: 0; } .wrap { max-width: 860px; margin: 0 auto; }
h2 { font-size: 20px; margin: 2px 0 6px; letter-spacing: -.01em; overflow-wrap: break-word; }
h3 { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin: 22px 0 8px; }
.crumb, .hint { font: 11px var(--mono); color: var(--text-dim); } .empty { color: var(--text-dim); font-size: 13px; padding: 6px 0; }
.tid { font: 11px var(--mono); color: var(--accent); }

/* Thread rows (channel lists, home digest) */
.trow { display: grid; grid-template-columns: 10px 46px minmax(0, 1fr) auto; gap: 4px 8px; align-items: baseline; width: 100%;
  text-align: left; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); margin-bottom: 6px; }
.trow:hover { border-color: var(--accent); } .trow .tt { font-weight: 600; overflow-wrap: break-word; }
.trow .last { grid-column: 3 / 5; font: 11.5px var(--mono); color: var(--text-dim); overflow-wrap: anywhere; }
.pill { font: 10.5px var(--mono); padding: 1px 7px; border-radius: 9px; border: 1px solid var(--border); white-space: nowrap; color: var(--text-dim); }
.pill.explained, .pill.open { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
.pill.approved { background: var(--info-bg); color: var(--info-fg); border-color: transparent; }
.pill.fixed, .pill.answered { background: var(--pass-bg); color: var(--pass-fg); border-color: transparent; } .pill.dropped { text-decoration: line-through; }
.wt-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px 6px; margin-bottom: 14px; background: var(--bg-recessed); }
.wt-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.wt-head b { font-family: var(--mono); font-size: 13px; font-weight: 400; }

/* Thread */
.th-head { border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 6px; }
.th-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.gate { display: inline-flex; gap: 4px; align-items: center; font: 11px var(--mono); flex-wrap: wrap; } .gate i { color: var(--text-dim); font-style: normal; }
.step { padding: 2px 8px; border-radius: 9px; border: 1px dashed var(--border); color: var(--text-dim); }
.step.done { border-style: solid; color: var(--success); }
.step.cur { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--text-accent); } .step.drop { text-decoration: line-through; }
.msg { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 0; position: relative; }
.msg + .msg::before { content: ''; position: absolute; left: 14px; top: -10px; height: 18px; border-left: 1px solid var(--border); }
.av { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font: 600 11px var(--mono); }
.av.claude { background: var(--accent-soft); color: var(--accent); } .av.user { background: var(--pass-bg); color: var(--pass-fg); }
.av.hook { background: var(--bg-recessed); color: var(--text-dim); border: 1px solid var(--border); }
.who { font: 11px var(--mono); color: var(--text-dim); } .who b { font: 600 13px var(--sans); color: var(--text); margin-right: 4px; }
.body { margin-top: 2px; overflow-wrap: break-word; min-width: 0; }
.card { border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); padding: 10px 12px; margin-top: 6px; min-width: 0; }
.kv { margin: 6px 0 0; } .kv b { font-weight: 600; }
.queued { font: 10.5px var(--mono); color: var(--warn-fg); background: var(--warn-bg); padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.badge { font: 11px var(--mono); padding: 1px 7px; border-radius: 9px; border: 0; } .b-verified { background: var(--pass-bg); color: var(--pass-fg); }
.b-inferred { background: var(--info-bg); color: var(--info-fg); } .b-unchecked { background: var(--warn-bg); color: var(--warn-fg); }
.method { font: 11.5px var(--mono); color: var(--text-dim); margin-top: 4px; overflow-wrap: anywhere; }
.ex { margin: 8px 0 0; } .ex figcaption { font-size: 13px; margin-bottom: 4px; }
.ex-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
.ex table { border-collapse: collapse; font: 12px var(--mono); width: 100%; }
.ex th, .ex td { padding: 5px 9px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
.ex th { color: var(--text-dim); font-weight: 400; background: var(--bg-recessed); } .ex tr:last-child td { border-bottom: 0; }
.cap, .run { font-size: 12.5px; color: var(--text-dim); margin: 4px 0 0; } .tools summary { cursor: pointer; font: 12px var(--mono); color: var(--text-dim); }
.feed { list-style: none; margin: 0; padding: 0; font: 12px var(--mono); }
.feed li { display: grid; grid-template-columns: 62px 64px minmax(0, 1fr); gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); }
.feed li:last-child { border-bottom: 0; } .feed .t { color: var(--text-dim); } .feed .tool { color: var(--warning); overflow: hidden; text-overflow: ellipsis; }
.feed .tx { overflow-wrap: anywhere; } .feed .ag { color: var(--accent); margin-left: 6px; } .feed .ev .tool { color: var(--accent); }
.fresh { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.mmd { overflow: auto; padding: 10px; display: flex; justify-content: center; min-height: 80px; } .mmd .nodeLabel { color: var(--text) !important; }
.link { background: none; border: 0; padding: 0; color: var(--text-accent); text-decoration: underline; font: 12px var(--mono); }
.wait { font: 12px var(--mono); color: var(--text-dim); padding: 8px 0 0 40px; }

/* Composer + outbox */
.composer { border-top: 1px solid var(--border-accent); background: var(--bg-raised); padding: 10px 24px; flex: none; }
.composer .wrap { display: flex; flex-direction: column; gap: 8px; } .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { font: 12px var(--mono); padding: 6px 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); }
.btn:hover { border-color: var(--accent); } .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.rec { border-color: var(--accent); } .btn.danger:hover { border-color: var(--error); color: var(--error); }
.inp { flex: 1; min-width: 140px; font: 12.5px var(--mono); padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text); }
.inp:focus { outline: none; border-color: var(--accent); } .deliver { font: 11px var(--mono); color: var(--text-dim); }
.outbox { border-top: 1px solid var(--border); background: var(--bg-recessed); padding: 7px 24px; flex: none; }
.outbox .row { max-width: 860px; margin: 0 auto; }
.outbox pre { max-width: 860px; margin: 6px auto 0; padding: 10px 12px; border-radius: 8px; background: var(--bg-card);
  border: 1px solid var(--border); font: 12px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.plan { list-style: none; margin: 0; padding: 0; }
.plan li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--border); }
.box { width: 20px; height: 20px; flex: none; border-radius: 5px; border: 1.5px solid var(--text-dim); background: none; padding: 0; font: 800 12px var(--sans); }
.plan .done { color: var(--text-dim); text-decoration: line-through; }
.plan .done .box { background: var(--success); border-color: var(--success); color: var(--bg); }
.plan .active .box { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); } .plan .dropped { opacity: .5; }
.dec { padding: 4px 0 4px 12px; border-left: 2px solid var(--accent); margin: 8px 0; } .dec .why { display: block; font-size: 13px; color: var(--text-dim); }
.fact { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--border); flex-wrap: wrap; }
.fact .ft { flex: 1; min-width: 180px; } dl.gloss { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; }
dl.gloss dt { font: 600 12.5px var(--mono); color: var(--text-accent); } dl.gloss dd { margin: 0; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font: 12px var(--mono); margin-bottom: 10px; }
.filters select { font: 12px var(--mono); background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 40; top: 26px; bottom: 0; left: 0; width: min(86vw, 300px); transform: translateX(-105%);
    transition: transform .2s; box-shadow: 0 0 40px var(--shadow); }
  .side.open { transform: none; }
  .menu-btn { display: inline-block; flex: none; }
  .pane { padding: 14px 16px 24px; }
  .composer, .outbox { padding-left: 16px; padding-right: 16px; }
  .trow { grid-template-columns: 10px 40px minmax(0, 1fr); } .trow .pill { grid-column: 3; justify-self: start; }
  .trow .last { grid-column: 2 / 4; }
  .feed li { grid-template-columns: 58px minmax(0, 1fr); } .feed .tool { grid-column: 2; } .feed .tx { grid-column: 1 / 3; }
}
</style>
</head>
<body>
<div class="mock-banner">MOCK · Issue Threads · sample data, no server</div>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <nav class="tabbar" id="tabbar" aria-label="Open threads"></nav>
    <section class="pane" id="pane"></section>
    <div class="composer" id="composer" hidden></div>
    <div class="outbox" id="outbox"></div>
  </main>
</div>

<script>
// Shared sample data for the ernie view variations (ref_ernie_views/*.html).
// Every mock inlines a copy of ERNIE_SAMPLE so all ten show the same data and differ only in layout.
// Shapes follow spec_ernie.md (event types, fold output) plus A114 `tool run` activity rows.
// Fields marked "view-only" are not in the spec yet; mocks that use them should say so.

const ERNIE_SAMPLE = {
  server: { port: 7477, version: 'v0.1.0-12-g3c9e1a7', connected: true },

  // One entry per log file (~/.local/state/ernie/<repo>/<branch>.jsonl). Worktrees of one repo share the repo slug.
  logs: [
    {
      key: 'glue/CDIT-2631-ga4-dedupe', repo: 'glue', branch: 'CDIT-2631-ga4-dedupe', on: true,
      worktree: '~/things/myc/glue/CDIT-2631-ga4-dedupe', // view-only: spec stores the repo root, not the worktree path
      session: { id: '4995d496', state: 'working', lastEventAgo: '3s' }, // view-only: derived from hook timestamps
    },
    {
      key: 'glue/CDIT-2627-gsc-backfill', repo: 'glue', branch: 'CDIT-2627-gsc-backfill', on: true,
      worktree: '~/things/myc/glue/CDIT-2627-gsc-backfill',
      session: { id: '3fb7e802', state: 'waiting on you', lastEventAgo: '6m' },
    },
    {
      key: 'glue/main', repo: 'glue', branch: 'main', on: true,
      worktree: '~/things/myc/glue/main',
      session: { id: null, state: 'idle', lastEventAgo: '1d' },
    },
    {
      key: 'ernie/main', repo: 'ernie', branch: 'main', on: true,
      worktree: '~/things/myc/ernie/main',
      session: { id: '715abde2', state: 'idle', lastEventAgo: '2h' },
    },
    {
      key: 'dotfiles/main', repo: 'dotfiles', branch: 'main', on: false, // has a main.off marker
      worktree: '~/.dotfiles',
      session: { id: null, state: 'off', lastEventAgo: '5d' },
    },
  ],

  // Folded state per log key, as `GET /stream` would push it.
  states: {
    'glue/CDIT-2631-ga4-dedupe': {
      turn: 14,
      plan: [
        { id: 'p1', text: 'Reproduce double count on one Dealer Spike host', status: 'done' },
        { id: 'p2', text: 'Find the dedupe gap', status: 'done' },
        { id: 'p3', text: 'Normalize page_location before hashing', status: 'active' },
        { id: 'p4', text: 'Backfill 90 days', status: 'todo' },
        { id: 'p5', text: 'Verify session counts on stage', status: 'todo' },
        { id: 'p6', text: 'Open PR', status: 'todo' },
      ],
      decisions: [
        { id: 'd1', text: 'dedupe_key = sha1(session_id, normalized page_location, event_ts)', why: 'event_ts alone collides across tabs; session_id alone merges real repeat views' },
        { id: 'd2', text: 'Platform-side bugs go to the platform team, not fixed in glue', why: 'we only own the loader and views' },
      ],
      questions: [
        {
          id: 'q1', kind: 'assume', text: 'publicDigmsDB.clients = Glue\'s client list', choices: ['yes', 'no'],
          context: 'The 212-site count below comes from joining ga4_hits to publicDigmsDB.clients.',
          impact: 'If clients is missing sites, the double-count rate is understated.',
        },
        {
          id: 'q2', text: 'Normalize page_location in the SQL view or in the loader?', choices: ['view', 'loader'], recommended: 'view',
          context: 'Both fix new rows. Only the view also fixes old rows without a backfill.',
          impact: 'Loader means a 90-day backfill (~40 min on stage) before counts are right.',
          example: 'e2',
        },
        { id: 'q3', text: 'Backfill window?', choices: ['30 days', '90 days'], answer: '90 days' },
        {
          id: 'q4', text: 'Should the dedupe also cover Dealer Inspire hosts?', choices: ['yes', 'no'],
          more: true, followUp: 'need more context', // answered "need more context" → stays open (A88)
        },
      ],
      issues: [
        {
          id: 'i1', title: 'Dedupe key ignores the trailing "i" on listing ids', status: 'explained', owner: 'us',
          cause: 'page_location for the same listing arrives as …-14615315i and …-14615315, so one session hashes to two keys.',
          fix: 'Strip a trailing "i" from the listing id segment before hashing.',
          impact: '~3.1% of sessions double-counted on 212 Dealer Spike sites.',
          confidence: 'verified', method: 'SELECT page_location, dedupe_key FROM ga4_hits WHERE host = \'ds-4471.dealerspike.com\' LIMIT 5',
          example: 'e1',
        },
        {
          id: 'i2', title: 'Backfill job skips days with late-arriving hits', status: 'approved', owner: 'us',
          cause: 'The job filters on load_date, but late hits land under the next day\'s partition.',
          fix: 'Filter on event_date with a 2-day lookback.',
          impact: 'Up to 0.8% of hits missing from any backfilled day.',
          confidence: 'inferred', method: 'read backfill.py:88; not run',
          quote: 'approved, fix it',
        },
        {
          id: 'i3', title: 'SPA route changes send page_view twice', status: 'explained', owner: 'other',

document.addEventListener('input', e => { if (e.target.dataset.draft) ui.drafts[e.target.dataset.draft] = e.target.value; });
document.addEventListener('change', e => {
  if (e.target.id === 'f-tool') ui.filter.tool = e.target.value;
  else if (e.target.id === 'f-agents') ui.filter.noAgents = e.target.checked;
  else if (e.target.id === 'f-files') ui.filter.files = e.target.checked;
  else return;
  render();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const d = e.target.dataset;
  if (d.answerInput) { const [log, id] = splitKey(d.answerInput); return answerQuestion(log, id, e.target.value); }
  if (!d.note || !e.target.value.trim()) return;
  const [log, ref] = splitKey(d.note), text = e.target.value.trim();
  ui.drafts[d.draft] = '';
  queue(log, { t: 'note', op: 'add', text, ...(ref ? { ref } : {}) }, ref ? `note (${ref}): ${text}` : `note: ${text}`, ref || null, `note: ${text}`);
});
// ---- Liveness: a new tool run lands on the working log every ~4 s ----
setInterval(() => {
  simTs = addSec(simTs, 4);
  const s = st(LIVE_LOG);
  s.activity.unshift({ ts: simTs, by: 'hook', ...LIVE_ROWS[liveIndex++ % LIVE_ROWS.length], fresh: true });
  if (s.activity.length > 350) s.activity.pop();
  if (document.activeElement?.tagName !== 'SELECT') render();
}, 4000);

window.currentTheme = () => document.documentElement.dataset.theme
  || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
window.mermaidSource = key => { const [log, name] = splitKey(key); return st(log).diagrams.find(d => d.name === name)?.mermaid; };
render();
</script>

<!-- Mermaid: renders every .mmd box; SVGs are cached per diagram + theme so the 4 s re-render never re-runs mermaid -->
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
const palettes = {
  dark: { primaryColor: '#0c2f48', primaryTextColor: '#d8e6f2', primaryBorderColor: '#38bdf8', lineColor: '#5f7d96',
    secondaryColor: '#0f1e2c', tertiaryColor: '#0c1925', background: '#0f1e2c', mainBkg: '#0c2f48', edgeLabelBackground: '#0f1e2c',
    actorBkg: '#0c2f48', actorBorder: '#38bdf8', actorTextColor: '#d8e6f2', actorLineColor: '#1f5a82', signalColor: '#8299ae', signalTextColor: '#d8e6f2' },
  light: { primaryColor: '#e0f2fe', primaryTextColor: '#0d1f2e', primaryBorderColor: '#0284c7', lineColor: '#7b93a8',
    secondaryColor: '#ffffff', tertiaryColor: '#f3f7fb', background: '#ffffff', mainBkg: '#e0f2fe', edgeLabelBackground: '#ffffff',
    actorBkg: '#e0f2fe', actorBorder: '#0284c7', actorTextColor: '#0d1f2e', actorLineColor: '#7cc4ee', signalColor: '#557087', signalTextColor: '#0d1f2e' },
};
const cache = new Map();
let pass = 0, busy = false, again = false;
async function fill() {
  if (busy) { again = true; return; }
  busy = true;
  const theme = window.currentTheme();
  for (const el of document.querySelectorAll('.mmd')) {
    const key = `${el.dataset.mmd}|${theme}`;
    if (cache.has(key)) { el.innerHTML = cache.get(key); continue; }
    el.innerHTML = '<span class="hint">rendering…</span>';
    mermaid.initialize({ startOnLoad: false, theme: 'base', securityLevel: 'strict', fontFamily: "'Fragment Mono', ui-monospace, monospace",
      themeVariables: { ...palettes[theme], fontFamily: "'Fragment Mono', ui-monospace, monospace", fontSize: '13px' },
      flowchart: { curve: 'basis' }, sequence: { mirrorActors: false } });
    try {
      const { svg } = await mermaid.render(`dgm-${++pass}`, window.mermaidSource(el.dataset.mmd));
      cache.set(key, svg);
    } catch (err) { cache.set(key, `<span class="hint">Diagram failed to render: ${String(err.message || err).replace(/</g, '&lt;')}</span>`); }
    document.querySelectorAll('.mmd').forEach(x => { if (`${x.dataset.mmd}|${theme}` === key) x.innerHTML = cache.get(key); });
  }
  busy = false;
  if (again) { again = false; fill(); }
}
await document.fonts.ready;
window.addEventListener('rendered', fill);
window.addEventListener('themechange', fill);
fill();
</script>
</body>
